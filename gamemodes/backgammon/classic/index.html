<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardHack — Нарды</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/boardhack.css" />
  <style>
    .board-wrap { max-width: 720px; }
    .bg-wrap {
      width: 100%;
      user-select: none;
      touch-action: manipulation;
    }
    .bg-board {
      display: grid;
      grid-template-columns: 1fr 52px;
      gap: 0.5rem;
      background: #1a1f27;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 0.55rem;
      box-shadow: 0 0 0 1px var(--border-soft), 0 12px 40px rgba(0,0,0,0.45);
    }
    .bg-field {
      display: grid;
      grid-template-rows: 1fr 36px 1fr;
      grid-template-columns: 1fr 44px 1fr;
      min-height: min(62vw, 420px);
      background: #12161c;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .bg-quad {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
      padding: 2px;
      background: #0e1218;
    }
    .bg-quad.top { align-items: start; }
    .bg-quad.bot { align-items: end; }
    .bg-bar {
      background: linear-gradient(180deg, #2a3140, #1a1f28);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0.35rem 0.15rem;
      position: relative;
    }
    .bg-bar.bot { justify-content: flex-end; }
    .bg-bar-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-90deg);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
      pointer-events: none;
    }
    .bg-mid {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: #161b22;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.25rem 0.5rem;
    }
    .bg-point {
      position: relative;
      height: 100%;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      border-radius: 4px;
    }
    .bg-quad.top .bg-point { justify-content: flex-start; }
    .bg-quad.bot .bg-point { justify-content: flex-end; }
    .bg-point::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      width: 84%;
      height: 88%;
      pointer-events: none;
      z-index: 0;
    }
    .bg-quad.top .bg-point::before {
      top: 0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    .bg-quad.bot .bg-point::before {
      bottom: 0;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }
    .bg-point.light::before { background: #3d4a3a; }
    .bg-point.dark::before { background: #2a2220; }
    .bg-point.selected { box-shadow: inset 0 0 0 2px var(--accent); }
    .bg-point.legal::after {
      content: "";
      position: absolute;
      width: 18%;
      height: 18%;
      max-width: 14px;
      max-height: 14px;
      border-radius: 50%;
      background: rgba(159, 239, 0, 0.7);
      z-index: 3;
      pointer-events: none;
      left: 50%;
      transform: translateX(-50%);
    }
    .bg-quad.top .bg-point.legal::after { bottom: 6%; }
    .bg-quad.bot .bg-point.legal::after { top: 6%; }
    .bg-point.legal-hit { box-shadow: inset 0 0 0 2px rgba(255, 62, 62, 0.7); }
    .bg-checkers {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 4px 0;
      gap: 2px;
      pointer-events: none;
    }
    .bg-quad.bot .bg-checkers { flex-direction: column-reverse; }
    .bg-chip {
      width: 78%;
      max-width: 34px;
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.45), inset 0 2px 3px rgba(255,255,255,0.15);
      flex-shrink: 0;
      pointer-events: auto;
      cursor: grab;
    }
    .bg-chip.w {
      background: radial-gradient(circle at 35% 30%, #f5f7fa, #cfd5dd 55%, #9aa3b0);
      border: 2px solid #e8edf2;
    }
    .bg-chip.b {
      background: radial-gradient(circle at 35% 30%, #3a4048, #1a1d21 55%, #0b0e11);
      border: 2px solid #2a2f36;
    }
    .bg-chip.overflow {
      font-size: 0.65rem;
      font-family: var(--mono);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 700;
    }
    .bg-chip.w.overflow { color: #1a1d21; }
    .bg-off {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .bg-tray {
      flex: 1;
      background: #0e1218;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 120px;
      cursor: pointer;
      position: relative;
    }
    .bg-tray.legal {
      box-shadow: inset 0 0 0 2px var(--accent);
    }
    .bg-tray-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .bg-tray-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex: 1;
      justify-content: flex-start;
      width: 100%;
    }
    .bg-tray .bg-chip { max-width: 28px; width: 70%; }
    .bg-bar-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-height: 48px;
      width: 100%;
      z-index: 1;
      padding: 0.15rem 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .bg-bar-stack.legal {
      box-shadow: inset 0 0 0 2px var(--accent);
    }
    .bg-bar-stack .bg-chip { max-width: 26px; width: 85%; }
    .bg-dice-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .bg-die {
      width: 36px;
      height: 36px;
      border-radius: 7px;
      background: #f0f2f5;
      color: #12161c;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1.15rem;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      border: 2px solid #c8cdd5;
    }
    .bg-die.used {
      opacity: 0.35;
      text-decoration: line-through;
    }
    .bg-die.pending {
      box-shadow: 0 0 0 2px var(--accent), 0 2px 6px rgba(0,0,0,0.35);
    }
    .bg-pip {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    @media (max-width: 720px) {
      .bg-board { grid-template-columns: 1fr; }
      .bg-off {
        flex-direction: row;
        order: 2;
      }
      .bg-tray { min-height: 72px; flex-direction: row; gap: 0.35rem; }
      .bg-tray-stack { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .bg-field { min-height: 360px; }
      .bg-point { min-height: 110px; }
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <a href="../../../index.html">
        <div class="brand-mark">♞</div>
        <div>Board<span class="accent">Hack</span></div>
      </a>
      <span class="mode-badge" id="modeBadge">нарды · классика</span>
    </div>
    <div class="topbar-actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" id="langRu" data-lang="ru">RU</button>
        <span class="lang-sep">|</span>
        <button type="button" id="langEn" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="layout">
    <section class="card">
      <div class="card-title" id="playAreaTitle"></div>
      <div class="status-bar" id="statusBar">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText"></span>
      </div>
      <div class="board-wrap">
        <div class="bg-wrap" id="boardWrap">
          <div class="bg-board" id="bgBoard" aria-label="Backgammon board"></div>
        </div>
        <div class="thinking" id="thinking"><div class="thinking-pill" id="thinkingText"></div></div>
      </div>
      <div class="bg-dice-row" id="diceRow" style="margin-top:0.85rem">
        <button type="button" class="btn btn-primary" id="rollBtn" style="display:none" hidden aria-hidden="true"></button>
        <div id="diceDisplay" class="bg-dice-row"></div>
        <span class="bg-pip" id="pipInfo"></span>
      </div>
    </section>

    <aside class="side-stack">
      <section class="card" id="missionCard">
        <div class="card-title" id="missionTitle"></div>
        <div class="controls">
          <div id="sideSelectWrap">
            <label class="field-label" for="sideSelect" id="sideSelectLabel"></label>
            <select id="sideSelect">
              <option value="w" selected></option>
              <option value="b"></option>
            </select>
          </div>
          <div id="difficultyWrap">
            <label class="field-label" for="difficulty" id="diffLabel"></label>
            <select id="difficulty">
              <option value="easy"></option>
              <option value="medium" selected></option>
              <option value="hard"></option>
            </select>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-primary" id="newGameBtn"></button>
            <button type="button" class="btn btn-ghost" id="rulesBtn"></button>
          </div>
        </div>
      </section>


      <section class="card mp-card" id="mpCard">
        <div class="card-title" id="mpTitle">Мультиплеер</div>
        <div class="mp-conn" id="mpConnRow">
          <span class="mp-conn-dot" id="mpConnDot"></span>
          <span id="mpConnText">офлайн</span>
        </div>
        <div id="mpLobby">
          <div class="btn-row">
            <button type="button" class="btn btn-primary" id="mpCreateBtn">Создать комнату</button>
            <button type="button" class="btn btn-ghost" id="mpJoinToggleBtn">Войти</button>
          </div>
          <div id="mpJoinPanel" class="mp-hidden" style="margin-top:0.65rem">
            <div class="mp-join-row">
              <input type="text" id="mpJoinCode" maxlength="8" autocomplete="off" spellcheck="false" placeholder="КОД" />
              <button type="button" class="btn btn-primary" id="mpJoinBtn">OK</button>
            </div>
          </div>
          <p class="mp-hint" id="mpHint">Пригласите друга по коду. Аккаунт не нужен.</p>
        </div>
        <div id="mpActive" class="mp-hidden">
          <div class="mp-code-box">
            <div class="mp-code-label" id="mpCodeLabel">Код комнаты</div>
            <div class="mp-code-value" id="mpCodeValue">------</div>
            <div class="mp-share-link" id="mpShareLink"></div>
          </div>
          <div class="mp-seats">
            <div class="mp-seat" id="mpSeatW" role="button" tabindex="0">White — …</div>
            <div class="mp-seat" id="mpSeatB" role="button" tabindex="0">Black — …</div>
          </div>
          <p class="mp-seat-pick-hint mp-hidden" id="mpSeatPickHint"></p>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="mpCopyBtn">Копировать</button>
            <button type="button" class="btn btn-ghost" id="mpLeaveBtn">Выйти</button>
            <button type="button" class="btn btn-primary mp-hidden" id="mpResetBtn"></button>
          </div>
          <p class="mp-hint" id="mpActiveHint"></p>
        </div>
      </section>

      <section class="card">
        <div class="card-title" id="sessionTitle"></div>
        <div class="meta-grid">
          <div class="meta-item">
            <div class="k" id="metaSideK"></div>
            <div class="v" id="sideLabel"></div>
          </div>
          <div class="meta-item">
            <div class="k" id="metaTurnK"></div>
            <div class="v" id="turnLabel"></div>
          </div>
          <div class="meta-item">
            <div class="k" id="metaMovesK"></div>
            <div class="v" id="moveCount">0</div>
          </div>
          <div class="meta-item">
            <div class="k" id="metaOppK"></div>
            <div class="v" id="oppLabel"></div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-title" id="historyTitle"></div>
        <div class="move-list" id="moveList"></div>
      </section>
    </aside>
  </div>
  <footer class="footer">BoardHack</footer>
</main>

<dialog class="rules-dialog" id="rulesDialog" aria-labelledby="rulesTitle">
  <div class="rules-dialog-head">
    <h2 class="card-title" id="rulesTitle"></h2>
    <button type="button" class="rules-dialog-close" id="rulesCloseBtn" aria-label="Close">×</button>
  </div>
  <div class="rules-box" id="rulesBox"></div>
</dialog>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  function t(key) {
    var pack = I18N[lang] || I18N.ru;
    return pack[key] != null ? pack[key] : (I18N.en[key] || key);
  }

  function opp(c) { return c === "w" ? "b" : "w"; }

  function emptyPoint() { return { color: null, count: 0 }; }

  function cloneState(st) {
    var pts = new Array(25);
    for (var i = 0; i <= 24; i++) {
      if (i === 0) { pts[i] = emptyPoint(); continue; }
      pts[i] = { color: st.points[i].color, count: st.points[i].count };
    }
    return {
      points: pts,
      bar: { w: st.bar.w, b: st.bar.b },
      off: { w: st.off.w, b: st.off.b },
      turn: st.turn,
      winner: st.winner
    };
  }

  function setPoint(pts, n, color, count) {
    pts[n] = { color: count > 0 ? color : null, count: count };
  }

  function initialState() {
    var pts = new Array(25);
    for (var i = 0; i <= 24; i++) pts[i] = emptyPoint();
    // Standard opening
    setPoint(pts, 24, "w", 2);
    setPoint(pts, 13, "w", 5);
    setPoint(pts, 8, "w", 3);
    setPoint(pts, 6, "w", 5);
    setPoint(pts, 1, "b", 2);
    setPoint(pts, 12, "b", 5);
    setPoint(pts, 17, "b", 3);
    setPoint(pts, 19, "b", 5);
    return {
      points: pts,
      bar: { w: 0, b: 0 },
      off: { w: 0, b: 0 },
      turn: "w",
      winner: null
    };
  }

  function homePos(player, point) {
    return player === "w" ? point : (25 - point);
  }

  function pointFromHome(player, hp) {
    return player === "w" ? hp : (25 - hp);
  }

  function allInHome(st, player) {
    if (st.bar[player] > 0) return false;
    if (player === "w") {
      for (var i = 7; i <= 24; i++) {
        if (st.points[i].color === "w" && st.points[i].count > 0) return false;
      }
    } else {
      for (var j = 1; j <= 18; j++) {
        if (st.points[j].color === "b" && st.points[j].count > 0) return false;
      }
    }
    return true;
  }

  function maxOccupiedHomePos(st, player) {
    var max = 0;
    for (var i = 1; i <= 24; i++) {
      if (st.points[i].color === player && st.points[i].count > 0) {
        var hp = homePos(player, i);
        if (hp > max) max = hp;
      }
    }
    return max;
  }

  function canLand(st, player, point) {
    if (point < 1 || point > 24) return false;
    var p = st.points[point];
    if (p.count === 0) return true;
    if (p.color === player) return true;
    if (p.count === 1) return true; // hit blot
    return false;
  }

  function destFor(player, from, die) {
    // from === 0 means bar
    if (from === 0) {
      return player === "w" ? (25 - die) : die;
    }
    return player === "w" ? (from - die) : (from + die);
  }

  function isBearOffDest(player, dest) {
    if (player === "w") return dest <= 0;
    return dest >= 25;
  }

  function canBearOffFrom(st, player, from, die) {
    if (!allInHome(st, player)) return false;
    if (from < 1 || from > 24) return false;
    if (st.points[from].color !== player || st.points[from].count <= 0) return false;
    var hp = homePos(player, from);
    if (die === hp) return true;
    if (die > hp) return hp === maxOccupiedHomePos(st, player);
    return false;
  }

  /** Single-die candidate moves from a position. from=0 is bar. */
  function getSingleMoves(st, player, die) {
    var moves = [];
    if (st.bar[player] > 0) {
      var entry = destFor(player, 0, die);
      if (canLand(st, player, entry)) {
        var hitBar = st.points[entry].color === opp(player) && st.points[entry].count === 1;
        moves.push({ from: 0, to: entry, die: die, hit: hitBar, bear: false });
      }
      return moves;
    }

    for (var p = 1; p <= 24; p++) {
      if (st.points[p].color !== player || st.points[p].count <= 0) continue;
      var dest = destFor(player, p, die);
      if (isBearOffDest(player, dest)) {
        if (canBearOffFrom(st, player, p, die)) {
          moves.push({ from: p, to: "off", die: die, hit: false, bear: true });
        }
      } else if (canLand(st, player, dest)) {
        var hit = st.points[dest].color === opp(player) && st.points[dest].count === 1;
        moves.push({ from: p, to: dest, die: die, hit: hit, bear: false });
      }
    }
    return moves;
  }

  function applyMove(st, player, move) {
    var n = cloneState(st);
    if (move.from === 0) {
      n.bar[player]--;
    } else {
      var fp = n.points[move.from];
      fp.count--;
      if (fp.count === 0) fp.color = null;
    }
    if (move.bear) {
      n.off[player]++;
    } else {
      var tp = n.points[move.to];
      if (move.hit) {
        tp.count = 0;
        tp.color = null;
        n.bar[opp(player)]++;
      }
      if (tp.color === player) {
        tp.count++;
      } else {
        tp.color = player;
        tp.count = 1;
      }
    }
    if (n.off[player] >= 15) n.winner = player;
    return n;
  }

  function moveKey(m) {
    return m.from + ">" + m.to + ":" + m.die;
  }

  function playKey(play) {
    return play.moves.map(moveKey).join("|");
  }

  /** All maximal legal full plays for the given dice array. */
  function legalPlays(st, player, diceValues) {
    var results = [];
    function rec(cur, remaining, movesSoFar) {
      var progressed = false;
      var seenDie = {};
      for (var i = 0; i < remaining.length; i++) {
        var die = remaining[i];
        if (seenDie[die]) continue;
        seenDie[die] = true;
        var singles = getSingleMoves(cur, player, die);
        for (var j = 0; j < singles.length; j++) {
          progressed = true;
          var next = applyMove(cur, player, singles[j]);
          var rem = remaining.slice();
          rem.splice(i, 1);
          movesSoFar.push(singles[j]);
          rec(next, rem, movesSoFar);
          movesSoFar.pop();
        }
      }
      if (!progressed) {
        results.push({ moves: movesSoFar.slice(), state: cloneState(cur) });
      }
    }
    if (!diceValues.length) {
      return [{ moves: [], state: cloneState(st) }];
    }
    rec(st, diceValues.slice(), []);

    var maxLen = 0;
    for (var k = 0; k < results.length; k++) {
      if (results[k].moves.length > maxLen) maxLen = results[k].moves.length;
    }
    var filtered = results.filter(function (r) { return r.moves.length === maxLen; });

    // If two different dice and only one can be used, must use the higher
    if (diceValues.length >= 2) {
      var uniqDice = [];
      for (var u = 0; u < diceValues.length; u++) {
        if (uniqDice.indexOf(diceValues[u]) < 0) uniqDice.push(diceValues[u]);
      }
      if (uniqDice.length === 2 && maxLen === 1) {
        var higher = Math.max(uniqDice[0], uniqDice[1]);
        var higherOnly = filtered.filter(function (r) {
          return r.moves.length && r.moves[0].die === higher;
        });
        if (higherOnly.length) filtered = higherOnly;
      }
    }

    // Dedupe by move sequence
    var seen = {};
    var out = [];
    for (var x = 0; x < filtered.length; x++) {
      var key = playKey(filtered[x]);
      if (seen[key]) continue;
      seen[key] = true;
      out.push(filtered[x]);
    }
    return out;
  }

  function firstMovesFromPlays(plays) {
    var seen = {};
    var list = [];
    for (var i = 0; i < plays.length; i++) {
      if (!plays[i].moves.length) continue;
      var m = plays[i].moves[0];
      var k = moveKey(m);
      if (seen[k]) continue;
      seen[k] = true;
      list.push(m);
    }
    return list;
  }

  function refreshTurnPlays() {
    turnPlays = legalPlays(state, state.turn, remainingDice);
  }

  function pipCount(st, player) {
    var pips = st.bar[player] * 25;
    for (var i = 1; i <= 24; i++) {
      if (st.points[i].color === player) {
        pips += st.points[i].count * homePos(player, i);
      }
    }
    return pips;
  }

  // ---- Bot ----
  function scoreStateFor(st, player) {
    var score = 0;
    score += st.off[player] * 120;
    score -= st.off[opp(player)] * 120;
    score -= pipCount(st, player) * 1.1;
    score += pipCount(st, opp(player)) * 0.9;
    score -= st.bar[player] * 40;
    score += st.bar[opp(player)] * 35;

    for (var i = 1; i <= 24; i++) {
      var p = st.points[i];
      if (p.color === player) {
        if (p.count >= 2) score += 8 + Math.min(p.count, 5);
        if (p.count === 1) {
          // blot penalty, worse in opponent home
          var inOppHome = (player === "w") ? (i >= 19) : (i <= 6);
          score -= inOppHome ? 28 : 12;
        }
      } else if (p.color === opp(player) && p.count === 1) {
        score += 3; // opponent blot pressure
      }
    }
    // Prefer primes / blocks in opponent path — light bonus for consecutive points
    var run = 0;
    for (var j = 1; j <= 24; j++) {
      var pt = player === "w" ? (25 - j) : j;
      if (st.points[pt].color === player && st.points[pt].count >= 2) {
        run++;
        if (run >= 2) score += 4 * run;
      } else run = 0;
    }
    if (st.winner === player) score += 10000;
    if (st.winner === opp(player)) score -= 10000;
    return score;
  }

  function pickBotPlay(st, dice, diff) {
    var plays = legalPlays(st, st.turn, dice);
    if (!plays.length) return null;
    if (plays.length === 1 && !plays[0].moves.length) return plays[0];
    if (diff === "easy") {
      return plays[Math.floor(Math.random() * plays.length)];
    }
    var player = st.turn;
    var best = null;
    var bestScore = -Infinity;
    for (var i = 0; i < plays.length; i++) {
      var sc = scoreStateFor(plays[i].state, player);
      if (diff === "hard") {
        // Cheap 1-ply: assume opponent gets average-ish blot hit threat
        sc += opponentThreatPenalty(plays[i].state, player) * -0.35;
      }
      // slight noise for variety
      sc += (Math.random() - 0.5) * (diff === "hard" ? 2 : 8);
      if (sc > bestScore) {
        bestScore = sc;
        best = plays[i];
      }
    }
    return best || plays[0];
  }

  function opponentThreatPenalty(st, player) {
    // Count our blots that opponent could hit with common dice (estimate)
    var danger = 0;
    var enemy = opp(player);
    for (var i = 1; i <= 24; i++) {
      if (st.points[i].color !== player || st.points[i].count !== 1) continue;
      for (var d = 1; d <= 6; d++) {
        var from = enemy === "w" ? (i + d) : (i - d);
        if (from >= 1 && from <= 24 && st.points[from].color === enemy && st.points[from].count > 0) {
          danger += 1;
        }
        // bar entry hits
        if (st.bar[enemy] > 0) {
          var entry = destFor(enemy, 0, d);
          if (entry === i) danger += 2;
        }
      }
    }
    return danger;
  }

  // ---- UI helpers ----

  /* ---- Multiplayer ---- */
  var mpActive = false;
  var mpSocket = null;
  var mpRoomCode = null;
  var mpSeat = null;
  var mpRoom = null;
  var mpConnState = "offline";
  var mpServerUrl = DEFAULT_SERVER;
  var mpApplyingRemote = false;
  var mpPublishTimer = null;

  function getOrCreateClientId() {
    var id = null;
    try { id = localStorage.getItem(CLIENT_ID_KEY); } catch (e) {}
    if (!id || id.length < 8) {
      id = "c_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem(CLIENT_ID_KEY, id); } catch (e) {}
    }
    return id;
  }

  function resolveServerUrl() {
    var params = new URLSearchParams(window.location.search);
    var s = params.get("server");
    if (s) {
      s = s.trim();
      if (s.indexOf("://") === -1) s = "http://" + s;
      return s.replace(/\/$/, "");
    }
    return DEFAULT_SERVER;
  }

  function isMultiplayer() { return mpActive && !!mpSeat; }

  function mpBothSeated() {
    if (!mpRoom || !mpRoom.seats) return false;
    return !!(mpRoom.seats.w && mpRoom.seats.w.occupied && mpRoom.seats.b && mpRoom.seats.b.occupied);
  }

  function buildShareLink(code) {
    var u = new URL(window.location.href);
    u.searchParams.set("room", code);
    if (mpServerUrl && mpServerUrl !== DEFAULT_SERVER) u.searchParams.set("server", mpServerUrl);
    else u.searchParams.delete("server");
    return u.toString();
  }

  function setMpConn(state, detail) {
    mpConnState = state;
    var dot = document.getElementById("mpConnDot");
    if (!dot) return;
    dot.className = "mp-conn-dot";
    var label = t("mpOffline");
    if (state === "connecting") { dot.classList.add("waiting"); label = t("mpConnecting"); }
    else if (state === "connected") { dot.classList.add("online"); label = t("mpConnected"); }
    else if (state === "waiting") { dot.classList.add("waiting"); label = t("mpWaiting"); }
    else if (state === "playing") { dot.classList.add("online"); label = t("mpPlaying"); }
    else if (state === "error") { dot.classList.add("error"); label = detail || t("mpError"); }
    else { dot.classList.add("offline"); }
    document.getElementById("mpConnText").textContent = label;
  }

  function seatLabel(color) {
    if (!mpRoom || !mpRoom.seats) return t("mpSeatEmpty");
    var s = mpRoom.seats[color];
    if (!s || !s.occupied) return t("mpSeatEmpty");
    if (mpSeat === color) return t("mpSeatYou");
    return s.connected ? t("mpSeatOpp") : t("mpSeatOffline");
  }

  function mpAloneCanSwitch() {
    if (!isMultiplayer() || !mpRoom || !mpRoom.seats || !mpSeat) return false;
    if (mpBothSeated()) return false;
    var wOcc = !!(mpRoom.seats.w && mpRoom.seats.w.occupied);
    var bOcc = !!(mpRoom.seats.b && mpRoom.seats.b.occupied);
    return (wOcc ? 1 : 0) + (bOcc ? 1 : 0) === 1;
  }

  function claimMpSeat(color) {
    color = color === "b" ? "b" : "w";
    if (!mpAloneCanSwitch() || !mpSocket || !mpRoomCode) return;
    if (color === mpSeat) return;
    mpSocket.emit("claimSeat", { clientId: getOrCreateClientId(), code: mpRoomCode, seat: color }, function (res) {
      if (!res || !res.ok) {
        if (res && res.error === "seats_locked") return;
        setMpConn("error", (res && res.error) || t("mpError"));
        return;
      }
      applyMpRoom(res);
    });
  }

  function toggleClass(el, cls, on) {
    if (!el) return;
    if (on) el.classList.add(cls); else el.classList.remove(cls);
  }

  function updateOpponentLabel() {
    document.getElementById("metaOppK").textContent = t("metaOpp");
    document.getElementById("oppLabel").textContent = isMultiplayer()
      ? t("mpOpponent")
      : (t("metaBot") + " — " + t(diffLabelKey()));
  }

  function updateMpUI() {
    var title = document.getElementById("mpTitle");
    if (!title) return;
    title.textContent = t("mpTitle");
    toggleClass(document.getElementById("missionCard"), "mp-hidden", isMultiplayer());
    var showReset = isMultiplayer() && mpRoom && mpRoom.hostId === getOrCreateClientId();
    toggleClass(document.getElementById("mpResetBtn"), "mp-hidden", !showReset);
    if (!mpActive) {
      toggleClass(document.getElementById("mpLobby"), "mp-hidden", false);
      toggleClass(document.getElementById("mpActive"), "mp-hidden", true);
      toggleClass(document.getElementById("sideSelectWrap"), "mp-hidden", false);
      toggleClass(document.getElementById("difficultyWrap"), "mp-hidden", false);
      return;
    }
    toggleClass(document.getElementById("mpLobby"), "mp-hidden", true);
    toggleClass(document.getElementById("mpActive"), "mp-hidden", false);
    toggleClass(document.getElementById("sideSelectWrap"), "mp-hidden", true);
    toggleClass(document.getElementById("difficultyWrap"), "mp-hidden", true);
    document.getElementById("mpCodeValue").textContent = mpRoomCode || "------";
    document.getElementById("mpShareLink").textContent = mpRoomCode ? buildShareLink(mpRoomCode) : "";
    var canPick = mpAloneCanSwitch();
    var seatW = document.getElementById("mpSeatW");
    var seatB = document.getElementById("mpSeatB");
    seatW.textContent = t("sideWhite") + " — " + seatLabel("w");
    seatB.textContent = t("sideBlack") + " — " + seatLabel("b");
    toggleClass(seatW, "you", mpSeat === "w");
    toggleClass(seatB, "you", mpSeat === "b");
    toggleClass(seatW, "filled", !!(mpRoom && mpRoom.seats.w && mpRoom.seats.w.occupied));
    toggleClass(seatB, "filled", !!(mpRoom && mpRoom.seats.b && mpRoom.seats.b.occupied));
    toggleClass(seatW, "pickable", canPick && mpSeat !== "w");
    toggleClass(seatB, "pickable", canPick && mpSeat !== "b");
    var hint = document.getElementById("mpSeatPickHint");
    if (canPick) { toggleClass(hint, "mp-hidden", false); hint.textContent = t("mpSeatPickHint"); }
    else { toggleClass(hint, "mp-hidden", true); hint.textContent = ""; }
    var both = mpBothSeated();
    var ah = document.getElementById("mpActiveHint");
    toggleClass(ah, "mp-hidden", both);
    ah.textContent = both ? "" : t("mpWaitingHint");
    document.getElementById("sideSelect").value = userColor;
    document.getElementById("sideLabel").textContent = userColor === "w" ? t("sideWhite") : t("sideBlack");
    updateOpponentLabel();
  }

  function serializeBgState() {
    var pts = [];
    for (var i = 0; i <= 24; i++) {
      if (!state || !state.points || !state.points[i]) pts[i] = { color: null, count: 0 };
      else pts[i] = { color: state.points[i].color, count: state.points[i].count };
    }
    var out = {
      points: pts,
      off: state && state.off ? { w: state.off.w, b: state.off.b } : { w: 0, b: 0 },
      turn: state ? state.turn : "w",
      winner: state ? state.winner : null,
      phase: phase,
      rolledDice: rolledDice.slice(),
      remainingDice: remainingDice.slice(),
      history: moveHistory.slice()
    };
    if (state && state.bar) out.bar = { w: state.bar.w, b: state.bar.b };
    if (typeof headLeft !== "undefined") out.headLeft = headLeft;
    return out;
  }

  function applyBgPayload(bg, opts) {
    opts = opts || {};
    if (!bg) return;
    var pts = new Array(25);
    for (var i = 0; i <= 24; i++) pts[i] = emptyPoint();
    if (Array.isArray(bg.points)) {
      for (var j = 1; j <= 24; j++) {
        var p = bg.points[j];
        if (!p) continue;
        pts[j] = { color: p.count > 0 ? p.color : null, count: p.count || 0 };
      }
    }
    state = {
      points: pts,
      off: { w: (bg.off && bg.off.w) || 0, b: (bg.off && bg.off.b) || 0 },
      turn: bg.turn === "b" ? "b" : "w",
      winner: bg.winner === "w" || bg.winner === "b" ? bg.winner : null
    };
    if (bg.bar) state.bar = { w: bg.bar.w || 0, b: bg.bar.b || 0 };
    else if (!state.bar && GAME_MODE === "backgammon") state.bar = { w: 0, b: 0 };
    phase = bg.phase === "move" || bg.phase === "over" ? bg.phase : "roll";
    if (state.winner) phase = "over";
    rolledDice = Array.isArray(bg.rolledDice) ? bg.rolledDice.slice() : [];
    remainingDice = Array.isArray(bg.remainingDice) ? bg.remainingDice.slice() : [];
    if (Array.isArray(bg.history)) moveHistory = bg.history.slice();
    else if (Array.isArray(bg.plySans)) moveHistory = bg.plySans.slice();
    if (typeof headLeft !== "undefined") {
      headLeft = bg.headLeft === 0 ? 0 : (phase === "roll" ? 1 : (bg.headLeft == null ? 1 : bg.headLeft));
    }
    selectedFrom = null;
    botThinking = false;
    document.getElementById("thinking").classList.remove("show");
    if (phase === "move") refreshTurnPlays();
    else turnPlays = [];
    renderAll();
    if (!opts.skipAutoRoll && isMultiplayer() && mpBothSeated() && phase === "roll" && !state.winner && isUserTurn()) {
      scheduleAutoRoll();
    }
  }

  function publishBgState(extra) {
    if (!isMultiplayer() || !mpSocket || mpApplyingRemote) return;
    extra = extra || {};
    var bg = serializeBgState();
    var payload = {
      clientId: getOrCreateClientId(),
      code: mpRoomCode,
      fen: "bg " + (state ? state.turn : "w"),
      bg: bg,
      plySans: moveHistory.slice(),
      gameOver: !!(state && state.winner),
      stateSync: !!extra.stateSync
    };
    if (extra.from != null) payload.from = String(extra.from);
    if (extra.to != null) payload.to = String(extra.to);
    if (extra.san) payload.san = extra.san;
    if (!payload.stateSync && (payload.from == null || payload.to == null)) {
      payload.stateSync = true;
    }
    mpSocket.emit("makeMove", payload);
    if (mpRoom) {
      mpRoom.bg = bg;
      mpRoom.fen = payload.fen;
      mpRoom.plySans = moveHistory.slice();
      if (state && state.winner) mpRoom.status = "finished";
    }
  }

  function ensureMpSocket(cb) {
    mpServerUrl = resolveServerUrl();
    if (mpSocket && mpSocket.connected) { if (cb) cb(null); return; }
    if (typeof io === "undefined") { setMpConn("error", t("mpError")); if (cb) cb(new Error("socket.io missing")); return; }
    setMpConn("connecting");
    if (mpSocket) { try { mpSocket.removeAllListeners(); mpSocket.disconnect(); } catch (e) {} mpSocket = null; }
    mpSocket = io(mpServerUrl, { transports: ["websocket", "polling"], reconnection: true, reconnectionAttempts: 12, timeout: 8000 });
    mpSocket.on("connect", function () {
      setMpConn(mpBothSeated() ? "playing" : (mpActive ? "waiting" : "connected"));
      if (mpActive && mpRoomCode) {
        mpSocket.emit("reconnectRoom", { clientId: getOrCreateClientId(), code: mpRoomCode }, function (res) {
          if (res && res.ok) applyMpRoom(res);
        });
      }
      if (cb) { var f = cb; cb = null; f(null); }
    });
    mpSocket.on("connect_error", function () {
      setMpConn("error", t("mpError"));
      if (cb) { var f = cb; cb = null; f(new Error("connect_error")); }
    });
    mpSocket.on("disconnect", function () {
      if (mpActive) setMpConn("error", t("mpError"));
      else setMpConn("offline");
    });
    mpSocket.on("roomState", function (msg) {
      if (msg && msg.room) applyMpRoom({ room: msg.room, seat: msg.room.yourSeat || mpSeat, code: msg.room.code });
    });
    mpSocket.on("moveApplied", function (msg) {
      if (!mpActive || !msg) return;
      if (msg.by === mpSeat && !mpApplyingRemote) return;
      mpApplyingRemote = true;
      try {
        clearTurnTimers();
        if (msg.bg) applyBgPayload(msg.bg, { skipAutoRoll: false });
        if (mpRoom) {
          if (msg.bg) mpRoom.bg = msg.bg;
          if (msg.fen) mpRoom.fen = msg.fen;
          if (msg.status) mpRoom.status = msg.status;
          if (Array.isArray(msg.plySans)) mpRoom.plySans = msg.plySans.slice();
        }
      } finally {
        mpApplyingRemote = false;
      }
      updateMpUI();
      updateStatus();
    });
    mpSocket.on("gameReset", function (msg) {
      if (!mpActive) return;
      clearTurnTimers();
      if (msg && msg.room) applyMpRoom({ room: msg.room, seat: mpSeat, code: mpRoomCode });
      if (msg && msg.room && msg.room.bg) applyBgPayload(msg.room.bg, { skipAutoRoll: false });
      else {
        state = initialState();
        remainingDice = [];
        rolledDice = [];
        phase = "roll";
        selectedFrom = null;
        moveHistory = [];
        if (typeof headLeft !== "undefined") headLeft = 1;
        botThinking = false;
        renderAll();
        if (mpBothSeated() && isUserTurn()) scheduleAutoRoll();
      }
    });
    mpSocket.on("opponentJoined", function () {
      updateMpUI();
      updateStatus();
      if (mpBothSeated() && phase === "roll" && !state.winner && isUserTurn()) scheduleAutoRoll();
    });
    mpSocket.on("opponentLeft", function () { setMpConn("waiting"); clearTurnTimers(); updateMpUI(); updateStatus(); });
    mpSocket.on("opponentDisconnected", function () { setMpConn("waiting"); updateMpUI(); updateStatus(); });
    mpSocket.on("opponentReconnected", function () {
      setMpConn(mpBothSeated() ? "playing" : "waiting");
      updateMpUI(); updateStatus();
    });
  }

  function applyMpRoom(res) {
    if (!res) return;
    if (res.room) mpRoom = res.room;
    if (res.code) mpRoomCode = res.code;
    if (res.seat) { mpSeat = res.seat; userColor = res.seat; try { localStorage.setItem(SIDE_KEY, userColor); } catch (e) {} }
    else if (res.room && res.room.yourSeat) {
      mpSeat = res.room.yourSeat; userColor = mpSeat;
      try { localStorage.setItem(SIDE_KEY, userColor); } catch (e) {}
    }
    mpActive = true;
    try { localStorage.setItem(MP_ROOM_KEY, mpRoomCode); } catch (e) {}
    setMpConn(mpBothSeated() ? "playing" : "waiting");
    updateMpUI();
    botThinking = false;
    document.getElementById("thinking").classList.remove("show");
    if (mpRoom && mpRoom.bg) applyBgPayload(mpRoom.bg, { skipAutoRoll: false });
    else if (!state) {
      state = initialState();
      phase = "roll";
      renderAll();
    }
    updateStatus();
  }

  function enterMpFromCreate() {
    ensureMpSocket(function (err) {
      if (err) return;
      clearTurnTimers();
      mpSocket.emit("createRoom", {
        clientId: getOrCreateClientId(),
        mode: GAME_MODE,
        preferredSeat: userColor === "b" ? "b" : "w"
      }, function (res) {
        if (!res || !res.ok) { setMpConn("error", (res && res.error) || t("mpError")); return; }
        applyMpRoom(res);
      });
    });
  }

  function enterMpFromJoin(code) {
    code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    if (!code) return;
    ensureMpSocket(function (err) {
      if (err) return;
      clearTurnTimers();
      mpSocket.emit("joinRoom", {
        clientId: getOrCreateClientId(),
        code: code,
        mode: GAME_MODE
      }, function (res) {
        if (!res || !res.ok) {
          var errKey = res && res.error;
          var msg = t("mpError");
          if (errKey === "room_not_found") msg = t("mpNotFound");
          if (errKey === "room_full") msg = t("mpRoomFull");
          if (errKey === "wrong_mode") msg = t("mpWrongMode");
          setMpConn("error", msg);
          return;
        }
        applyMpRoom(res);
      });
    });
  }

  function leaveMultiplayer() {
    if (mpSocket && mpRoomCode) {
      try { mpSocket.emit("leaveRoom", { clientId: getOrCreateClientId(), code: mpRoomCode }); } catch (e) {}
    }
    mpActive = false;
    mpRoomCode = null;
    mpSeat = null;
    mpRoom = null;
    try { localStorage.removeItem(MP_ROOM_KEY); } catch (e) {}
    if (mpSocket) {
      try { mpSocket.removeAllListeners(); mpSocket.disconnect(); } catch (e) {}
      mpSocket = null;
    }
    setMpConn("offline");
    updateMpUI();
    newGameLocal();
  }

  function tryAutoRejoin() {
    var params = new URLSearchParams(window.location.search);
    var roomParam = params.get("room");
    var saved = null;
    try { saved = localStorage.getItem(MP_ROOM_KEY); } catch (e) {}
    var code = (roomParam || saved || "").toUpperCase().trim();
    if (!code) return;
    ensureMpSocket(function (err) {
      if (err) return;
      mpSocket.emit("reconnectRoom", { clientId: getOrCreateClientId(), code: code }, function (res) {
        if (res && res.ok) { applyMpRoom(res); return; }
        mpSocket.emit("joinRoom", { clientId: getOrCreateClientId(), code: code, mode: GAME_MODE }, function (res2) {
          if (res2 && res2.ok) applyMpRoom(res2);
          else if (roomParam) setMpConn("error", t("mpNotFound"));
        });
      });
    });
  }

  function wireMp() {
    document.getElementById("mpCreateBtn").addEventListener("click", function () { enterMpFromCreate(); });
    document.getElementById("mpJoinToggleBtn").addEventListener("click", function () {
      var panel = document.getElementById("mpJoinPanel");
      panel.classList.toggle("mp-hidden");
      if (!panel.classList.contains("mp-hidden")) document.getElementById("mpJoinCode").focus();
    });
    document.getElementById("mpJoinBtn").addEventListener("click", function () {
      enterMpFromJoin(document.getElementById("mpJoinCode").value);
    });
    document.getElementById("mpJoinCode").addEventListener("keydown", function (e) {
      if (e.key === "Enter") enterMpFromJoin(document.getElementById("mpJoinCode").value);
    });
    document.getElementById("mpCopyBtn").addEventListener("click", function () {
      var link = buildShareLink(mpRoomCode);
      var btn = document.getElementById("mpCopyBtn");
      var done = function () {
        btn.textContent = t("mpCopied");
        setTimeout(function () { btn.textContent = t("mpCopy"); }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(done).catch(function () {
          try { window.prompt(t("mpCodeLabel"), link); } catch (e) {}
        });
      } else {
        try { window.prompt(t("mpCodeLabel"), link); done(); } catch (e) {}
      }
    });
    function seatHandler(color) {
      return function (e) {
        if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
        if (e.type === "keydown") e.preventDefault();
        claimMpSeat(color);
      };
    }
    document.getElementById("mpSeatW").addEventListener("click", seatHandler("w"));
    document.getElementById("mpSeatW").addEventListener("keydown", seatHandler("w"));
    document.getElementById("mpSeatB").addEventListener("click", seatHandler("b"));
    document.getElementById("mpSeatB").addEventListener("keydown", seatHandler("b"));
    document.getElementById("mpLeaveBtn").addEventListener("click", function () { leaveMultiplayer(); });
    document.getElementById("mpResetBtn").addEventListener("click", function () { newGame(); });
  }


  function isUserTurn() {
    if (!state || state.winner) return false;
    if (isMultiplayer()) {
      if (!mpBothSeated()) return false;
      return state.turn === mpSeat;
    }
    return state.turn === userColor;
  }

  function boardPointOrder() {
    // Visual layout from White's seat (userColor w) or flipped for black
    // top: 13-18 | 19-24
    // bot: 12-7  | 6-1
    var flipped = userColor === "b";
    if (!flipped) {
      return {
        topLeft: [13, 14, 15, 16, 17, 18],
        topRight: [19, 20, 21, 22, 23, 24],
        botLeft: [12, 11, 10, 9, 8, 7],
        botRight: [6, 5, 4, 3, 2, 1],
        topOff: "b",
        botOff: "w",
        barTop: "b",
        barBot: "w"
      };
    }
    // Flipped: Black's seat — reverse both axes
    return {
      topLeft: [12, 11, 10, 9, 8, 7],
      topRight: [6, 5, 4, 3, 2, 1],
      botLeft: [13, 14, 15, 16, 17, 18],
      botRight: [19, 20, 21, 22, 23, 24],
      topOff: "w",
      botOff: "b",
      barTop: "w",
      barBot: "b"
    };
  }

  function pointColorClass(n) {
    // Alternate triangles
    return (n % 2 === 0) ? "light" : "dark";
  }

  function legalNextMoves() {
    return firstMovesFromPlays(turnPlays);
  }

  function movesFromSelected(from) {
    return legalNextMoves().filter(function (m) { return m.from === from; });
  }

  function renderChips(color, count, interactiveFrom) {
    var html = "";
    var show = Math.min(count, MAX_VISIBLE);
    for (var i = 0; i < show; i++) {
      var extra = "";
      if (i === show - 1 && count > MAX_VISIBLE) {
        extra = " overflow";
        html += '<div class="bg-chip ' + color + extra + '" data-from="' + interactiveFrom + '">' + count + "</div>";
      } else {
        html += '<div class="bg-chip ' + color + '" data-from="' + interactiveFrom + '"></div>';
      }
    }
    return html;
  }

  function renderBoard() {
    var layout = boardPointOrder();
    var legal = phase === "move" && isUserTurn() && !botThinking ? legalNextMoves() : [];
    var legalFrom = {};
    var legalTo = {};
    var legalOff = false;
    for (var i = 0; i < legal.length; i++) {
      legalFrom[legal[i].from] = true;
      if (legal[i].bear) legalOff = true;
      else legalTo[legal[i].to] = legal[i];
    }
    var selectedTargets = {};
    var selectedOff = false;
    if (selectedFrom != null) {
      var sm = movesFromSelected(selectedFrom);
      for (var s = 0; s < sm.length; s++) {
        if (sm[s].bear) selectedOff = true;
        else selectedTargets[sm[s].to] = sm[s];
      }
    }

    function pointHtml(n, quadTop) {
      var p = state.points[n];
      var cls = "bg-point " + pointColorClass(n);
      if (selectedFrom === n) cls += " selected";
      if (selectedFrom != null) {
        var showLegal = selectedTargets[n];
        if (showLegal) {
          cls += " legal";
          if (showLegal.hit) cls += " legal-hit";
        }
      } else if (legalFrom[n]) {
        cls += " legal";
      }
      // Also highlight selectable sources lightly via chips
      var chips = "";
      if (p.count > 0) {
        chips = '<div class="bg-checkers">' + renderChips(p.color, p.count, n) + "</div>";
      }
      return '<div class="' + cls + '" data-point="' + n + '" title="' + n + '">' + chips + "</div>";
    }

    function quadHtml(arr, top) {
      var h = '<div class="bg-quad ' + (top ? "top" : "bot") + '">';
      for (var i = 0; i < arr.length; i++) h += pointHtml(arr[i], top);
      h += "</div>";
      return h;
    }

    function trayHtml(who, side) {
      var count = state.off[who];
      var cls = "bg-tray";
      if (selectedFrom != null && selectedOff && state.turn === who && phase === "move" && isUserTurn()) cls += " legal";
      var label = who === "w" ? t("trayOffW") : t("trayOffB");
      var chips = '<div class="bg-tray-stack">' + (count ? renderChips(who, count, "off") : "") + "</div>";
      return '<div class="' + cls + '" data-off="' + who + '"><div class="bg-tray-label">' + label + "</div>" + chips + "</div>";
    }

    function barStack(who) {
      var count = state.bar[who];
      var cls = "bg-bar-stack";
      if (selectedFrom === 0 && state.turn === who) cls += " selected";
      if (phase === "move" && isUserTurn() && state.turn === who && legalFrom[0]) cls += " legal";
      var chips = count ? renderChips(who, count, 0) : "";
      return '<div class="' + cls + '" data-bar="' + who + '">' + chips + "</div>";
    }

    var html = "";
    html += '<div class="bg-field">';
    html += quadHtml(layout.topLeft, true);
    html += '<div class="bg-bar top"><span class="bg-bar-label">' + t("barLabel") + "</span>";
    html += barStack(layout.barTop);
    html += "</div>";
    html += quadHtml(layout.topRight, true);
    html += '<div class="bg-mid"><span class="bg-pip" id="midPip"></span></div>';
    html += quadHtml(layout.botLeft, false);
    html += '<div class="bg-bar bot">';
    html += barStack(layout.barBot);
    html += "</div>";
    html += quadHtml(layout.botRight, false);
    html += "</div>";
    html += '<div class="bg-off">';
    html += trayHtml(layout.topOff, "top");
    html += trayHtml(layout.botOff, "bot");
    html += "</div>";

    document.getElementById("bgBoard").innerHTML = html;
    var mid = document.getElementById("midPip");
    if (mid) {
      mid.textContent = t("pipLabel") + ": W " + pipCount(state, "w") + " · B " + pipCount(state, "b");
    }
  }

  function renderDice() {
    var el = document.getElementById("diceDisplay");
    var html = "";
    if (rolledDice.length) {
      var remCopy = remainingDice.slice();
      for (var i = 0; i < rolledDice.length; i++) {
        var v = rolledDice[i];
        var idx = remCopy.indexOf(v);
        var cls = "bg-die";
        if (idx >= 0) {
          cls += " pending";
          remCopy.splice(idx, 1);
        } else {
          cls += " used";
        }
        html += '<div class="' + cls + '">' + v + "</div>";
      }
    }
    el.innerHTML = html;
    // Auto-roll: hide manual roll button from primary flow
    document.getElementById("rollBtn").style.display = "none";
  }

  function renderHistory() {
    var el = document.getElementById("moveList");
    if (!moveHistory.length) {
      el.innerHTML = "";
      return;
    }
    var html = "";
    for (var i = moveHistory.length - 1; i >= 0; i--) {
      html += "<div>" + moveHistory[i] + "</div>";
    }
    el.innerHTML = html;
  }

  function formatMove(player, m) {
    var who = player === "w" ? "W" : "B";
    var from = m.from === 0 ? "bar" : String(m.from);
    var to = m.bear ? "off" : String(m.to);
    var hit = m.hit ? "*" : "";
    return who + " " + from + "→" + to + hit + " (" + m.die + ")";
  }

  function updateStatus() {
    var textEl = "";
    var dot = document.getElementById("statusDot");
    if (!state) {
      document.getElementById("statusText").textContent = "";
      return;
    }
    if (isMultiplayer() && !mpBothSeated()) {
      textEl = t("mpWaiting");
      dot.style.background = "#f0c14b";
    } else if (state.winner) {
      if (state.winner === userColor) textEl = t("statusWin");
      else textEl = isMultiplayer() ? t("statusLoseOpp") : t("statusLose");
      dot.style.background = state.winner === userColor ? "var(--accent)" : "#ff3e3e";
    } else if (botThinking && !isMultiplayer()) {
      textEl = phase === "roll" ? t("statusWaitBotRoll") : t("statusWaitBotMove");
      dot.style.background = "#f0c14b";
    } else if (isUserTurn()) {
      textEl = (phase === "roll" ? t("statusRoll") : t("statusMove")) + " · " +
        (isMultiplayer() ? t("mpYourTurn") : t("statusYourTurn"));
      dot.style.background = "var(--accent)";
    } else {
      textEl = isMultiplayer() ? t("mpOppTurn") : t("statusBotTurn");
      dot.style.background = "#8899aa";
    }
    document.getElementById("statusText").textContent = textEl;
    document.getElementById("thinking").classList.toggle("show", !!botThinking && !isMultiplayer());
  }

  function updateMeta() {
    document.getElementById("sideLabel").textContent = userColor === "w" ? t("sideWhite") : t("sideBlack");
    document.getElementById("turnLabel").textContent = state.turn === "w" ? t("turnWhite") : t("turnBlack");
    document.getElementById("moveCount").textContent = String(moveHistory.length);
    updateOpponentLabel();
  }

  function diffLabelKey() {
    if (difficulty === "easy") return "diffEasy";
    if (difficulty === "hard") return "diffHard";
    return "diffMedium";
  }

    document.getElementById("langEn").classList.toggle("active", lang === "en");
    updateMpUI();
    updateMeta();
    updateStatus();
    renderBoard();
    renderDice();
    renderHistory();
  }

  function setLang(next) {
    if (next !== "ru" && next !== "en") return;
    lang = next;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
  }

  function rollDiceValues() {
    var a = 1 + Math.floor(Math.random() * 6);
    var b = 1 + Math.floor(Math.random() * 6);
    if (a === b) return [a, a, a, a];
    return [a, b];
  }

  function clearTurnTimers() {
    if (rollTimer) { clearTimeout(rollTimer); rollTimer = null; }
    if (passTimer) { clearTimeout(passTimer); passTimer = null; }
  }

  function startTurnRoll(values) {
    rolledDice = values.slice();
    remainingDice = values.slice();
    phase = "move";
    selectedFrom = null;
    refreshTurnPlays();
    if (!turnPlays.length || (turnPlays.length === 1 && !turnPlays[0].moves.length)) {
      // No legal moves: briefly show dice + status, then pass and auto-roll opponent
      botThinking = false;
      renderAll();
      document.getElementById("statusText").textContent = t("statusNoMove");
      document.getElementById("thinking").classList.remove("show");
      if (isMultiplayer() && isUserTurn() && !mpApplyingRemote) {
        publishBgState({ stateSync: true });
      }
      clearTurnTimers();
      passTimer = setTimeout(function () {
        passTimer = null;
        if (state.winner) return;
        endTurnPass();
      }, 900);
      return;
    }
    renderAll();
    if (isMultiplayer() && isUserTurn() && !mpApplyingRemote) {
      publishBgState({ stateSync: true });
    }
    if (!isUserTurn() && !isMultiplayer()) {
      scheduleBotMove();
    }
  }

  function endTurnPass() {
    var note = (state.turn === "w" ? "W" : "B") + " —";
    moveHistory.push(note);
    remainingDice = [];
    rolledDice = [];
    selectedFrom = null;
    if (state.winner) {
      phase = "over";
      renderAll();
      if (isMultiplayer() && !mpApplyingRemote) publishBgState({ stateSync: true });
      return;
    }
    state.turn = opp(state.turn);
    phase = "roll";
    if (typeof headLeft !== "undefined") headLeft = 1;
    renderAll();
    if (isMultiplayer() && !mpApplyingRemote) {
      publishBgState({ stateSync: true });
    }
    scheduleAutoRoll();
  }

  function endTurnAfterMoves() {
    remainingDice = [];
    selectedFrom = null;
    if (state.winner) {
      phase = "over";
      rolledDice = [];
      renderAll();
      if (isMultiplayer() && !mpApplyingRemote) publishBgState({ stateSync: true });
      return;
    }
    state.turn = opp(state.turn);
    phase = "roll";
    rolledDice = [];
    if (typeof headLeft !== "undefined") headLeft = 1;
    renderAll();
    if (isMultiplayer() && !mpApplyingRemote) {
      publishBgState({ stateSync: true });
    }
    scheduleAutoRoll();
  }

  function consumeDie(die) {
    var idx = remainingDice.indexOf(die);
    if (idx >= 0) remainingDice.splice(idx, 1);
  }

  function playMove(move) {
    var player = state.turn;
    state = applyMove(state, player, move);
    moveHistory.push(formatMove(player, move));
    consumeDie(move.die);
    selectedFrom = null;
    var san = formatMove(player, move);
    var toVal = move.bear ? "off" : move.to;
    if (state.winner) {
      phase = "over";
      remainingDice = [];
      renderAll();
      if (isMultiplayer() && !mpApplyingRemote) {
        publishBgState({ from: move.from, to: toVal, san: san });
      }
      return;
    }
    if (!remainingDice.length) {
      endTurnAfterMoves();
      return;
    }
    refreshTurnPlays();
    if (!turnPlays.length || (turnPlays.length === 1 && !turnPlays[0].moves.length)) {
      endTurnAfterMoves();
      return;
    }
    renderAll();
    if (isMultiplayer() && !mpApplyingRemote) {
      publishBgState({ from: move.from, to: toVal, san: san });
    }
  }

  function trySelectFrom(from) {
    if (!isUserTurn() || phase !== "move" || botThinking) return;
    var opts = movesFromSelected(from);
    // If from not yet selected, check if any legal starts here
    var legal = legalNextMoves().filter(function (m) { return m.from === from; });
    if (!legal.length) {
      selectedFrom = null;
      renderBoard();
      return;
    }
    if (selectedFrom === from) {
      selectedFrom = null;
      renderBoard();
      return;
    }
    selectedFrom = from;
    // Auto-move if only one destination
    if (legal.length === 1) {
      playMove(legal[0]);
      return;
    }
    renderBoard();
  }

  function trySelectTo(to) {
    if (!isUserTurn() || phase !== "move" || botThinking) return;
    if (selectedFrom == null) {
      // Clicking a destination point that is also a source: select as from
      trySelectFrom(to);
      return;
    }
    var legal = movesFromSelected(selectedFrom);
    var match = null;
    for (var i = 0; i < legal.length; i++) {
      if (legal[i].bear && to === "off") { match = legal[i]; break; }
      if (!legal[i].bear && legal[i].to === to) { match = legal[i]; break; }
    }
    if (match) playMove(match);
    else trySelectFrom(typeof to === "number" ? to : selectedFrom);
  }

  function onBoardClick(e) {
    var off = e.target.closest("[data-off]");
    if (off) {
      var who = off.getAttribute("data-off");
      if (who === state.turn) trySelectTo("off");
      return;
    }
    var bar = e.target.closest("[data-bar]");
    if (bar) {
      var bw = bar.getAttribute("data-bar");
      if (bw === state.turn && state.bar[bw] > 0) trySelectFrom(0);
      return;
    }
    var chip = e.target.closest(".bg-chip");
    var point = e.target.closest("[data-point]");
    if (chip && chip.getAttribute("data-from") != null) {
      var f = chip.getAttribute("data-from");
      if (f === "off") return;
      var from = Number(f);
      if (selectedFrom != null && selectedFrom !== from) {
        // maybe moving onto this point
        if (point) {
          trySelectTo(Number(point.getAttribute("data-point")));
          return;
        }
      }
      if (state.points[from] && state.points[from].color === state.turn) {
        trySelectFrom(from);
        return;
      }
    }
    if (point) {
      var n = Number(point.getAttribute("data-point"));
      if (selectedFrom != null) {
        trySelectTo(n);
      } else if (state.points[n].color === state.turn && state.points[n].count > 0) {
        trySelectFrom(n);
      }
    }
  }

  function doRoll() {
    // Kept for compatibility; normal play uses scheduleAutoRoll
    if (phase !== "roll" || botThinking || state.winner) return;
    clearTurnTimers();
    var vals = rollDiceValues();
    if (!isUserTurn()) botThinking = false;
    startTurnRoll(vals);
  }

  function scheduleAutoRoll() {
    if (!state || state.winner || phase !== "roll") return;
    if (isMultiplayer() && !mpBothSeated()) return;
    if (isMultiplayer() && !isUserTurn()) return;
    clearTurnTimers();
    var delay = 400 + Math.floor(Math.random() * 301);
    if (!isUserTurn() && !isMultiplayer()) {
      botThinking = true;
      updateStatus();
      document.getElementById("thinking").classList.add("show");
    } else {
      botThinking = false;
      updateStatus();
    }
    rollTimer = setTimeout(function () {
      rollTimer = null;
      if (!state || state.winner || phase !== "roll") return;
      if (isMultiplayer() && !isUserTurn()) return;
      var vals = rollDiceValues();
      botThinking = false;
      startTurnRoll(vals);
    }, delay);
  }

  function applyBotStep(move) {
    var player = state.turn;
    state = applyMove(state, player, move);
    moveHistory.push(formatMove(player, move));
    consumeDie(move.die);
    selectedFrom = null;
    renderAll();
  }

  function scheduleBotMove() {
    if (isMultiplayer()) return;
    if (state.winner || phase !== "move") return;
    if (isUserTurn()) return;
    botThinking = true;
    updateStatus();
    document.getElementById("thinking").classList.add("show");
    var delay = difficulty === "easy" ? 320 : difficulty === "hard" ? 650 : 450;
    setTimeout(function () {
      var play = pickBotPlay(state, remainingDice.slice(), difficulty);
      if (!play || !play.moves.length) {
        botThinking = false;
        document.getElementById("thinking").classList.remove("show");
        endTurnAfterMoves();
        return;
      }
      var moves = play.moves.slice();
      function step() {
        if (state.winner) {
          botThinking = false;
          document.getElementById("thinking").classList.remove("show");
          phase = "over";
          remainingDice = [];
          renderAll();
          return;
        }
        if (!moves.length) {
          botThinking = false;
          document.getElementById("thinking").classList.remove("show");
          remainingDice = [];
          endTurnAfterMoves();
          return;
        }
        var m = moves.shift();
        applyBotStep(m);
        if (state.winner) {
          botThinking = false;
          document.getElementById("thinking").classList.remove("show");
          phase = "over";
          remainingDice = [];
          renderAll();
          return;
        }
        setTimeout(step, 260);
      }
      step();
    }, delay);
  }

  function renderAll() {
    renderBoard();
    renderDice();
    renderHistory();
    updateMeta();
    updateStatus();
  }

  function newGameLocal() {
    clearTurnTimers();
    state = initialState();
    remainingDice = [];
    rolledDice = [];
    phase = "roll";
    selectedFrom = null;
    moveHistory = [];
    botThinking = false;
    turnPlays = [];
    renderAll();
    scheduleAutoRoll();
  }

  function newGame() {
    if (isMultiplayer() && mpSocket && mpRoomCode) {
      if (mpRoom && mpRoom.hostId === getOrCreateClientId()) {
        mpSocket.emit("resetGame", { clientId: getOrCreateClientId(), code: mpRoomCode });
      }
      return;
    }
    newGameLocal();
  }

  // Simple pointer drag: grab chip → release on target point/off
  var dragFrom = null;
  document.getElementById("bgBoard").addEventListener("pointerdown", function (e) {
    if (!isUserTurn() || phase !== "move" || botThinking) return;
    var chip = e.target.closest(".bg-chip");
    if (!chip) return;
    var f = chip.getAttribute("data-from");
    if (f == null || f === "off") return;
    var from = Number(f);
    if (from === 0) {
      if (state.bar[state.turn] <= 0) return;
    } else if (!state.points[from] || state.points[from].color !== state.turn) {
      return;
    }
    var legal = legalNextMoves().filter(function (m) { return m.from === from; });
    if (!legal.length) return;
    dragFrom = from;
    selectedFrom = from;
    renderBoard();
    try { chip.setPointerCapture(e.pointerId); } catch (err) {}
  });
  document.getElementById("bgBoard").addEventListener("pointerup", function (e) {
    if (dragFrom == null) return;
    var from = dragFrom;
    dragFrom = null;
    var off = e.target.closest("[data-off]");
    if (off && off.getAttribute("data-off") === state.turn) {
      trySelectTo("off");
      return;
    }
    var point = e.target.closest("[data-point]");
    if (point) {
      var n = Number(point.getAttribute("data-point"));
      selectedFrom = from;
      trySelectTo(n);
      return;
    }
    // release elsewhere keeps selection
    renderBoard();
  });

  // Events
  document.getElementById("langRu").addEventListener("click", function () { setLang("ru"); });
  document.getElementById("langEn").addEventListener("click", function () { setLang("en"); });
  document.getElementById("newGameBtn").addEventListener("click", newGame);
  // rollBtn hidden; dice auto-roll via scheduleAutoRoll
  document.getElementById("rulesBtn").addEventListener("click", function () {
    document.getElementById("rulesDialog").showModal();
  });
  document.getElementById("rulesCloseBtn").addEventListener("click", function () {
    document.getElementById("rulesDialog").close();
  });
  document.getElementById("rulesDialog").addEventListener("click", function (e) {
    if (e.target === document.getElementById("rulesDialog")) {
      document.getElementById("rulesDialog").close();
    }
  });
  document.getElementById("sideSelect").addEventListener("change", function (e) {
    userColor = e.target.value === "b" ? "b" : "w";
    try { localStorage.setItem(SIDE_KEY, userColor); } catch (err) {}
    if (!isMultiplayer()) newGameLocal();
  });
  document.getElementById("difficulty").addEventListener("change", function (e) {
    difficulty = e.target.value;
    try { localStorage.setItem(DIFF_KEY, difficulty); } catch (err) {}
    updateOpponentLabel();
  });
  document.getElementById("bgBoard").addEventListener("click", onBoardClick);

  document.getElementById("sideSelect").value = userColor;
  document.getElementById("difficulty").value = difficulty;
  wireMp();
  applyLang();
  setMpConn("offline");

  var paramsEarly = new URLSearchParams(window.location.search);
  var maybeMp = !!(paramsEarly.get("room") || (function () {
    try { return localStorage.getItem(MP_ROOM_KEY); } catch (e) { return null; }
  })());
  tryAutoRejoin();

  if (!isMultiplayer() && !maybeMp) {
    newGameLocal();
  } else if (!maybeMp) {
    state = initialState();
    renderAll();
  } else {
    state = initialState();
    phase = "roll";
    renderAll();
  }
})();
</script>
</body>
</html>
