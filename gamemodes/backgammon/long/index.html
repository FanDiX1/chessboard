<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardHack — Нарды · Длинные</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/boardhack.css" />
  <style>
    .board-wrap { max-width: 720px; }
    .bg-wrap {
      width: 100%;
      user-select: none;
      touch-action: manipulation;
    }
    .bg-board {
      display: grid;
      grid-template-columns: 1fr 52px;
      gap: 0.5rem;
      background: #1a1f27;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 0.55rem;
      box-shadow: 0 0 0 1px var(--border-soft), 0 12px 40px rgba(0,0,0,0.45);
    }
    .bg-field {
      display: grid;
      grid-template-rows: 1fr 36px 1fr;
      grid-template-columns: 1fr 44px 1fr;
      min-height: min(62vw, 420px);
      background: #12161c;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .bg-quad {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
      padding: 2px;
      background: #0e1218;
    }
    .bg-quad.top { align-items: start; }
    .bg-quad.bot { align-items: end; }
    .bg-bar {
      background: linear-gradient(180deg, #2a3140, #1a1f28);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0.35rem 0.15rem;
      position: relative;
    }
    .bg-bar.bot { justify-content: flex-end; }
    .bg-bar-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-90deg);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
      pointer-events: none;
    }
    .bg-mid {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: #161b22;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.25rem 0.5rem;
    }
    .bg-point {
      position: relative;
      height: 100%;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      border-radius: 4px;
    }
    .bg-quad.top .bg-point { justify-content: flex-start; }
    .bg-quad.bot .bg-point { justify-content: flex-end; }
    .bg-point::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      width: 84%;
      height: 88%;
      pointer-events: none;
      z-index: 0;
    }
    .bg-quad.top .bg-point::before {
      top: 0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    .bg-quad.bot .bg-point::before {
      bottom: 0;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }
    .bg-point.light::before { background: #3d4a3a; }
    .bg-point.dark::before { background: #2a2220; }
    .bg-point.selected { box-shadow: inset 0 0 0 2px var(--accent); }
    .bg-point.legal::after {
      content: "";
      position: absolute;
      width: 18%;
      height: 18%;
      max-width: 14px;
      max-height: 14px;
      border-radius: 50%;
      background: rgba(159, 239, 0, 0.7);
      z-index: 3;
      pointer-events: none;
      left: 50%;
      transform: translateX(-50%);
    }
    .bg-quad.top .bg-point.legal::after { bottom: 6%; }
    .bg-quad.bot .bg-point.legal::after { top: 6%; }
        .bg-checkers {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 4px 0;
      gap: 2px;
      pointer-events: none;
    }
    .bg-quad.bot .bg-checkers { flex-direction: column-reverse; }
    .bg-chip {
      width: 78%;
      max-width: 34px;
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.45), inset 0 2px 3px rgba(255,255,255,0.15);
      flex-shrink: 0;
      pointer-events: auto;
      cursor: grab;
    }
    .bg-chip.w {
      background: radial-gradient(circle at 35% 30%, #f5f7fa, #cfd5dd 55%, #9aa3b0);
      border: 2px solid #e8edf2;
    }
    .bg-chip.b {
      background: radial-gradient(circle at 35% 30%, #3a4048, #1a1d21 55%, #0b0e11);
      border: 2px solid #2a2f36;
    }
    .bg-chip.overflow {
      font-size: 0.65rem;
      font-family: var(--mono);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 700;
    }
    .bg-chip.w.overflow { color: #1a1d21; }
    .bg-off {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .bg-tray {
      flex: 1;
      background: #0e1218;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 120px;
      cursor: pointer;
      position: relative;
    }
    .bg-tray.legal {
      box-shadow: inset 0 0 0 2px var(--accent);
    }
    .bg-tray-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .bg-tray-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex: 1;
      justify-content: flex-start;
      width: 100%;
    }
    .bg-tray .bg-chip { max-width: 28px; width: 70%; }
    .bg-bar-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-height: 48px;
      width: 100%;
      z-index: 1;
      padding: 0.15rem 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .bg-bar-stack.legal {
      box-shadow: inset 0 0 0 2px var(--accent);
    }
    .bg-bar-stack .bg-chip { max-width: 26px; width: 85%; }
    .bg-dice-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .bg-die {
      width: 36px;
      height: 36px;
      border-radius: 7px;
      background: #f0f2f5;
      color: #12161c;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1.15rem;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      border: 2px solid #c8cdd5;
    }
    .bg-die.used {
      opacity: 0.35;
      text-decoration: line-through;
    }
    .bg-die.pending {
      box-shadow: 0 0 0 2px var(--accent), 0 2px 6px rgba(0,0,0,0.35);
    }
    .bg-pip {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    @media (max-width: 720px) {
      .bg-board { grid-template-columns: 1fr; }
      .bg-off {
        flex-direction: row;
        order: 2;
      }
      .bg-tray { min-height: 72px; flex-direction: row; gap: 0.35rem; }
      .bg-tray-stack { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .bg-field { min-height: 360px; }
      .bg-point { min-height: 110px; }
    }
  </style>
</head>
<body>

  <div class="topbar-inner">
    <div class="brand">

<main class="main">

    <section class="card">

      </div>

        <div id="diceDisplay" class="bg-dice-row"></div>
        <span class="bg-pip" id="pipInfo"></span>
      </div>
    </section>

    <aside class="side-stack">
      <section class="card" id="missionCard">
        <div class="card-title" id="missionTitle"></div>
        <div class="controls">
          <div id="sideSelectWrap">
            <label class="field-label" for="sideSelect" id="sideSelectLabel"></label>
            <select id="sideSelect">

              <option value="b"></option>
            </select>
          </div>
          <div id="difficultyWrap">
            <label class="field-label" for="difficulty" id="diffLabel"></label>

            <button type="button" class="btn btn-primary" id="newGameBtn"></button>

        </div>
      </section>

      <section class="card">
        <div class="card-title" id="sessionTitle"></div>
        <div class="meta-grid">
          <div class="meta-item">
            <div class="k" id="metaSideK"></div>
            <div class="v" id="sideLabel"></div>
          </div>
          <div class="meta-item">
            <div class="k" id="metaTurnK"></div>
            <div class="v" id="turnLabel"></div>
          </div>
          <div class="meta-item">
            <div class="k" id="metaMovesK"></div>
            <div class="v" id="moveCount">0</div>
          </div>
          <div class="meta-item">
            <div class="k" id="metaOppK"></div>
            <div class="v" id="oppLabel"></div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-title" id="historyTitle"></div>
        <div class="move-list" id="moveList"></div>
      </section>
    </aside>
  </div>
  <footer class="footer">BoardHack</footer>
</main>

<dialog class="rules-dialog" id="rulesDialog" aria-labelledby="rulesTitle">
  <div class="rules-dialog-head">
    <h2 class="card-title" id="rulesTitle"></h2>
    <button type="button" class="rules-dialog-close" id="rulesCloseBtn" aria-label="Close">×</button>
  </div>
  <div class="rules-box" id="rulesBox"></div>
</dialog>

<script>
(function () {
  "use strict";

  /*
   * Long nardy (длинные нарды):
   *   White: 15 on 24, moves 24→1, home 1–6, bears off past 0.
   *   Black: 15 on 12, moves 12→1→24→13, home 13–18, bears off past 13.
   *   Same rotational direction (counterclockwise). No hitting / no bar.
   *   Opponent's point (any count) is blocked. Doubles = 4 moves.
   *   Head rule: at most one checker may leave the head per turn.
   */

  var LANG_KEY = "boardhack-lang";
  var SIDE_KEY = "boardhack-bglong-side";
  var DIFF_KEY = "boardhack-bglong-diff";
  var MAX_VISIBLE = 5;

  var I18N = {
    ru: {
      docTitle: "BoardHack — Нарды · Длинные",
      modeBadge: "нарды · длинные",
      playArea: "Игровая зона",
      mission: "Управление",
      session: "Сессия",
      history: "История ходов",
      rulesButton: "Правила",
      rulesTitle: "Правила — длинные нарды",
      rulesClose: "Закрыть правила",
      rulesHtml: "<ul><li><strong>Длинные нарды</strong>: оба идут в одну сторону (против часовой). Белые — голова 24, дом 1–6; чёрные — голова 12, дом 13–18.</li><li><strong>Без сбивания:</strong> нельзя вставать на пункт с шашками соперника (даже одной). Бара нет.</li><li><strong>Голова:</strong> за ход с головы снимается не больше одной шашки (всегда).</li><li><strong>Кости:</strong> два кубика; дубль — четыре хода. Нужно использовать кости, если возможно; если только одну из двух разных — большую.</li><li><strong>Вывод:</strong> когда все 15 в доме; точное значение или большее с самой дальней занятой точки дома.</li><li><strong>Победа:</strong> вывести все 15 шашек. Только локальный бот (без мультиплеера).</li></ul>",
      sideSelectLabel: "Играть за",
      sideWhite: "Белые",
      sideBlack: "Чёрные",
      diffLabel: "Сложность бота",
      diffEasy: "Легко",
      diffMedium: "Средне",
      diffHard: "Сложно",
      newGame: "Новая игра",
      roll: "Бросить кости",
      metaSide: "Сторона",
      metaTurn: "Ход",
      metaMoves: "Ходы",
      metaOpp: "Противник",
      metaBot: "Бот",
      turnWhite: "Белые",
      turnBlack: "Чёрные",
      thinking: "Бот думает…",
      statusRoll: "Бросок костей…",
      statusMove: "Сходите шашкой",
      statusWaitBotRoll: "Бот бросает кости…",
      statusWaitBotMove: "Бот ходит…",
      statusNoMove: "Нет ходов — ход переходит",
      statusWin: "Победа! Все шашки выведены.",
      statusLose: "Поражение. Бот вывел все шашки.",
      statusYourTurn: "Ваш ход",
      statusBotTurn: "Ход бота",
      trayOffW: "Вывод · белые",
      trayOffB: "Вывод · чёрные",
      barLabel: "",
      pipLabel: "Пипсы"
    },
    en: {
      docTitle: "BoardHack — Backgammon · Long",
      modeBadge: "backgammon · long",
      playArea: "Play area",
      mission: "Controls",
      session: "Session",
      history: "Move history",
      rulesButton: "Rules",
      rulesTitle: "Rules — long nardy",
      rulesClose: "Close rules",
      rulesHtml: "<ul><li><strong>Long nardy</strong> (Russian long backgammon): both move the same way (counterclockwise). White head 24, home 1–6; Black head 12, home 13–18.</li><li><strong>No hitting:</strong> you cannot land on a point occupied by the opponent (even one checker blocks). No bar.</li><li><strong>Head:</strong> at most one checker may leave the head per turn (always).</li><li><strong>Dice:</strong> two dice; doubles = four moves. Use dice when possible; if only one of two different dice can be played, use the higher.</li><li><strong>Bearing off:</strong> only when all 15 are in the home board; exact or higher from the highest occupied home point.</li><li><strong>Win:</strong> bear off all 15. Local bot only (no multiplayer).</li></ul>",
      sideSelectLabel: "Play as",
      sideWhite: "White",
      sideBlack: "Black",
      diffLabel: "Bot difficulty",
      diffEasy: "Easy",
      diffMedium: "Medium",
      diffHard: "Hard",
      newGame: "New game",
      roll: "Roll dice",
      metaSide: "Side",
      metaTurn: "Turn",
      metaMoves: "Moves",
      metaOpp: "Opponent",
      metaBot: "Bot",
      turnWhite: "White",
      turnBlack: "Black",
      thinking: "Bot thinking…",
      statusRoll: "Rolling…",
      statusMove: "Move a checker",
      statusWaitBotRoll: "Bot is rolling…",
      statusWaitBotMove: "Bot is moving…",
      statusNoMove: "No moves — turn passes",
      statusWin: "You win! All checkers borne off.",
      statusLose: "You lose. The bot bore off all checkers.",
      statusYourTurn: "Your turn",
      statusBotTurn: "Bot's turn",
      trayOffW: "Off · white",
      trayOffB: "Off · black",
      barLabel: "",
      pipLabel: "Pips"
    }
  };

  var lang = "ru";
  var userColor = "w";
  var difficulty = "medium";
  var state = null;
  var remainingDice = [];
  var rolledDice = [];
  var phase = "roll";
  var selectedFrom = null;
  var moveHistory = [];
  var botThinking = false;
  var turnPlays = [];
  var rollTimer = null;
  var passTimer = null;
  var headLeft = 1;

  try {
    var sL = localStorage.getItem(LANG_KEY);
    if (sL === "en" || sL === "ru") lang = sL;
  } catch (e) {}
  try {
    var sS = localStorage.getItem(SIDE_KEY);
    if (sS === "w" || sS === "b") userColor = sS;
  } catch (e) {}
  try {
    var sD = localStorage.getItem(DIFF_KEY);
    if (sD === "easy" || sD === "medium" || sD === "hard") difficulty = sD;
  } catch (e) {}

  function t(key) {
    var pack = I18N[lang] || I18N.ru;
    return pack[key] != null ? pack[key] : (I18N.en[key] || key);
  }

  function opp(c) { return c === "w" ? "b" : "w"; }

  function emptyPoint() { return { color: null, count: 0 }; }

  function cloneState(st) {
    var pts = new Array(25);
    for (var i = 0; i <= 24; i++) {
      if (i === 0) { pts[i] = emptyPoint(); continue; }
      pts[i] = { color: st.points[i].color, count: st.points[i].count };
    }
    return {
      points: pts,
      off: { w: st.off.w, b: st.off.b },
      turn: st.turn,
      winner: st.winner
    };
  }

  function setPoint(pts, n, color, count) {
    pts[n] = { color: count > 0 ? color : null, count: count };
  }

  function headPoint(player) {
    return player === "w" ? 24 : 12;
  }

  function initialState() {
    var pts = new Array(25);
    for (var i = 0; i <= 24; i++) pts[i] = emptyPoint();
    setPoint(pts, 24, "w", 15);
    setPoint(pts, 12, "b", 15);
    return {
      points: pts,
      off: { w: 0, b: 0 },
      turn: "w",
      winner: null
    };
  }

  /** Distance to bear-off (pips) for a checker on point. */
  function pipDistance(player, point) {
    if (player === "w") return point;
    if (point >= 13) return point - 12;
    return point + 12;
  }

  /** Home-board rank 1..6 (for bearing off). */
  function homePos(player, point) {
    if (player === "w") return point;
    return point - 12;
  }

  function allInHome(st, player) {
    for (var i = 1; i <= 24; i++) {
      if (st.points[i].color !== player || st.points[i].count <= 0) continue;
      if (player === "w") {
        if (i < 1 || i > 6) return false;
      } else {
        if (i < 13 || i > 18) return false;
      }
    }
    return true;
  }

  function maxOccupiedHomePos(st, player) {
    var max = 0;
    for (var i = 1; i <= 24; i++) {
      if (st.points[i].color === player && st.points[i].count > 0) {
        var hp = homePos(player, i);
        if (hp > max) max = hp;
      }
    }
    return max;
  }

  function canLand(st, player, point) {
    if (point < 1 || point > 24) return false;
    var p = st.points[point];
    if (p.count === 0) return true;
    return p.color === player;
  }

  function boardDest(player, from, die) {
    if (player === "w") return from - die;
    var d = from - die;
    if (d < 1) d += 24;
    return d;
  }

  function wouldPassHomeExit(player, from, die) {
    if (player === "w") return from - die <= 0;
    return from >= 13 && from <= 18 && (from - die) < 13;
  }

  function canBearOffFrom(st, player, from, die) {
    if (!allInHome(st, player)) return false;
    if (st.points[from].color !== player || st.points[from].count <= 0) return false;
    if (player === "w") {
      if (from < 1 || from > 6) return false;
    } else {
      if (from < 13 || from > 18) return false;
    }
    var hp = homePos(player, from);
    if (die === hp) return true;
    if (die > hp) return hp === maxOccupiedHomePos(st, player);
    return false;
  }

  function getSingleMoves(st, player, die, headsRemaining) {
    var moves = [];
    var head = headPoint(player);
    for (var p = 1; p <= 24; p++) {
      if (st.points[p].color !== player || st.points[p].count <= 0) continue;
      if (p === head && headsRemaining <= 0) continue;

      if (wouldPassHomeExit(player, p, die)) {
        if (canBearOffFrom(st, player, p, die)) {
          moves.push({ from: p, to: "off", die: die, bear: true, fromHead: p === head });
        }
        continue;
      }

      var dest = boardDest(player, p, die);
      if (dest >= 1 && dest <= 24 && canLand(st, player, dest)) {
        moves.push({ from: p, to: dest, die: die, bear: false, fromHead: p === head });
      }
    }
    return moves;
  }

  function applyMove(st, player, move) {
    var n = cloneState(st);
    var fp = n.points[move.from];
    fp.count--;
    if (fp.count === 0) fp.color = null;
    if (move.bear) {
      n.off[player]++;
    } else {
      var tp = n.points[move.to];
      if (tp.color === player) {
        tp.count++;
      } else {
        tp.color = player;
        tp.count = 1;
      }
    }
    if (n.off[player] >= 15) n.winner = player;
    return n;
  }

  function moveKey(m) {
    return m.from + ">" + m.to + ":" + m.die;
  }

  function playKey(play) {
    return play.moves.map(moveKey).join("|");
  }

  function legalPlays(st, player, diceValues, headsRemaining) {
    if (headsRemaining == null) headsRemaining = 1;
    var results = [];
    function rec(cur, remaining, movesSoFar, headRem) {
      var progressed = false;
      var seenDie = {};
      for (var i = 0; i < remaining.length; i++) {
        var die = remaining[i];
        if (seenDie[die]) continue;
        seenDie[die] = true;
        var singles = getSingleMoves(cur, player, die, headRem);
        for (var j = 0; j < singles.length; j++) {
          progressed = true;
          var next = applyMove(cur, player, singles[j]);
          var rem = remaining.slice();
          rem.splice(i, 1);
          var nextHead = singles[j].fromHead ? headRem - 1 : headRem;
          movesSoFar.push(singles[j]);
          rec(next, rem, movesSoFar, nextHead);
          movesSoFar.pop();
        }
      }
      if (!progressed) {
        results.push({ moves: movesSoFar.slice(), state: cloneState(cur) });
      }
    }
    if (!diceValues.length) {
      return [{ moves: [], state: cloneState(st) }];
    }
    rec(st, diceValues.slice(), [], headsRemaining);

    var maxLen = 0;
    for (var k = 0; k < results.length; k++) {
      if (results[k].moves.length > maxLen) maxLen = results[k].moves.length;
    }
    var filtered = results.filter(function (r) { return r.moves.length === maxLen; });

    if (diceValues.length >= 2) {
      var uniqDice = [];
      for (var u = 0; u < diceValues.length; u++) {
        if (uniqDice.indexOf(diceValues[u]) < 0) uniqDice.push(diceValues[u]);
      }
      if (uniqDice.length === 2 && maxLen === 1) {
        var higher = Math.max(uniqDice[0], uniqDice[1]);
        var higherOnly = filtered.filter(function (r) {
          return r.moves.length && r.moves[0].die === higher;
        });
        if (higherOnly.length) filtered = higherOnly;
      }
    }

    var seen = {};
    var out = [];
    for (var x = 0; x < filtered.length; x++) {
      var key = playKey(filtered[x]);
      if (seen[key]) continue;
      seen[key] = true;
      out.push(filtered[x]);
    }
    return out;
  }

  function firstMovesFromPlays(plays) {
    var seen = {};
    var list = [];
    for (var i = 0; i < plays.length; i++) {
      if (!plays[i].moves.length) continue;
      var m = plays[i].moves[0];
      var k = moveKey(m);
      if (seen[k]) continue;
      seen[k] = true;
      list.push(m);
    }
    return list;
  }

  function refreshTurnPlays() {
    turnPlays = legalPlays(state, state.turn, remainingDice, headLeft);
  }

  function pipCount(st, player) {
    var pips = 0;
    for (var i = 1; i <= 24; i++) {
      if (st.points[i].color === player) {
        pips += st.points[i].count * pipDistance(player, i);
      }
    }
    return pips;
  }

  function countOnHead(st, player) {
    var h = headPoint(player);
    var p = st.points[h];
    return p.color === player ? p.count : 0;
  }

  function primeBonus(st, player) {
    var score = 0;
    var run = 0;
    // Walk in movement direction (decreasing with wrap for black conceptually —
    // check contiguous occupied points along each player's forward path).
    var order = [];
    if (player === "w") {
      for (var i = 24; i >= 1; i--) order.push(i);
    } else {
      for (var j = 12; j >= 1; j--) order.push(j);
      for (var k = 24; k >= 13; k--) order.push(k);
    }
    for (var t = 0; t < order.length; t++) {
      var pt = order[t];
      if (st.points[pt].color === player && st.points[pt].count >= 1) {
        run++;
        if (run >= 2) score += 3 * run;
        if (run >= 6) score += 25;
      } else {
        run = 0;
      }
    }
    return score;
  }

  function scoreStateFor(st, player) {
    var score = 0;
    score += st.off[player] * 140;
    score -= st.off[opp(player)] * 140;
    score -= pipCount(st, player) * 1.15;
    score += pipCount(st, opp(player)) * 0.95;
    // Prefer getting off the head
    score -= countOnHead(st, player) * 6;
    score += countOnHead(st, opp(player)) * 4;
    score += primeBonus(st, player);
    score -= primeBonus(st, opp(player)) * 0.85;
    // Spread / safety: stacks of 2+ are fine; lone checkers less critical (no hitting)
    for (var i = 1; i <= 24; i++) {
      var p = st.points[i];
      if (p.color === player && p.count >= 2) score += 4 + Math.min(p.count, 6);
    }
    if (st.winner === player) score += 10000;
    if (st.winner === opp(player)) score -= 10000;
    return score;
  }

  function pickBotPlay(st, dice, diff, headsRem) {
    var plays = legalPlays(st, st.turn, dice, headsRem);
    if (!plays.length) return null;
    if (plays.length === 1 && !plays[0].moves.length) return plays[0];
    if (diff === "easy") {
      return plays[Math.floor(Math.random() * plays.length)];
    }
    var player = st.turn;
    var best = null;
    var bestScore = -Infinity;
    for (var i = 0; i < plays.length; i++) {
      var sc = scoreStateFor(plays[i].state, player);
      if (diff === "hard") {
        // Prefer blocking opponent's forward path
        sc += blockPressure(plays[i].state, player) * 0.5;
      }
      sc += (Math.random() - 0.5) * (diff === "hard" ? 2 : 8);
      if (sc > bestScore) {
        bestScore = sc;
        best = plays[i];
      }
    }
    return best || plays[0];
  }

  function blockPressure(st, player) {
    var enemy = opp(player);
    var blocked = 0;
    for (var d = 1; d <= 6; d++) {
      for (var i = 1; i <= 24; i++) {
        if (st.points[i].color !== enemy || st.points[i].count <= 0) continue;
        var dest;
        if (enemy === "w") {
          dest = i - d;
          if (dest <= 0) continue;
        } else {
          dest = i - d;
          if (dest < 1) dest += 24;
          if (i >= 13 && i <= 18 && (i - d) < 13) continue;
        }
        if (st.points[dest].color === player && st.points[dest].count > 0) blocked++;
      }
    }
    return blocked;
  }

  function isUserTurn() { return state && state.turn === userColor; }

  function boardPointOrder() {
    var flipped = userColor === "b";
    if (!flipped) {
      return {
        topLeft: [13, 14, 15, 16, 17, 18],
        topRight: [19, 20, 21, 22, 23, 24],
        botLeft: [12, 11, 10, 9, 8, 7],
        botRight: [6, 5, 4, 3, 2, 1],
        topOff: "b",
        botOff: "w"
      };
    }
    return {
      topLeft: [12, 11, 10, 9, 8, 7],
      topRight: [6, 5, 4, 3, 2, 1],
      botLeft: [13, 14, 15, 16, 17, 18],
      botRight: [19, 20, 21, 22, 23, 24],
      topOff: "w",
      botOff: "b"
    };
  }

  function pointColorClass(n) {
    return (n % 2 === 0) ? "light" : "dark";
  }

  function legalNextMoves() {
    return firstMovesFromPlays(turnPlays);
  }

  function movesFromSelected(from) {
    return legalNextMoves().filter(function (m) { return m.from === from; });
  }

  function renderChips(color, count, interactiveFrom) {
    var html = "";
    var show = Math.min(count, MAX_VISIBLE);
    for (var i = 0; i < show; i++) {
      var extra = "";
      if (i === show - 1 && count > MAX_VISIBLE) {
        extra = " overflow";
        html += '<div class="bg-chip ' + color + extra + '" data-from="' + interactiveFrom + '">' + count + "</div>";
      } else {
        html += '<div class="bg-chip ' + color + '" data-from="' + interactiveFrom + '"></div>';
      }
    }
    return html;
  }

  function renderBoard() {
    var layout = boardPointOrder();
    var legal = phase === "move" && isUserTurn() && !botThinking ? legalNextMoves() : [];
    var legalFrom = {};
    var legalTo = {};
    var legalOff = false;
    for (var i = 0; i < legal.length; i++) {
      legalFrom[legal[i].from] = true;
      if (legal[i].bear) legalOff = true;
      else legalTo[legal[i].to] = legal[i];
    }
    var selectedTargets = {};
    var selectedOff = false;
    if (selectedFrom != null) {
      var sm = movesFromSelected(selectedFrom);
      for (var s = 0; s < sm.length; s++) {
        if (sm[s].bear) selectedOff = true;
        else selectedTargets[sm[s].to] = sm[s];
      }
    }

    function pointHtml(n) {
      var p = state.points[n];
      var cls = "bg-point " + pointColorClass(n);
      if (selectedFrom === n) cls += " selected";
      if (selectedFrom != null) {
        if (selectedTargets[n]) cls += " legal";
      } else if (legalFrom[n]) {
        cls += " legal";
      }
      var chips = "";
      if (p.count > 0) {
        chips = '<div class="bg-checkers">' + renderChips(p.color, p.count, n) + "</div>";
      }
      return '<div class="' + cls + '" data-point="' + n + '" title="' + n + '">' + chips + "</div>";
    }

    function quadHtml(arr, top) {
      var h = '<div class="bg-quad ' + (top ? "top" : "bot") + '">';
      for (var i = 0; i < arr.length; i++) h += pointHtml(arr[i]);
      h += "</div>";
      return h;
    }

    function trayHtml(who) {
      var count = state.off[who];
      var cls = "bg-tray";
      if (selectedFrom != null && selectedOff && state.turn === who && phase === "move" && isUserTurn()) cls += " legal";
      var label = who === "w" ? t("trayOffW") : t("trayOffB");
      var chips = '<div class="bg-tray-stack">' + (count ? renderChips(who, count, "off") : "") + "</div>";
      return '<div class="' + cls + '" data-off="' + who + '"><div class="bg-tray-label">' + label + "</div>" + chips + "</div>";
    }

    var html = "";
    html += '<div class="bg-field">';
    html += quadHtml(layout.topLeft, true);
    html += '<div class="bg-bar top"><span class="bg-bar-label">' + t("barLabel") + "</span></div>";
    html += quadHtml(layout.topRight, true);
    html += '<div class="bg-mid"><span class="bg-pip" id="midPip"></span></div>';
    html += quadHtml(layout.botLeft, false);
    html += '<div class="bg-bar bot"></div>';
    html += quadHtml(layout.botRight, false);
    html += "</div>";
    html += '<div class="bg-off">';
    html += trayHtml(layout.topOff);
    html += trayHtml(layout.botOff);
    html += "</div>";

    document.getElementById("bgBoard").innerHTML = html;
    var mid = document.getElementById("midPip");
    if (mid) {
      mid.textContent = t("pipLabel") + ": W " + pipCount(state, "w") + " · B " + pipCount(state, "b");
    }
  }

  function renderDice() {
    var el = document.getElementById("diceDisplay");
    var html = "";
    if (rolledDice.length) {
      var remCopy = remainingDice.slice();
      for (var i = 0; i < rolledDice.length; i++) {
        var v = rolledDice[i];
        var idx = remCopy.indexOf(v);
        var cls = "bg-die";
        if (idx >= 0) {
          cls += " pending";
          remCopy.splice(idx, 1);
        } else {
          cls += " used";
        }
        html += '<div class="' + cls + '">' + v + "</div>";
      }
    }
    el.innerHTML = html;
    // Auto-roll: hide manual roll button from primary flow
    document.getElementById("rollBtn").style.display = "none";
  }

  function renderHistory() {
    var el = document.getElementById("moveList");
    if (!moveHistory.length) {
      el.innerHTML = "";
      return;
    }
    var html = "";
    for (var i = moveHistory.length - 1; i >= 0; i--) {
      html += "<div>" + moveHistory[i] + "</div>";
    }
    el.innerHTML = html;
  }

  function formatMove(player, m) {
    var who = player === "w" ? "W" : "B";
    var from = String(m.from);
    var to = m.bear ? "off" : String(m.to);
    return who + " " + from + "→" + to + " (" + m.die + ")";
  }

  function updateStatus() {
    var text = "";
    var dot = document.getElementById("statusDot");
    if (state.winner) {
      text = state.winner === userColor ? t("statusWin") : t("statusLose");
      dot.style.background = state.winner === userColor ? "var(--accent)" : "#ff3e3e";
    } else if (botThinking) {
      text = phase === "roll" ? t("statusWaitBotRoll") : t("statusWaitBotMove");
      dot.style.background = "#f0c14b";
    } else if (isUserTurn()) {
      text = (phase === "roll" ? t("statusRoll") : t("statusMove")) + " · " + t("statusYourTurn");
      dot.style.background = "var(--accent)";
    } else {
      text = t("statusBotTurn");
      dot.style.background = "#8899aa";
    }
    document.getElementById("statusText").textContent = text;
    document.getElementById("thinking").classList.toggle("show", !!botThinking);
  }

  function updateMeta() {
    document.getElementById("sideLabel").textContent = userColor === "w" ? t("sideWhite") : t("sideBlack");
    document.getElementById("turnLabel").textContent = state.turn === "w" ? t("turnWhite") : t("turnBlack");
    document.getElementById("moveCount").textContent = String(moveHistory.length);
    document.getElementById("oppLabel").textContent = t("metaBot") + " — " + t(diffLabelKey());
    document.getElementById("metaOppK").textContent = t("metaOpp");
  }

  function diffLabelKey() {
    if (difficulty === "easy") return "diffEasy";
    if (difficulty === "hard") return "diffHard";
    return "diffMedium";
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t("docTitle");
    document.getElementById("modeBadge").textContent = t("modeBadge");
    document.getElementById("playAreaTitle").textContent = t("playArea");
    document.getElementById("missionTitle").textContent = t("mission");
    document.getElementById("sessionTitle").textContent = t("session");
    document.getElementById("historyTitle").textContent = t("history");
    document.getElementById("rulesBtn").textContent = t("rulesButton");
    document.getElementById("rulesTitle").textContent = t("rulesTitle");
    document.getElementById("rulesCloseBtn").setAttribute("aria-label", t("rulesClose"));
    document.getElementById("rulesBox").innerHTML = t("rulesHtml");
    document.getElementById("sideSelectLabel").textContent = t("sideSelectLabel");
    document.getElementById("diffLabel").textContent = t("diffLabel");
    document.getElementById("newGameBtn").textContent = t("newGame");
    document.getElementById("rollBtn").textContent = t("roll");
    document.getElementById("metaSideK").textContent = t("metaSide");
    document.getElementById("metaTurnK").textContent = t("metaTurn");
    document.getElementById("metaMovesK").textContent = t("metaMoves");
    document.getElementById("thinkingText").textContent = t("thinking");
    var sideSel = document.getElementById("sideSelect");
    sideSel.options[0].textContent = t("sideWhite");
    sideSel.options[1].textContent = t("sideBlack");
    var diff = document.getElementById("difficulty");
    diff.options[0].textContent = t("diffEasy");
    diff.options[1].textContent = t("diffMedium");
    diff.options[2].textContent = t("diffHard");
    document.getElementById("langRu").classList.toggle("active", lang === "ru");
    document.getElementById("langEn").classList.toggle("active", lang === "en");
    updateMeta();
    updateStatus();
    renderBoard();
    renderDice();
    renderHistory();
  }

  function setLang(next) {
    if (next !== "ru" && next !== "en") return;
    lang = next;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
  }

  function rollDiceValues() {
    var a = 1 + Math.floor(Math.random() * 6);
    var b = 1 + Math.floor(Math.random() * 6);
    if (a === b) return [a, a, a, a];
    return [a, b];
  }

  function clearTurnTimers() {
    if (rollTimer) { clearTimeout(rollTimer); rollTimer = null; }
    if (passTimer) { clearTimeout(passTimer); passTimer = null; }
  }

  function startTurnRoll(values) {
    rolledDice = values.slice();
    remainingDice = values.slice();
    phase = "move";
    selectedFrom = null;
    headLeft = 1;
    refreshTurnPlays();
    if (!turnPlays.length || (turnPlays.length === 1 && !turnPlays[0].moves.length)) {
      botThinking = false;
      renderAll();
      document.getElementById("statusText").textContent = t("statusNoMove");
      document.getElementById("thinking").classList.remove("show");
      clearTurnTimers();
      passTimer = setTimeout(function () {
        passTimer = null;
        if (state.winner) return;
        endTurnPass();
      }, 900);
      return;
    }
    renderAll();
    if (!isUserTurn()) {
      scheduleBotMove();
    }
  }

  function endTurnPass() {
    var note = (state.turn === "w" ? "W" : "B") + " —";
    moveHistory.push(note);
    remainingDice = [];
    rolledDice = [];
    selectedFrom = null;
    headLeft = 1;
    if (state.winner) {
      phase = "over";
      renderAll();
      return;
    }
    state.turn = opp(state.turn);
    phase = "roll";
    renderAll();
    scheduleAutoRoll();
  }

  function endTurnAfterMoves() {
    remainingDice = [];
    selectedFrom = null;
    headLeft = 1;
    if (state.winner) {
      phase = "over";
      rolledDice = [];
      renderAll();
      return;
    }
    state.turn = opp(state.turn);
    phase = "roll";
    rolledDice = [];
    renderAll();
    scheduleAutoRoll();
  }

  function consumeDie(die) {
    var idx = remainingDice.indexOf(die);
    if (idx >= 0) remainingDice.splice(idx, 1);
  }

  function playMove(move) {
    var player = state.turn;
    if (move.fromHead || move.from === headPoint(player)) headLeft = Math.max(0, headLeft - 1);
    state = applyMove(state, player, move);
    moveHistory.push(formatMove(player, move));
    consumeDie(move.die);
    selectedFrom = null;
    if (state.winner) {
      phase = "over";
      remainingDice = [];
      renderAll();
      return;
    }
    if (!remainingDice.length) {
      endTurnAfterMoves();
      return;
    }
    refreshTurnPlays();
    if (!turnPlays.length || (turnPlays.length === 1 && !turnPlays[0].moves.length)) {
      endTurnAfterMoves();
      return;
    }
    renderAll();
  }

  function trySelectFrom(from) {
    if (!isUserTurn() || phase !== "move" || botThinking) return;
    var legal = legalNextMoves().filter(function (m) { return m.from === from; });
    if (!legal.length) {
      selectedFrom = null;
      renderBoard();
      return;
    }
    if (selectedFrom === from) {
      selectedFrom = null;
      renderBoard();
      return;
    }
    selectedFrom = from;
    if (legal.length === 1) {
      playMove(legal[0]);
      return;
    }
    renderBoard();
  }

  function trySelectTo(to) {
    if (!isUserTurn() || phase !== "move" || botThinking) return;
    if (selectedFrom == null) {
      trySelectFrom(to);
      return;
    }
    var legal = movesFromSelected(selectedFrom);
    var match = null;
    for (var i = 0; i < legal.length; i++) {
      if (legal[i].bear && to === "off") { match = legal[i]; break; }
      if (!legal[i].bear && legal[i].to === to) { match = legal[i]; break; }
    }
    if (match) playMove(match);
    else trySelectFrom(typeof to === "number" ? to : selectedFrom);
  }

  function onBoardClick(e) {
    var off = e.target.closest("[data-off]");
    if (off) {
      var who = off.getAttribute("data-off");
      if (who === state.turn) trySelectTo("off");
      return;
    }
    var chip = e.target.closest(".bg-chip");
    var point = e.target.closest("[data-point]");
    if (chip && chip.getAttribute("data-from") != null) {
      var f = chip.getAttribute("data-from");
      if (f === "off") return;
      var from = Number(f);
      if (selectedFrom != null && selectedFrom !== from) {
        if (point) {
          trySelectTo(Number(point.getAttribute("data-point")));
          return;
        }
      }
      if (state.points[from] && state.points[from].color === state.turn) {
        trySelectFrom(from);
        return;
      }
    }
    if (point) {
      var n = Number(point.getAttribute("data-point"));
      if (selectedFrom != null) {
        trySelectTo(n);
      } else if (state.points[n].color === state.turn && state.points[n].count > 0) {
        trySelectFrom(n);
      }
    }
  }

  function doRoll() {
    // Kept for compatibility; normal play uses scheduleAutoRoll
    if (phase !== "roll" || botThinking || state.winner) return;
    clearTurnTimers();
    var vals = rollDiceValues();
    if (!isUserTurn()) botThinking = false;
    startTurnRoll(vals);
  }

  function scheduleAutoRoll() {
    if (state.winner || phase !== "roll") return;
    clearTurnTimers();
    var delay = 400 + Math.floor(Math.random() * 301); // ~400–700ms
    if (!isUserTurn()) {
      botThinking = true;
      updateStatus();
      document.getElementById("thinking").classList.add("show");
    } else {
      botThinking = false;
      updateStatus();
    }
    rollTimer = setTimeout(function () {
      rollTimer = null;
      if (state.winner || phase !== "roll") return;
      var vals = rollDiceValues();
      botThinking = false;
      startTurnRoll(vals);
    }, delay);
  }

  function applyBotStep(move) {
    var player = state.turn;
    if (move.fromHead || move.from === headPoint(player)) headLeft = Math.max(0, headLeft - 1);
    state = applyMove(state, player, move);
    moveHistory.push(formatMove(player, move));
    consumeDie(move.die);
    selectedFrom = null;
    renderAll();
  }

  function scheduleBotMove() {
    if (state.winner || phase !== "move") return;
    if (isUserTurn()) return;
    botThinking = true;
    updateStatus();
    document.getElementById("thinking").classList.add("show");
    var delay = difficulty === "easy" ? 320 : difficulty === "hard" ? 650 : 450;
    setTimeout(function () {
      var play = pickBotPlay(state, remainingDice.slice(), difficulty, headLeft);
      if (!play || !play.moves.length) {
        botThinking = false;
        document.getElementById("thinking").classList.remove("show");
        endTurnAfterMoves();
        return;
      }
      var moves = play.moves.slice();
      function step() {
        if (state.winner) {
          botThinking = false;
          document.getElementById("thinking").classList.remove("show");
          phase = "over";
          remainingDice = [];
          renderAll();
          return;
        }
        if (!moves.length) {
          botThinking = false;
          document.getElementById("thinking").classList.remove("show");
          remainingDice = [];
          endTurnAfterMoves();
          return;
        }
        var m = moves.shift();
        applyBotStep(m);
        if (state.winner) {
          botThinking = false;
          document.getElementById("thinking").classList.remove("show");
          phase = "over";
          remainingDice = [];
          renderAll();
          return;
        }
        setTimeout(step, 260);
      }
      step();
    }, delay);
  }

  function renderAll() {
    renderBoard();
    renderDice();
    renderHistory();
    updateMeta();
    updateStatus();
  }

  function newGame() {
    clearTurnTimers();
    state = initialState();
    remainingDice = [];
    rolledDice = [];
    phase = "roll";
    selectedFrom = null;
    moveHistory = [];
    botThinking = false;
    turnPlays = [];
    headLeft = 1;
    renderAll();
    scheduleAutoRoll();
  }

  var dragFrom = null;
  document.getElementById("bgBoard").addEventListener("pointerdown", function (e) {
    if (!isUserTurn() || phase !== "move" || botThinking) return;
    var chip = e.target.closest(".bg-chip");
    if (!chip) return;
    var f = chip.getAttribute("data-from");
    if (f == null || f === "off") return;
    var from = Number(f);
    if (!state.points[from] || state.points[from].color !== state.turn) return;
    var legal = legalNextMoves().filter(function (m) { return m.from === from; });
    if (!legal.length) return;
    dragFrom = from;
    selectedFrom = from;
    renderBoard();
    try { chip.setPointerCapture(e.pointerId); } catch (err) {}
  });
  document.getElementById("bgBoard").addEventListener("pointerup", function (e) {
    if (dragFrom == null) return;
    var from = dragFrom;
    dragFrom = null;
    var off = e.target.closest("[data-off]");
    if (off && off.getAttribute("data-off") === state.turn) {
      trySelectTo("off");
      return;
    }
    var point = e.target.closest("[data-point]");
    if (point) {
      var n = Number(point.getAttribute("data-point"));
      selectedFrom = from;
      trySelectTo(n);
      return;
    }
    renderBoard();
  });

  document.getElementById("langRu").addEventListener("click", function () { setLang("ru"); });
  document.getElementById("langEn").addEventListener("click", function () { setLang("en"); });
  document.getElementById("newGameBtn").addEventListener("click", newGame);
  // rollBtn hidden; dice auto-roll via scheduleAutoRoll
  document.getElementById("rulesBtn").addEventListener("click", function () {
    document.getElementById("rulesDialog").showModal();
  });
  document.getElementById("rulesCloseBtn").addEventListener("click", function () {
    document.getElementById("rulesDialog").close();
  });
  document.getElementById("rulesDialog").addEventListener("click", function (e) {
    if (e.target === document.getElementById("rulesDialog")) {
      document.getElementById("rulesDialog").close();
    }
  });
  document.getElementById("sideSelect").addEventListener("change", function (e) {
    userColor = e.target.value === "b" ? "b" : "w";
    try { localStorage.setItem(SIDE_KEY, userColor); } catch (err) {}
    newGame();
  });
  document.getElementById("difficulty").addEventListener("change", function (e) {
    difficulty = e.target.value;
    try { localStorage.setItem(DIFF_KEY, difficulty); } catch (err) {}
    updateMeta();
  });
  document.getElementById("bgBoard").addEventListener("click", onBoardClick);

  document.getElementById("sideSelect").value = userColor;
  document.getElementById("difficulty").value = difficulty;
  applyLang();
  newGame();
})();
</script>
</body>
</html>
