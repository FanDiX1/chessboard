  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    .ck-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 0 1px var(--border-soft), 0 12px 40px rgba(0, 0, 0, 0.45);
      user-select: none;
      touch-action: none;
      position: relative;
    }
    .ck-board.flipped { transform: rotate(180deg); }
    .ck-board.flipped .ck-piece { transform: rotate(180deg); }
    .ck-sq {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }
    .ck-sq.light { background: #c8cdd5; }
    .ck-sq.dark { background: #4a5564; }
    .ck-sq.selected { box-shadow: inset 0 0 0 3px var(--accent); }
    .ck-sq.legal::after {
      content: "";
      width: 22%;
      height: 22%;
      border-radius: 50%;
      background: rgba(159, 239, 0, 0.55);
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }
    .ck-sq.legal-capture::after {
      width: 78%;
      height: 78%;
      background: transparent;
      border: 3px solid rgba(255, 62, 62, 0.75);
      box-sizing: border-box;
    }
    .ck-sq.last-from, .ck-sq.last-to {
      box-shadow: inset 0 0 0 3px rgba(159, 239, 0, 0.45);
    }
    .ck-sq.drop-hover { box-shadow: inset 0 0 0 3px rgba(159, 239, 0, 0.9); }
    .ck-piece {
      width: 72%;
      height: 72%;
      border-radius: 50%;
      cursor: grab;
      z-index: 1;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.18);
      transition: transform 0.12s ease;
      touch-action: none;
    }
    .ck-piece:hover { transform: scale(1.05); }
    .ck-piece.dragging {
      opacity: 0.35;
      cursor: grabbing;
    }
    .ck-piece.w {
      background: radial-gradient(circle at 35% 30%, #f5f7fa, #d0d5dd 55%, #9aa3b0);
      border: 2px solid #e8edf2;
    }
    .ck-piece.b {
      background: radial-gradient(circle at 35% 30%, #3a4048, #1a1d21 55%, #0b0e11);
      border: 2px solid #2a2f36;
    }
    .ck-piece.king::before {
      content: "♛";
      display: grid;
      place-items: center;
      height: 100%;
      font-size: clamp(0.7rem, 3.2vw, 1.15rem);
      line-height: 1;
      color: var(--accent);
      text-shadow: 0 0 6px var(--accent-glow);
    }
    .ck-piece.b.king::before { color: var(--accent); }
    .ck-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.55), inset 0 2px 4px rgba(255,255,255,0.18);
      opacity: 0.95;
      display: none;
    }
    .ck-ghost.show { display: block; }
    .ck-ghost.w {
      background: radial-gradient(circle at 35% 30%, #f5f7fa, #d0d5dd 55%, #9aa3b0);
      border: 2px solid #e8edf2;
    }
    .ck-ghost.b {
      background: radial-gradient(circle at 35% 30%, #3a4048, #1a1d21 55%, #0b0e11);
      border: 2px solid #2a2f36;
    }
    .ck-ghost.king::before {
      content: "♛";
      display: grid;
      place-items: center;
      height: 100%;
      font-size: clamp(0.7rem, 3.2vw, 1.15rem);
      color: var(--accent);
      text-shadow: 0 0 6px var(--accent-glow);
    }
  </style>
</head>

</header>

        </div>

          <p class="mp-hint" id="mpSpectatorCount"></p>

  /* ---- Board model (Russian draughts) ---- */
  function emptyBoard() {
    var b = [];
    for (var r = 0; r < 8; r++) {
      b[r] = [];
      for (var c = 0; c < 8; c++) b[r][c] = null;
    }
    return b;
  }

  function initialBoard() {
    var b = emptyBoard();
    for (var r = 0; r < 8; r++) {
      for (var c = 0; c < 8; c++) {
        if ((r + c) % 2 !== 1) continue;
        if (r <= 2) b[r][c] = { color: "b", king: false };
        else if (r >= 5) b[r][c] = { color: "w", king: false };
      }
    }
    return b;
  }

  function cloneBoard(b) {
    var n = emptyBoard();
    for (var r = 0; r < 8; r++)
      for (var c = 0; c < 8; c++) {
        var p = b[r][c];
        n[r][c] = p ? { color: p.color, king: p.king } : null;
      }
    return n;
  }

  function inBounds(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }
  var DIRS = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
  function manForwardDirs(color) {
    return color === "w" ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]];
  }
  function keySq(r, c) { return r + "," + c; }

  function boardToFen(brd, side) {
    var rows = [];
    for (var r = 0; r < 8; r++) {
      var empty = 0, row = "";
      for (var c = 0; c < 8; c++) {
        var p = brd[r][c];
        if (!p) { empty++; continue; }
        if (empty) { row += empty; empty = 0; }
        row += p.color === "w" ? (p.king ? "W" : "w") : (p.king ? "B" : "b");
      }
      if (empty) row += empty;
      rows.push(row || "8");
    }
    return rows.join("/") + " " + (side === "b" ? "b" : "w");
  }

  function fenToBoard(fen) {
    var parts = String(fen || "").trim().split(/\s+/);
    var rows = (parts[0] || "").split("/");
    var side = parts[1] === "b" ? "b" : "w";
    var brd = emptyBoard();
    for (var r = 0; r < 8; r++) {
      var c = 0, row = rows[r] || "";
      for (var i = 0; i < row.length; i++) {
        var ch = row[i];
        if (ch >= "1" && ch <= "8") { c += +ch; continue; }
        if (ch === "w") brd[r][c] = { color: "w", king: false };
        else if (ch === "W") brd[r][c] = { color: "w", king: true };
        else if (ch === "b") brd[r][c] = { color: "b", king: false };
        else if (ch === "B") brd[r][c] = { color: "b", king: true };
        c++;
      }
    }
    return { board: brd, turn: side };
  }

  function captureSequencesFrom(board, r, c, piece, capturedSet) {
    var results = [];
    var enemy = piece.color === "w" ? "b" : "w";

    function dfs(brd, cr, cc, isKing, caps, path) {
      var extended = false;
      for (var di = 0; di < 4; di++) {
        var dr = DIRS[di][0], dc = DIRS[di][1];
        if (!isKing) {
          var mr = cr + dr, mc = cc + dc;
          var lr = cr + 2 * dr, lc = cc + 2 * dc;
          if (!inBounds(lr, lc)) continue;
          var mid = brd[mr] && brd[mr][mc];
          if (!mid || mid.color !== enemy) continue;
          if (brd[lr][lc]) continue;
          var ck = keySq(mr, mc);
          if (caps[ck]) continue;
          var nb = cloneBoard(brd);
          nb[cr][cc] = null;
          nb[mr][mc] = null;
          var nk = isKing;
          if (!nk && ((piece.color === "w" && lr === 0) || (piece.color === "b" && lr === 7))) nk = true;
          nb[lr][lc] = { color: piece.color, king: nk };
          var nc = Object.assign({}, caps); nc[ck] = true;
          var np = path.concat([{ r: lr, c: lc }]);
          extended = true;
          dfs(nb, lr, lc, nk, nc, np);
        } else {
          var sr = cr + dr, sc = cc + dc;
          while (inBounds(sr, sc) && !brd[sr][sc]) { sr += dr; sc += dc; }
          if (!inBounds(sr, sc)) continue;
          var vic = brd[sr][sc];
          if (!vic || vic.color !== enemy) continue;
          var vk = keySq(sr, sc);
          if (caps[vk]) continue;
          var lr2 = sr + dr, lc2 = sc + dc;
          while (inBounds(lr2, lc2) && !brd[lr2][lc2]) {
            var nb2 = cloneBoard(brd);
            nb2[cr][cc] = null;
            nb2[sr][sc] = null;
            nb2[lr2][lc2] = { color: piece.color, king: true };
            var nc2 = Object.assign({}, caps); nc2[vk] = true;
            var np2 = path.concat([{ r: lr2, c: lc2 }]);
            extended = true;
            dfs(nb2, lr2, lc2, true, nc2, np2);
            lr2 += dr; lc2 += dc;
          }
        }
      }
      if (!extended && path.length > 0) {
        var capList = Object.keys(caps).map(function (k) {
          var parts = k.split(",");
          return { r: +parts[0], c: +parts[1] };
        });
        var last = path[path.length - 1];
        results.push({
          from: { r: r, c: c },
          to: { r: last.r, c: last.c },
          path: path.slice(),
          captures: capList,
          promote: false
        });
      }
    }
    dfs(board, r, c, !!piece.king, capturedSet || {}, []);
    return results;
  }

  // Return only the next landing square of each available capture sequence.
  // This keeps a multi-capture interactive: every jump is a separate move while
  // the same piece (and turn) remain active until no capture is left.
  function captureStepMovesFrom(board, r, c, piece) {
    var sequences = captureSequencesFrom(board, r, c, piece, {});
    var moves = [], seen = {};
    for (var i = 0; i < sequences.length; i++) {
      var seq = sequences[i];
      if (!seq.path.length || !seq.captures.length) continue;
      var first = seq.path[0];
      var key = keySq(first.r, first.c);
      if (seen[key]) continue;
      seen[key] = true;
      moves.push({
        from: { r: r, c: c },
        to: { r: first.r, c: first.c },
        path: [{ r: first.r, c: first.c }],
        captures: [{ r: seq.captures[0].r, c: seq.captures[0].c }],
        promote: !piece.king && ((piece.color === "w" && first.r === 0) || (piece.color === "b" && first.r === 7))
      });
    }
    return moves;
  }

  function interactiveMoves(board, color) {
    var captures = [], quiets = [];
    for (var r = 0; r < 8; r++) {
      for (var c = 0; c < 8; c++) {
        var p = board[r][c];
        if (!p || p.color !== color) continue;
        var caps = captureStepMovesFrom(board, r, c, p);
        for (var i = 0; i < caps.length; i++) captures.push(caps[i]);
      }
    }
    if (captures.length) return captures;
    for (var r2 = 0; r2 < 8; r2++) {
      for (var c2 = 0; c2 < 8; c2++) {
        var p2 = board[r2][c2];
        if (!p2 || p2.color !== color) continue;
        var qs = quietMovesFrom(board, r2, c2, p2);
        for (var j = 0; j < qs.length; j++) quiets.push(qs[j]);
      }
    }
    return quiets;
  }

  function quietMovesFrom(board, r, c, piece) {
    var moves = [];
    if (piece.king) {
      for (var di = 0; di < 4; di++) {
        var dr = DIRS[di][0], dc = DIRS[di][1];
        var nr = r + dr, nc = c + dc;
        while (inBounds(nr, nc) && !board[nr][nc]) {
          moves.push({
            from: { r: r, c: c }, to: { r: nr, c: nc },
            path: [{ r: nr, c: nc }], captures: [], promote: false
          });
          nr += dr; nc += dc;
        }
      }
    } else {
      var fds = manForwardDirs(piece.color);
      for (var i = 0; i < fds.length; i++) {
        var nr2 = r + fds[i][0], nc2 = c + fds[i][1];
        if (!inBounds(nr2, nc2) || board[nr2][nc2]) continue;
        var promo = (piece.color === "w" && nr2 === 0) || (piece.color === "b" && nr2 === 7);
        moves.push({
          from: { r: r, c: c }, to: { r: nr2, c: nc2 },
          path: [{ r: nr2, c: nc2 }], captures: [], promote: promo
        });
      }
    }
    return moves;
  }

  function allMoves(board, color) {
    var captures = [];
    var quiets = [];
    for (var r = 0; r < 8; r++) {
      for (var c = 0; c < 8; c++) {
        var p = board[r][c];
        if (!p || p.color !== color) continue;
        var caps = captureSequencesFrom(board, r, c, p, {});
        for (var i = 0; i < caps.length; i++) captures.push(caps[i]);
      }
    }
    if (captures.length > 0) return captures;
    for (var r2 = 0; r2 < 8; r2++) {
      for (var c2 = 0; c2 < 8; c2++) {
        var p2 = board[r2][c2];
        if (!p2 || p2.color !== color) continue;
        var q = quietMovesFrom(board, r2, c2, p2);
        for (var j = 0; j < q.length; j++) quiets.push(q[j]);
      }
    }
    return quiets;
  }

  function applyMove(board, move) {
    var nb = cloneBoard(board);
    var piece = nb[move.from.r][move.from.c];
    nb[move.from.r][move.from.c] = null;
    for (var i = 0; i < move.captures.length; i++) {
      var cap = move.captures[i];
      nb[cap.r][cap.c] = null;
    }
    var last = move.path[move.path.length - 1];
    var king = piece.king;
    if (!king && ((piece.color === "w" && last.r === 0) || (piece.color === "b" && last.r === 7))) king = true;
    if (!king) {
      for (var k = 0; k < move.path.length; k++) {
        var sq = move.path[k];
        if ((piece.color === "w" && sq.r === 0) || (piece.color === "b" && sq.r === 7)) king = true;
      }
    }
    nb[last.r][last.c] = { color: piece.color, king: king };
    return nb;
  }

  function countPieces(board, color) {
    var n = 0, kings = 0;
    for (var r = 0; r < 8; r++)
      for (var c = 0; c < 8; c++) {
        var p = board[r][c];
        if (p && p.color === color) { n++; if (p.king) kings++; }
      }
    return { n: n, kings: kings };
  }

  function evaluate(board, color) {
    var me = countPieces(board, color);
    var opp = countPieces(board, color === "w" ? "b" : "w");
    var score = (me.n - opp.n) * 10 + (me.kings - opp.kings) * 6;
    for (var r = 0; r < 8; r++) {
      for (var c = 0; c < 8; c++) {
        var p = board[r][c];
        if (!p || p.king) continue;
        if (p.color === color) score += color === "w" ? (7 - r) * 0.3 : r * 0.3;
        else score -= p.color === "w" ? (7 - r) * 0.3 : r * 0.3;
      }
    }
    return score;
  }

  function pickBotMove(board, color, diff) {
    var moves = allMoves(board, color);
    if (moves.length === 0) return null;
    if (diff === "easy") {
      return moves[Math.floor(Math.random() * moves.length)];
    }
    var best = null;
    var bestScore = -Infinity;
    var replyLimit = diff === "hard" ? 24 : 12;
    var noise = diff === "hard" ? 0.15 : 0.5;
    for (var i = 0; i < moves.length; i++) {
      var m = moves[i];
      var nb = applyMove(board, m);
      var s = evaluate(nb, color) + m.captures.length * 4 + Math.random() * noise;
      var replies = allMoves(nb, color === "w" ? "b" : "w");
      if (replies.length === 0) s += 50;
      else {
        var worst = Infinity;
        var lim = Math.min(replies.length, replyLimit);
        for (var j = 0; j < lim; j++) {
          var rb = applyMove(nb, replies[j]);
          var rs = evaluate(rb, color);
          if (rs < worst) worst = rs;
        }
        s = s * 0.35 + worst * 0.65;
      }
      if (s > bestScore) { bestScore = s; best = m; }
    }
    return best;
  }

  function ensureMpSocket(cb) {

    setMpConn("connecting");
    if (mpSocket) { try { mpSocket.removeAllListeners(); mpSocket.disconnect(); } catch (e) {} mpSocket = null; }
    mpSocket = io(mpServerUrl, { transports: ["websocket", "polling"], reconnection: true, reconnectionAttempts: 12, timeout: 8000 });
    mpSocket.on("connect", function () {
      setMpConn(mpBothSeated() ? "playing" : (mpActive ? "waiting" : "connected"));

          if (res && res.ok) applyMpRoom(res);
        });
      } else if (!mpActive) {
        requestRoomList();
      }
      if (cb) { var f = cb; cb = null; f(null); }
    });
    mpSocket.on("connect_error", function () {
      setMpConn("error", t("mpError"));
      if (cb) { var f = cb; cb = null; f(new Error("connect_error")); }

        return;

  function applyMpRoom(res) {
    if (!res) return;
    if (res.room) mpRoom = res.room;
    if (res.code) mpRoomCode = res.code;
    var role = res.role || (res.room && res.room.yourRole) || null;
    if (role === "spectator" || res.role === "spectator") {
      mpSpectating = true;
      mpSeat = null;
    } else if (res.seat) {
      mpSpectating = false;
      mpSeat = res.seat; userColor = res.seat; try { localStorage.setItem(COLOR_KEY, userColor); } catch (e) {}
    } else if (res.room && res.room.yourSeat) {
      mpSpectating = false;
      mpSeat = res.room.yourSeat; userColor = mpSeat;

    } else {

      var other = mpSeat === "w" ? "b" : "w";

  function parseCaptureChain(chain) {
    if (!chain || (chain.color !== "w" && chain.color !== "b")) return null;
    var current = algebraicToRC(chain.current);
    return current ? { color: chain.color, current: current } : null;
  }

  function sameCaptureChain(a, b) {
    if (!a || !b) return !a && !b;
    return a.color === b.color && a.current.r === b.current.r && a.current.c === b.current.c;
  }

  function chainPayload() {
    return captureChain ? { color: captureChain.color, current: sqLabel(captureChain.current.r, captureChain.current.c) } : null;
  }

  function syncBoardFromMpRoom(forceReset) {
    if (!mpRoom) return;
    var fen = mpRoom.fen || START_FEN;
    var nextChain = parseCaptureChain(mpRoom.chain);
    var cur = boardToFen(board, turn);
    if (forceReset || cur !== fen || !sameCaptureChain(captureChain, nextChain)) {
      var parsed = fenToBoard(fen);
      board = parsed.board;
      turn = parsed.turn;
      captureChain = nextChain;
      if (Array.isArray(mpRoom.plySans)) moveHistory = mpRoom.plySans.slice();
      gameOver = null;
      refreshMoveHighlights();
      lastMove = mpRoom.lastMove ? {
        from: algebraicToRC(mpRoom.lastMove.from) || mpRoom.lastMove.from,
        to: algebraicToRC(mpRoom.lastMove.to) || mpRoom.lastMove.to
      } : null;
      if (lastMove && typeof lastMove.from === "object" && lastMove.from.r == null) lastMove = null;
      checkGameOver();
      updateMeta();
      renderHistory();
      renderBoard();
    }
  }

  function algebraicToRC(sq) {
    if (!sq || typeof sq !== "string" || sq.length < 2) return null;
    var c = sq.charCodeAt(0) - 97;
    var r = 8 - parseInt(sq[1], 10);
    if (r < 0 || r > 7 || c < 0 || c > 7) return null;
    return { r: r, c: c };
  }

  function applyRemotePosition(msg) {
    mpApplyingRemote = true;
    try {
      if (msg.fen) {
        var parsed = fenToBoard(msg.fen);
        board = parsed.board;
        turn = parsed.turn;
      }
      captureChain = parseCaptureChain(msg.chain);
      if (Array.isArray(msg.plySans)) moveHistory = msg.plySans.slice();
      else if (msg.move && msg.move.san && moveHistory[moveHistory.length - 1] !== msg.move.san) {
        moveHistory.push(msg.move.san);
      }
      if (msg.move) {
        var fr = algebraicToRC(msg.move.from);
        var to = algebraicToRC(msg.move.to);
        if (fr && to) lastMove = { from: fr, to: to };
      }
      gameOver = null;
      checkGameOver();
      refreshMoveHighlights();
      if (msg.status === "finished" && !gameOver) {
        // client already set via checkGameOver; keep
      }
      updateMeta();
      updateStatus();
      renderHistory();
      renderBoard();
      if (mpRoom) {
        mpRoom.fen = msg.fen || mpRoom.fen;
        mpRoom.plySans = moveHistory.slice();
        mpRoom.lastMove = msg.move || mpRoom.lastMove;
        if (msg.status) mpRoom.status = msg.status;
        mpRoom.chain = msg.chain || null;
      }
    } finally {
      mpApplyingRemote = false;
    }
  }


  var mpRoomListTimer = null;
  var mpLastRoomList = [];

  function requestRoomList() {
    if (mpActive) return;
    if (!mpSocket || !mpSocket.connected) return;
    mpSocket.emit("listRooms", { mode: GAME_MODE }, function (res) {
      if (res && Array.isArray(res.rooms)) renderRoomList(res.rooms);
    });
  }

  function startRoomListPolling() {
    stopRoomListPolling();
    ensureMpSocket(function (err) {
      if (err) return;
      requestRoomList();
      mpRoomListTimer = setInterval(function () {
        if (!mpActive) requestRoomList();
      }, 6000);
    });
  }

  function stopRoomListPolling() {
    if (mpRoomListTimer) {
      clearInterval(mpRoomListTimer);
      mpRoomListTimer = null;
    }
  }

  function renderRoomList(rooms) {
    mpLastRoomList = Array.isArray(rooms) ? rooms : [];
    var list = document.getElementById("mpRoomsList");
    var empty = document.getElementById("mpRoomsEmpty");
    if (!list) return;
    list.innerHTML = "";
    if (!mpLastRoomList.length) {
      if (empty) { empty.classList.remove("mp-hidden"); empty.textContent = t("mpRoomsEmpty"); }
      return;
    }
    if (empty) empty.classList.add("mp-hidden");
    mpLastRoomList.forEach(function (r) {
      if (!r || !r.code) return;
      var seatsTxt = roomListSeatText(r.seats ? r.seats.w : null) + " \u00b7 " + roomListSeatText(r.seats ? r.seats.b : null);
      var row = document.createElement("div");
      row.className = "mp-room-row";
      var info = document.createElement("div");
      info.className = "mp-room-info";
      var codeEl = document.createElement("span");
      codeEl.className = "mp-room-code";
      codeEl.textContent = r.code;
      var seatsEl = document.createElement("span");
      seatsEl.className = "mp-room-seats";
      seatsEl.textContent = seatsTxt;
      info.appendChild(codeEl);
      info.appendChild(seatsEl);
      if (typeof r.spectatorCount === "number" && r.spectatorCount > 0) {
        var specEl = document.createElement("span");
        specEl.className = "mp-room-specs";
        specEl.textContent = t("mpSpectators") + ": " + r.spectatorCount;
        info.appendChild(specEl);
      }
      var actions = document.createElement("div");
      actions.className = "mp-room-actions btn-row";
      if (r.joinable) {
        var joinBtn = document.createElement("button");
        joinBtn.type = "button";
        joinBtn.className = "btn btn-primary";
        joinBtn.textContent = t("mpJoin");
        joinBtn.addEventListener("click", function () { enterMpFromJoin(r.code); });
        actions.appendChild(joinBtn);
      }
      var specBtn = document.createElement("button");
      specBtn.type = "button";
      specBtn.className = "btn btn-ghost";
      specBtn.textContent = t("mpSpectate");
      specBtn.addEventListener("click", function () { enterMpFromSpectate(r.code); });
      actions.appendChild(specBtn);
      row.appendChild(info);
      row.appendChild(actions);
      list.appendChild(row);
    });
  }

  function enterMpFromCreate() {
    ensureMpSocket(function (err) {
      if (err) return;
      persistNickFromInput();
      mpSocket.emit("createRoom", {
        clientId: getOrCreateClientId(),
        mode: GAME_MODE,
        preferredSeat: userColor === "b" ? "b" : "w",
        nick: getNick()
      }, function (res) {
        if (!res || !res.ok) { setMpConn("error", (res && res.error) || t("mpError")); return; }
        applyMpRoom(res);
      });
    });
  }

  function enterMpFromJoin(code) {
    code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    if (!code) return;
    ensureMpSocket(function (err) {
      if (err) return;
      persistNickFromInput();
      mpSocket.emit("joinRoom", {
        clientId: getOrCreateClientId(),
        code: code,
        mode: GAME_MODE,
        nick: getNick()
      }, function (res) {
        if (!res || !res.ok) {
          var errKey = res && res.error;
          var msg = t("mpError");
          if (errKey === "room_not_found") msg = t("mpNotFound");
          if (errKey === "room_full") msg = t("mpRoomFull");
          if (errKey === "wrong_mode") msg = t("mpWrongMode");
          setMpConn("error", msg);
          return;
        }
        applyMpRoom(res);
      });
    });
  }


  function enterMpFromSpectate(code) {
    code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    if (!code) return;
    persistNickFromInput();
    ensureMpSocket(function (err) {
      if (err) return;
      if (typeof clearTurnTimers === "function") clearTurnTimers();
      mpSocket.emit("spectateRoom", {
        clientId: getOrCreateClientId(),
        code: code,
        mode: GAME_MODE,
        nick: getNick()
      }, function (res) {
        if (!res || !res.ok) {
          var errKey = res && res.error;
          var msg = t("mpError");
          if (errKey === "room_not_found") msg = t("mpNotFound");
          if (errKey === "wrong_mode" && t("mpWrongMode") !== "mpWrongMode") msg = t("mpWrongMode");
          setMpConn("error", msg);
          return;
        }
        applyMpRoom(res);
      });
    });
  }

  function leaveMultiplayer() {
    if (mpSocket && mpRoomCode) {
      try { mpSocket.emit("leaveRoom", { clientId: getOrCreateClientId(), code: mpRoomCode }); } catch (e) {}
    }
    mpActive = false;
    mpSpectating = false;
    mpRoomCode = null;
    mpSeat = null;
    mpRoom = null;
    try { localStorage.removeItem(MP_ROOM_KEY); } catch (e) {}
    if (mpSocket) {
      try { mpSocket.removeAllListeners(); mpSocket.disconnect(); } catch (e) {}
      mpSocket = null;
    }
    setMpConn("offline");
    updateMpUI();
    newGame();
  }


  /** Opponent left mid-game: keep position and continue vs local bot. */
  function promoteMpToLocalBot() {
    if (!mpActive || mpSpectating) return false;
    if (gameOver) return false;
    var midGame = moveHistory.length > 0 || (mpRoom && mpRoom.status === "playing");
    if (!midGame) return false;
    var keptSeat = mpSeat || userColor || "w";
    var keptBoard = cloneBoard(board);
    var keptTurn = turn;
    var keptHistory = moveHistory.slice();
    var keptLast = lastMove ? { from: { r: lastMove.from.r, c: lastMove.from.c }, to: { r: lastMove.to.r, c: lastMove.to.c } } : null;
    var keptChain = captureChain ? { color: captureChain.color, current: { r: captureChain.current.r, c: captureChain.current.c } } : null;
    if (mpSocket && mpRoomCode) {
      try { mpSocket.emit("leaveRoom", { clientId: getOrCreateClientId(), code: mpRoomCode }); } catch (e) {}
    }
    mpActive = false;
    mpSpectating = false;
    mpRoomCode = null;
    mpSeat = null;
    mpRoom = null;
    try { localStorage.removeItem(MP_ROOM_KEY); } catch (e) {}
    if (mpSocket) {
      try { mpSocket.removeAllListeners(); mpSocket.disconnect(); } catch (e) {}
      mpSocket = null;
    }
    setMpConn("offline");
    updateMpUI();
    userColor = keptSeat === "b" ? "b" : "w";
    try { localStorage.setItem(COLOR_KEY, userColor); } catch (e) {}
    var sideSel = document.getElementById("sideSelect");
    if (sideSel) sideSel.value = userColor;
    board = keptBoard;
    turn = keptTurn;
    moveHistory = keptHistory;
    lastMove = keptLast;
    captureChain = keptChain;
    gameOver = null;
    botThinking = false;
    document.getElementById("thinking").classList.remove("show");
    selected = null;
    legalForSelected = [];
    updateMeta();
    renderHistory();
    renderBoard();
    var dot = document.getElementById("statusDot");
    var textEl = document.getElementById("statusText");
    if (dot) { dot.className = "status-dot warn"; }
    if (textEl) textEl.textContent = t("mpContinueBot");
    maybeBotTurn();
    return true;
  }

  function publishMpMove(move, notation) {
    if (!canMpAct() || !mpSocket) return;
    var fen = boardToFen(board, turn);
    var from = sqLabel(move.from.r, move.from.c);
    var to = sqLabel(move.to.r, move.to.c);
    mpSocket.emit("makeMove", {
      clientId: getOrCreateClientId(),
      code: mpRoomCode,
      from: from,
      to: to,
      fen: fen,
      san: notation,
      plySans: moveHistory.slice(),
      gameOver: !!gameOver,
      chain: chainPayload()
    });
    if (mpRoom) {
      mpRoom.fen = fen;
      mpRoom.plySans = moveHistory.slice();
      mpRoom.chain = chainPayload();
      mpRoom.lastMove = { from: from, to: to, san: notation, color: mpSeat };
      if (gameOver) mpRoom.status = "finished";
    }
  }

  function tryAutoRejoin() {
    var params = new URLSearchParams(window.location.search);
    var roomParam = params.get("join") || params.get("room");
    var spectateParam = params.get("spectate");
    if (spectateParam) {
      enterMpFromSpectate(spectateParam);
      return;
    }
    var saved = null;
    try { saved = localStorage.getItem(MP_ROOM_KEY); } catch (e) {}
    var code = (roomParam || saved || "").toUpperCase().trim();
    if (!code) return;
    ensureMpSocket(function (err) {
      if (err) return;
      mpSocket.emit("reconnectRoom", { clientId: getOrCreateClientId(), code: code, nick: getNick() }, function (res) {
        if (res && res.ok) { applyMpRoom(res); return; }
        mpSocket.emit("joinRoom", { clientId: getOrCreateClientId(), code: code, mode: GAME_MODE, nick: getNick() }, function (res2) {
          if (res2 && res2.ok) applyMpRoom(res2);
          else if (roomParam) setMpConn("error", t("mpNotFound"));
        });
      });
    });
  }

  function isUserTurn() {
    if (gameOver) return false;
    if (isMultiplayer()) {
      if (!mpBothSeated()) return false;
      return turn === mpSeat;
    }
    return turn === userColor;
  }

  function clearMoveHighlights() {
    selected = null;
    legalForSelected = [];
  }

  /** Keep/restore selection only on the local user's turn (e.g. multi-capture). */
  function refreshMoveHighlights() {
    if (gameOver || botThinking || !isUserTurn()) {
      clearMoveHighlights();
      return;
    }
    if (captureChain && captureChain.color === turn) {
      selected = { r: captureChain.current.r, c: captureChain.current.c };
      legalForSelected = movesFromSquare(selected.r, selected.c);
    }
  }

  function sqLabel(r, c) {
    return String.fromCharCode(97 + c) + (8 - r);
  }

  function moveNotation(m) {
    var sep = m.captures.length ? ":" : "-";
    var s = sqLabel(m.from.r, m.from.c);
    for (var i = 0; i < m.path.length; i++) s += sep + sqLabel(m.path[i].r, m.path[i].c);
    return s;
  }

  function diffLabelKey() {
    if (difficulty === "easy") return "diffEasy";
    if (difficulty === "hard") return "diffHard";
    return "diffMedium";
  }

  function updateOpponentLabel() {
    document.getElementById("metaOppK").textContent = mpSpectating ? t("mpSpectatingMeta") : t("metaOpp");
    var label;
    if (isMultiplayer()) {
      var oppColor = mpSeat === "w" ? "b" : (mpSeat === "b" ? "w" : null);
      var nick = "";
      if (oppColor && mpRoom && mpRoom.seats && mpRoom.seats[oppColor] && mpRoom.seats[oppColor].occupied) {
        nick = displayNickOrStub(mpRoom.seats[oppColor].nick || "");
      }
      if (mpSpectating) {
        label = t("mpSpectatingMeta");
      } else {
        label = nick || t("mpOpponent");
      }
    } else {
      label = t("metaBot") + " — " + t(diffLabelKey());
    }
    document.getElementById("oppLabel").textContent = label;
  }

  function setLang(next) {
    if (next !== "ru" && next !== "en") return;
    lang = next;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
  }

  function updateMeta() {
    document.getElementById("sideLabel").textContent = userColor === "w" ? t("sideWhite") : t("sideBlack");
    document.getElementById("turnLabel").textContent = turn === "w" ? t("turnWhite") : t("turnBlack");
    document.getElementById("moveCount").textContent = String(moveHistory.length);
    updateOpponentLabel();
  }

  function updateStatus() {
    var dot = document.getElementById("statusDot");
    var text = document.getElementById("statusText");
    dot.className = "status-dot";
    if (gameOver) {
      dot.classList.add(gameOver === "draw" ? "warn" : "danger");
      text.textContent = gameOver === "w" ? t("statusWinW") : gameOver === "b" ? t("statusWinB") : t("statusDraw");
      return;
    }
    if (botThinking) {
      dot.classList.add("info");
      text.textContent = t("statusThinking");
      return;
    }
    if (isMultiplayer() && !mpBothSeated()) {
      dot.classList.add("info");
      text.textContent = t("mpWaiting");
      return;
    }
    var moves = allMoves(board, turn);
    var mustCap = moves.length > 0 && moves[0].captures.length > 0;
    if (isUserTurn()) {
      text.textContent = (isMultiplayer() ? t("mpYourTurn") : t("statusYour")) +
        (mustCap ? " · " + t("statusMustCapture") : "");
    } else {
      text.textContent = isMultiplayer() ? t("mpOppTurn") : t("statusOpp");
      dot.classList.add("info");
    }
  }

  function renderHistory() {
    var el = document.getElementById("moveList");
    if (!moveHistory.length) { el.textContent = t("noMoves"); return; }
    var html = "";
    for (var i = 0; i < moveHistory.length; i += 2) {
      var n = (i / 2) + 1;
      html += "<div>" + n + ". " + moveHistory[i];
      if (moveHistory[i + 1]) html += " &nbsp; " + moveHistory[i + 1];
      html += "</div>";
    }
    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
  }

  function boardFlip() {
    if (isMultiplayer()) return userColor === "b";
    return userColor === "b";
  }

  function renderBoard() {
    var el = document.getElementById("board");
    el.classList.toggle("flipped", boardFlip());
    el.innerHTML = "";

    var showHighlights = !gameOver && !botThinking && isUserTurn();
    var legalTargets = {};
    if (showHighlights) {
      for (var i = 0; i < legalForSelected.length; i++) {
        var m = legalForSelected[i];
        legalTargets[keySq(m.to.r, m.to.c)] = m;
      }
    }

    for (var r = 0; r < 8; r++) {
      for (var c = 0; c < 8; c++) {
        var sq = document.createElement("div");
        var dark = (r + c) % 2 === 1;
        sq.className = "ck-sq " + (dark ? "dark" : "light");
        sq.dataset.r = r;
        sq.dataset.c = c;

        if (showHighlights && selected && selected.r === r && selected.c === c) sq.classList.add("selected");
        if (lastMove && lastMove.from && lastMove.to) {
          if (lastMove.from.r === r && lastMove.from.c === c) sq.classList.add("last-from");
          if (lastMove.to.r === r && lastMove.to.c === c) sq.classList.add("last-to");
        }
        var tk = keySq(r, c);
        if (showHighlights && legalTargets[tk]) {
          sq.classList.add("legal");
          if (legalTargets[tk].captures.length) sq.classList.add("legal-capture");
        }

        var p = board[r][c];
        if (p) {
          var piece = document.createElement("div");
          piece.className = "ck-piece " + p.color + (p.king ? " king" : "");
          piece.dataset.r = r;
          piece.dataset.c = c;
          piece.addEventListener("pointerdown", onPiecePointerDown);
          sq.appendChild(piece);
        }

        sq.addEventListener("click", onSquareClick);
        el.appendChild(sq);
      }
    }
  }

  function movesFromSquare(r, c) {
    if (captureChain) {
      if (captureChain.color !== turn || captureChain.current.r !== r || captureChain.current.c !== c) return [];
      var chainedPiece = board[r][c];
      return chainedPiece ? captureStepMovesFrom(board, r, c, chainedPiece) : [];
    }
    return interactiveMoves(board, turn).filter(function (m) {
      return m.from.r === r && m.from.c === c;
    });
  }

  function pickMoveTo(r, c) {
    var opts = legalForSelected.filter(function (m) { return m.to.r === r && m.to.c === c; });
    if (!opts.length) return null;
    opts.sort(function (a, b) {
      return b.captures.length - a.captures.length || b.path.length - a.path.length;
    });
    return opts[0];
  }

  function selectSquare(r, c) {
    var p = board[r][c];
    if (p && p.color === turn) {
      var ms = movesFromSquare(r, c);
      if (ms.length) {
        selected = { r: r, c: c };
        legalForSelected = ms;
        renderBoard();
        return true;
      }
    }
    selected = null;
    legalForSelected = [];
    renderBoard();
    return false;
  }

  function onSquareClick(ev) {
    if (dragState && dragState.moved) return;
    if (gameOver || botThinking || !isUserTurn()) return;
    var sq = ev.currentTarget;
    var r = +sq.dataset.r, c = +sq.dataset.c;
    if (selected) {
      var mv = pickMoveTo(r, c);
      if (mv) { playMove(mv); return; }
    }
    selectSquare(r, c);
  }

  /* ---- Drag and drop ---- */
  function onPiecePointerDown(ev) {
    if (gameOver || botThinking || !isUserTurn()) return;
    if (ev.button != null && ev.button !== 0) return;
    var piece = ev.currentTarget;
    var r = +piece.dataset.r, c = +piece.dataset.c;
    var p = board[r][c];
    if (!p || p.color !== turn) return;
    var ms = movesFromSquare(r, c);
    if (!ms.length) return;

    ev.preventDefault();
    selected = { r: r, c: c };
    legalForSelected = ms;
    renderBoard();

    // re-find piece after re-render
    var fresh = document.querySelector('.ck-piece[data-r="' + r + '"][data-c="' + c + '"]');
    if (!fresh) return;
    fresh.classList.add("dragging");

    var rect = fresh.getBoundingClientRect();
    ghostEl.className = "ck-ghost show " + p.color + (p.king ? " king" : "");
    ghostEl.style.width = rect.width + "px";
    ghostEl.style.height = rect.height + "px";
    moveGhost(ev.clientX, ev.clientY, rect.width, rect.height);

    dragState = { r: r, c: c, pieceEl: fresh, moved: false, w: rect.width, h: rect.height };
    try { fresh.setPointerCapture(ev.pointerId); } catch (e) {}
    fresh.addEventListener("pointermove", onPiecePointerMove);
    fresh.addEventListener("pointerup", onPiecePointerUp);
    fresh.addEventListener("pointercancel", onPiecePointerUp);
  }

  function moveGhost(x, y, w, h) {
    ghostEl.style.left = (x - w / 2) + "px";
    ghostEl.style.top = (y - h / 2) + "px";
  }

  function onPiecePointerMove(ev) {
    if (!dragState) return;
    dragState.moved = true;
    moveGhost(ev.clientX, ev.clientY, dragState.w, dragState.h);
    var under = squareFromPoint(ev.clientX, ev.clientY);
    document.querySelectorAll(".ck-sq.drop-hover").forEach(function (el) { el.classList.remove("drop-hover"); });
    if (under) {
      var mv = pickMoveTo(+under.dataset.r, +under.dataset.c);
      if (mv) under.classList.add("drop-hover");
    }
  }

  function squareFromPoint(x, y) {
    var el = document.elementFromPoint(x, y);
    if (!el) return null;
    var sq = el.closest ? el.closest(".ck-sq") : null;
    return sq;
  }

  function onPiecePointerUp(ev) {
    if (!dragState) return;
    var st = dragState;
    var pieceEl = st.pieceEl;
    pieceEl.removeEventListener("pointermove", onPiecePointerMove);
    pieceEl.removeEventListener("pointerup", onPiecePointerUp);
    pieceEl.removeEventListener("pointercancel", onPiecePointerUp);
    try { pieceEl.releasePointerCapture(ev.pointerId); } catch (e) {}
    ghostEl.className = "ck-ghost";
    document.querySelectorAll(".ck-sq.drop-hover").forEach(function (el) { el.classList.remove("drop-hover"); });

    var played = false;
    if (st.moved) {
      var under = squareFromPoint(ev.clientX, ev.clientY);
      if (under) {
        var mv = pickMoveTo(+under.dataset.r, +under.dataset.c);
        if (mv) { playMove(mv); played = true; }
      }
    }
    dragState = null;
    if (!played) {
      // click-to-select already set; just re-render to clear dragging opacity
      renderBoard();
    }
  }

  function checkGameOver() {
    var w = countPieces(board, "w");
    var b = countPieces(board, "b");
    if (w.n === 0) { gameOver = "b"; clearMoveHighlights(); return; }
    if (b.n === 0) { gameOver = "w"; clearMoveHighlights(); return; }
    if (captureChain) {
      var cp = board[captureChain.current.r] && board[captureChain.current.r][captureChain.current.c];
      if (!cp || cp.color !== turn || !captureStepMovesFrom(board, captureChain.current.r, captureChain.current.c, cp).length) {
        captureChain = null;
        turn = turn === "w" ? "b" : "w";
        clearMoveHighlights();
      }
    }
    var moves = allMoves(board, turn);
    if (moves.length === 0) {
      gameOver = turn === "w" ? "b" : "w";
      clearMoveHighlights();
    }
  }

  function playMove(move, opts) {
    opts = opts || {};
    board = applyMove(board, move);
    var notation = moveNotation(move);
    moveHistory.push(notation);
    lastMove = { from: move.from, to: move.to };
    var nextChain = null;
    if (move.captures.length) {
      var landing = move.path[move.path.length - 1];
      var landed = board[landing.r] && board[landing.r][landing.c];
      if (landed && captureStepMovesFrom(board, landing.r, landing.c, landed).length) {
        nextChain = { color: landed.color, current: { r: landing.r, c: landing.c } };
      }
    }
    captureChain = nextChain;
    if (!nextChain) turn = turn === "w" ? "b" : "w";
    gameOver = null;
    checkGameOver();
    refreshMoveHighlights();
    updateMeta();
    updateStatus();
    renderHistory();
    renderBoard();
    if (!opts.silent && isMultiplayer() && !mpApplyingRemote) {
      publishMpMove(move, notation);
    }
    if (!opts.silent) maybeBotTurn();
  }

  function maybeBotTurn() {
    if (gameOver || isMultiplayer()) return;
    if (turn === userColor) return;
    clearMoveHighlights();
    botThinking = true;
    document.getElementById("thinking").classList.add("show");
    renderBoard();
    updateStatus();
    var delay = difficulty === "easy" ? 180 : difficulty === "hard" ? 420 : 280;
    setTimeout(function () {
      var m = pickBotMove(board, turn, difficulty);
      botThinking = false;
      document.getElementById("thinking").classList.remove("show");
      if (m) playMove(m);
      else {
        checkGameOver();
        updateStatus();
        renderBoard();
      }
    }, delay + Math.random() * 220);
  }

  function newGame() {
    if (isMultiplayer() && mpSocket && mpRoomCode) {
      mpSocket.emit("resetGame", { clientId: getOrCreateClientId(), code: mpRoomCode });
      return;
    }
    board = initialBoard();
    turn = "w";
    captureChain = null;
    selected = null;
    legalForSelected = [];
    moveHistory = [];
    lastMove = null;
    gameOver = null;
    botThinking = false;
    document.getElementById("thinking").classList.remove("show");
    updateMeta();
    updateStatus();
    renderHistory();
    renderBoard();
    maybeBotTurn();
  }

  function wireMp() {
    var roomsRefreshBtn = document.getElementById("mpRoomsRefreshBtn");
    if (roomsRefreshBtn) {
      roomsRefreshBtn.addEventListener("click", function () {
        ensureMpSocket(function (err) { if (!err) requestRoomList(); });
      });
    }
    document.getElementById("mpCreateBtn").addEventListener("click", function () { enterMpFromCreate(); });
    document.getElementById("mpJoinToggleBtn").addEventListener("click", function () {
      var panel = document.getElementById("mpJoinPanel");
      var sp = document.getElementById("mpSpectatePanel");
      panel.classList.toggle("mp-hidden");
      if (sp) sp.classList.add("mp-hidden");
      if (!panel.classList.contains("mp-hidden")) document.getElementById("mpJoinCode").focus();
    });
    document.getElementById("mpJoinBtn").addEventListener("click", function () {
      enterMpFromJoin(document.getElementById("mpJoinCode").value);
    });
    document.getElementById("mpJoinCode").addEventListener("keydown", function (e) {
      if (e.key === "Enter") enterMpFromJoin(document.getElementById("mpJoinCode").value);
    });
    document.getElementById("mpSpectateToggleBtn").addEventListener("click", function () {
      var panel = document.getElementById("mpSpectatePanel");
      var jp = document.getElementById("mpJoinPanel");
      panel.classList.toggle("mp-hidden");
      if (jp) jp.classList.add("mp-hidden");
      if (!panel.classList.contains("mp-hidden")) document.getElementById("mpSpectateCode").focus();
    });
    document.getElementById("mpSpectateBtn").addEventListener("click", function () {
      enterMpFromSpectate(document.getElementById("mpSpectateCode").value);
    });
    document.getElementById("mpSpectateCode").addEventListener("keydown", function (e) {
      if (e.key === "Enter") enterMpFromSpectate(document.getElementById("mpSpectateCode").value);
    });
    var nickEl = document.getElementById("mpNick");
    if (nickEl) {
      nickEl.addEventListener("change", persistNickFromInput);
      nickEl.addEventListener("blur", persistNickFromInput);
    }
    document.getElementById("mpCopyBtn").addEventListener("click", function () {
      var link = buildShareLink(mpRoomCode);
      var btn = document.getElementById("mpCopyBtn");
      var done = function () {
        var toast = document.getElementById("mpCopyToast");
        if (toast) {
          toast.textContent = t("mpCopied");
          toast.classList.add("show");
          window.clearTimeout(toast._hideTimer);
          toast._hideTimer = window.setTimeout(function () { toast.classList.remove("show"); }, 1200);
        }
        btn.textContent = t("mpCopied");
        setTimeout(function () { btn.textContent = copyBtnLabel(); }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(done).catch(function () {
          try { window.prompt(t("mpCodeLabel"), link); } catch (e) {}
        });
      } else {
        try { window.prompt(t("mpCodeLabel"), link); done(); } catch (e) {}
      }
    });
    function seatHandler(color) {
      return function (e) {
        if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
        if (e.type === "keydown") e.preventDefault();
        claimMpSeat(color);
      };
    }
    document.getElementById("mpSeatW").addEventListener("click", seatHandler("w"));
    document.getElementById("mpSeatW").addEventListener("keydown", seatHandler("w"));
    document.getElementById("mpSeatB").addEventListener("click", seatHandler("b"));
    document.getElementById("mpSeatB").addEventListener("keydown", seatHandler("b"));
    document.getElementById("mpLeaveBtn").addEventListener("click", function () { leaveMultiplayer(); });
    document.getElementById("mpResetBtn").addEventListener("click", newGame);
  }

  var rulesDialog = document.getElementById("rulesDialog");
  document.getElementById("rulesBtn").addEventListener("click", function () { rulesDialog.showModal(); });
  document.getElementById("rulesCloseBtn").addEventListener("click", function () { rulesDialog.close(); });
  rulesDialog.addEventListener("click", function (e) {
    if (e.target === rulesDialog) rulesDialog.close();
  });

  document.getElementById("langRu").addEventListener("click", function () { setLang("ru"); });
  document.getElementById("langEn").addEventListener("click", function () { setLang("en"); });
  document.getElementById("newGameBtn").addEventListener("click", newGame);
  document.getElementById("sideSelect").addEventListener("change", function (e) {
    userColor = e.target.value;
    try { localStorage.setItem(COLOR_KEY, userColor); } catch (err) {}
    if (!isMultiplayer()) newGame();
  });
  document.getElementById("difficulty").addEventListener("change", function (e) {
    difficulty = e.target.value;
    try { localStorage.setItem(DIFF_KEY, difficulty); } catch (err) {}
    updateOpponentLabel();
    if (!isMultiplayer()) newGame();
  });

  document.getElementById("sideSelect").value = userColor;
  document.getElementById("difficulty").value = difficulty;
  wireMp();
  applyLang();
  setMpConn("offline");

  var paramsEarly = new URLSearchParams(window.location.search);
  var maybeMp = !!(paramsEarly.get("join") || paramsEarly.get("room") || paramsEarly.get("spectate") || (function () {
    try { return localStorage.getItem(MP_ROOM_KEY); } catch (e) { return null; }
  })());
  tryAutoRejoin();

  if (!isMultiplayer() && !maybeMp) {
    newGame();
  } else if (!maybeMp) {
    renderBoard();
    updateMeta();
    updateStatus();
  } else {
    // waiting for MP reconnect — show empty start until room sync
    board = initialBoard();
    turn = "w";
    renderBoard();
    updateMeta();
    updateStatus();
  }
})();
</script>
</body>
</html>
