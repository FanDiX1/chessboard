<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardHack — Three-player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/boardhack.css" />
  <style>
    .three-page .board-wrap { max-width: 100%; }
    .three-board { width: 100%; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .three-board svg { width: 100%; height: auto; display: block; }
    .three-board .sq { stroke: #0b0e11; stroke-width: 1.2; cursor: pointer; }
    .three-board .sq.light { fill: #d9c7a4; }
    .three-board .sq.dark { fill: #6b4e38; }
    .three-board .sq.sel { stroke: #9fef00; stroke-width: 3; }
    .three-board .sq.last { stroke: #ffbf00; stroke-width: 2.4; }
    .three-board .pc {
      pointer-events: none;
      -webkit-touch-callout: none;
      user-select: none;
    }
    .three-board .pc.dragging { opacity: 0.28; }
    .three-board .dot { pointer-events: none; }
    .three-board .cap {
      fill: none;
      stroke: #9fef00;
      stroke-width: 4;
      pointer-events: none;
    }
    .three-board.is-dragging, .three-board.is-dragging .sq { cursor: grabbing; }
    .three-drag-ghost {
      position: fixed;
      display: none;
      pointer-events: none;
      z-index: 40;
      transform: translate(-50%, -55%);
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45));
      -webkit-user-drag: none;
    }
    .three-drag-ghost.red { filter: url(#redPiece) drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45)); }
    .three-note { margin-top: 0.45rem; color: var(--warn); font-size: 0.92rem; min-height: 1.2em; }
    .three-page .move-head,
    .three-page .move-row {
      display: grid;
      grid-template-columns: 1.5rem minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 0.2rem 0.35rem;
      align-items: center;
    }
    .three-page .move-head {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 0.15rem 0.4rem 0.4rem;
      margin: -0.15rem 0 0.15rem;
      color: var(--text-muted);
      font-size: 0.72rem;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
    }
    .three-page .move-row { padding: 0.28rem 0.4rem; }
    .three-page .move-san {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rules-dialog .rules-box p { margin: 0 0 0.7rem; color: var(--text-muted); }
  </style>
</head>
<body class="three-page">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a href="../../../">
          <div class="brand-mark">♞</div>
          <div>Board<span class="accent">Hack</span></div>
        </a>
        <span class="mode-badge" id="modeBadge">Шахматы · На троих</span>
      </div>
      <div class="topbar-actions">
        <div class="settings-menu" id="settingsMenu">
          <button type="button" class="settings-menu-btn" id="settingsMenuBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsDialog" aria-label="Settings" title="Settings">
            <span aria-hidden="true">⚙</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="layout">
      <section class="card">
        <div class="card-title" id="playAreaTitle">Игровая зона</div>
        <div class="status-bar" id="statusBar">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">…</span>
        </div>
        <p class="three-note" id="noteText"></p>
        <div class="board-wrap">
          <div class="three-board" id="boardMount">
            <svg id="boardSvg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 640" role="img" aria-label="Three-player board"></svg>
          </div>
          <img id="dragGhost" class="three-drag-ghost" alt="" draggable="false" />
        </div>
      </section>

      <aside class="side-stack">
        <section class="card">
          <div class="card-title" id="missionTitle">Управление</div>
          <div class="controls">
            <div>
              <label class="field-label" for="sideSelect" id="sideSelectLabel">Играть за</label>
              <select id="sideSelect">
                <option value="w">Белые</option>
                <option value="r">Красные</option>
                <option value="b">Чёрные</option>
                <option value="hot">Втроём</option>
              </select>
            </div>
            <div class="btn-row">
              <button type="button" class="btn btn-primary" id="newGameBtn">Новая игра</button>
              <button type="button" class="btn btn-ghost" id="undoBtn">Отмена</button>
              <button type="button" class="btn btn-ghost" id="rulesBtn">Правила</button>
            </div>
          </div>
        </section>

        <section class="card" id="boardSettingsCard">
          <div class="card-title" id="boardSettingsTitle">Настройки</div>
          <div class="controls">
            <div>
              <label class="field-label" for="firstMoveSelect" id="firstMoveLabel">Первый ход</label>
              <select id="firstMoveSelect">
                <option value="lot">Жребий</option>
                <option value="w">Белые</option>
                <option value="r">Красные</option>
                <option value="b">Чёрные</option>
              </select>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-title" id="sessionTitle">Сессия</div>
          <div class="meta-grid">
            <div class="meta-item">
              <div class="k" id="metaFirstK">Жребий</div>
              <div class="v" id="firstLabel">—</div>
            </div>
            <div class="meta-item">
              <div class="k" id="metaTurnK">Ход</div>
              <div class="v" id="turnLabel">—</div>
            </div>
            <div class="meta-item">
              <div class="k" id="metaMovesK">Ходы</div>
              <div class="v" id="moveCount">0</div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-title" id="historyTitle">История ходов</div>
          <div class="move-list" id="moveList"></div>
        </section>
      </aside>
    </div>
    <footer class="footer">BoardHack</footer>
  </main>

  <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="settings-dialog-head">
      <h2 class="card-title" id="settingsTitle">Настройки</h2>
      <button type="button" class="settings-dialog-close" id="settingsCloseBtn" aria-label="Close">×</button>
    </div>
    <div class="settings-dialog-body">
      <div class="settings-menu-section">
        <div class="settings-menu-label" id="settingsLangLabel">Язык</div>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" id="langRu" data-lang="ru">RU</button>
          <span class="lang-sep">|</span>
          <button type="button" id="langEn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="rules-dialog" id="rulesDialog" aria-labelledby="rulesTitle">
    <div class="rules-dialog-head">
      <h2 class="card-title" id="rulesTitle">Шахматы на троих</h2>
      <button type="button" class="rules-dialog-close" id="rulesCloseBtn" aria-label="Close">×</button>
    </div>
    <div class="rules-box" id="rulesBox"></div>
  </dialog>

  <script src="../../../js/i18n.js?v=20261003d"></script>
  <script src="../../../js/drag-scroll-lock.js"></script>
  <script src="../../../js/board-context-guard.js"></script>
  <script src="three-chess.js?v=20261003d"></script>
  <script src="three-ui.js?v=20261003d"></script>
</body>
</html>
