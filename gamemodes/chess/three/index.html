<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardHack — Three-player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/boardhack.css" />
  <style>
    .three-board { width: min(100%, 680px); margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
    .three-board svg { width: 100%; height: auto; display: block; }
    .three-board .sq { stroke: #0b0e11; stroke-width: 1.2; cursor: pointer; }
    .three-board .sq.light { fill: #d9c7a4; }
    .three-board .sq.dark { fill: #6b4e38; }
    .three-board .sq.sel { stroke: #9fef00; stroke-width: 3; }
    .three-board .sq.last { stroke: #ffbf00; stroke-width: 2.4; }
    .three-board .pc {
      font-size: 28px;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.85));
    }
    .three-board .dot { pointer-events: none; }
    .three-note { margin-top: 0.45rem; color: var(--warn); font-size: 0.92rem; min-height: 1.2em; }
    .rules-panel .rules-box { max-height: min(52vh, 460px); overflow: auto; }
    .rules-panel .rules-box p { margin: 0 0 0.7rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a href="../../../">
          <div class="brand-mark">♞</div>
          <div>Board<span class="accent">Hack</span></div>
        </a>
        <span class="mode-badge" id="modeBadge">Шахматы · На троих</span>
      </div>
      <div class="topbar-actions">
        <div class="settings-menu" id="settingsMenu">
          <button type="button" class="settings-menu-btn" id="settingsMenuBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsDialog" aria-label="Settings" title="Settings">
            <span aria-hidden="true">⚙</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="layout">
      <section class="card">
        <div class="card-title" id="playAreaTitle">Игровая зона</div>
        <div class="status-bar" id="statusBar">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">…</span>
        </div>
        <p class="three-note" id="noteText"></p>
        <div class="board-wrap">
          <div class="three-board" id="boardMount">
            <svg id="boardSvg" viewBox="0 0 640 640" role="img" aria-label="Three-player board"></svg>
          </div>
        </div>
      </section>

      <aside class="side-stack">
        <section class="card">
          <div class="card-title" id="missionTitle">Управление</div>
          <div class="controls">
            <div>
              <label class="field-label" for="sideSelect" id="sideSelectLabel">Играть за</label>
              <select id="sideSelect">
                <option value="w">Белые</option>
                <option value="r">Красные</option>
                <option value="b">Чёрные</option>
                <option value="hot">Втроём</option>
              </select>
            </div>
            <div class="btn-row">
              <button type="button" class="btn btn-primary" id="newGameBtn">Новая игра</button>
              <button type="button" class="btn btn-ghost" id="undoBtn">Отмена</button>
            </div>
          </div>
        </section>

        <section class="card rules-panel">
          <div class="card-title" id="rulesPanelTitle">Правила</div>
          <div class="rules-box" id="rulesBox"></div>
        </section>

        <section class="card">
          <div class="card-title" id="sessionTitle">Сессия</div>
          <div class="meta-grid">
            <div class="meta-item">
              <div class="k" id="metaFirstK">Жребий</div>
              <div class="v" id="firstLabel">—</div>
            </div>
            <div class="meta-item">
              <div class="k" id="metaTurnK">Ход</div>
              <div class="v" id="turnLabel">—</div>
            </div>
            <div class="meta-item">
              <div class="k" id="metaMovesK">Ходы</div>
              <div class="v" id="moveCount">0</div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-title" id="historyTitle">История ходов</div>
          <div class="move-list" id="moveList"></div>
        </section>
      </aside>
    </div>
    <footer class="footer">BoardHack</footer>
  </main>

  <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="settings-dialog-head">
      <h2 class="card-title" id="settingsTitle">Настройки</h2>
      <button type="button" class="settings-dialog-close" id="settingsCloseBtn" aria-label="Close">×</button>
    </div>
    <div class="settings-dialog-body">
      <div class="settings-menu-section">
        <div class="settings-menu-label" id="settingsLangLabel">Язык</div>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" id="langRu" data-lang="ru">RU</button>
          <span class="lang-sep">|</span>
          <button type="button" id="langEn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </dialog>

  <script src="../../../js/i18n.js?v=20261003a"></script>
  <script src="three-chess.js?v=20261003a"></script>
  <script src="three-ui.js?v=20261003a"></script>
</body>
</html>
