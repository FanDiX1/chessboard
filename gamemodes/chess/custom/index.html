      /**
       * Analyze a played move given the FEN before it was played and the UCI.
       * Calls done(null) on skip/cancel; done({kind,cpl,square}) on success.
       */
      function analyzePlayedMove(fenBefore, playedUci, toSquare, done) {
        if (!isMoveAnalysisOn() || !fenBefore || !playedUci) {
          if (done) done(null);
          return;
        }
        if (typeof BoardHackStockfish === "undefined" || !BoardHackStockfish.analyzePosition) {
          if (done) done(null);
          return;
        }
        var myGen = ++mqGen;
        BoardHackStockfish.analyzePosition(fenBefore, 10)
          .then(function (bestInfo) {
            if (myGen !== mqGen || !isMoveAnalysisOn()) {
              if (done) done(null);
              return null;
            }
            var bestUci = bestInfo && bestInfo.bestMove;
            var bestScore = bestInfo && bestInfo.score;
            if (bestUci && bestUci === playedUci) {
              return {
                kind: "best",
                cpl: 0,
                square: toSquare,
                bestUci: bestUci
              };
            }
            // Eval after the played move (opponent to move) → negate for mover
            var g2 = new Chess(fenBefore);
            var parsed = BoardHackStockfish.parseUci(playedUci);
            if (!parsed) return null;
            var mv = g2.move({
              from: parsed.from,
              to: parsed.to,
              promotion: parsed.promotion || "q"
            });
            if (!mv) return null;
            var fenAfter = g2.fen();
            return BoardHackStockfish.analyzePosition(fenAfter, 10).then(function (afterInfo) {
              if (myGen !== mqGen || !isMoveAnalysisOn()) return null;
              var bestCp = scoreToCp(bestScore);
              var afterCp = scoreToCp(afterInfo && afterInfo.score);
              var playedCp = -afterCp;
              var cpl = bestCp - playedCp;
              if (cpl < 0) cpl = 0;
              // Mate miss / getting mated adjustments already live in scoreToCp scale
              var kind = classifyCpLoss(Math.round(cpl));
              // Soft-upgrade near-best when engine noise is tiny and move was almost best
              if (kind === "best" && bestUci && bestUci !== playedUci) {
                kind = "excellent";
              }
              return {
                kind: kind,
                cpl: Math.round(cpl),
                square: toSquare || (parsed && parsed.to),
                bestUci: bestUci
              };
            });
          })
          .then(function (result) {
            if (myGen !== mqGen) {
              if (done) done(null);
              return;
            }
            if (result) {
              mqLast = {
                square: result.square,
                kind: result.kind,
                cpl: result.cpl,
                sanIndex: plySans.length - 1
              };
              placeMoveQualityBadge(result.square, result.kind);
              updateMoveList();
            }
            if (done) done(result || null);
          })
          .catch(function (err) {
            if (err && err.message === "cancelled") {
              if (done) done(null);
              return;
            }
            console.warn("Move analysis failed:", err && err.message ? err.message : err);
            if (done) done(null);
          });
      }

      /** After local user ply: analyze then continue (bot / status). */
      function afterLocalMoveForAnalysis(movedObj, continueFn) {
        function finishAnalysisChain() {
          if (continueFn) continueFn();
          // Defer: skip if bot is about to / already using Stockfish; bot path re-triggers after its ply
          window.setTimeout(function () {
            if (typeof botThinking !== "undefined" && botThinking) return;
            if (!isMultiplayer() && typeof canBotActNow === "function" && canBotActNow(false)) return;
            if (typeof schedulePositionEval === "function") schedulePositionEval();
          }, 40);
        }
        if (!movedObj || !isMoveAnalysisOn()) {
          finishAnalysisChain();
          return;
        }
        if (typeof BoardHackStockfish === "undefined" || !BoardHackStockfish.analyzePosition) {
          finishAnalysisChain();
          return;
        }
        // fen before = from undo stack snapshot if available
        var fenBefore = null;
        if (undoStack.length) {
          var snap = undoStack[undoStack.length - 1];
          fenBefore = snap && snap.fen ? snap.fen : null;
        }
        if (!fenBefore) {
          // reconstruct by undoing temporarily
          var tmp = game.undo();
          if (tmp) {
            fenBefore = game.fen();
            game.move(tmp);
          }
        }
        var uci = BoardHackStockfish.moveToUci(movedObj);
        analyzePlayedMove(fenBefore, uci, movedObj.to, function () {
          finishAnalysisChain();
        });
      }


      /* ===== Position evaluation bar (custom only; toggle default OFF) ===== */
      var posEvalEnabled = false;
      try {
        posEvalEnabled = localStorage.getItem(POS_EVAL_KEY) === "1";
      } catch (e) {}
      var peGen = 0;
      var peLastScore = null; // { type, value } from white's perspective

      function isPosEvalOn() {
        return !!posEvalEnabled;
      }

      function syncPosEvalToggle() {
        var el = document.getElementById("posEvalToggle");
        if (el) el.setAttribute("aria-checked", posEvalEnabled ? "true" : "false");
      }

      function setPosEvalVisible(show) {
        var bar = document.getElementById("posEvalBar");
        if (!bar) return;
        if (show) {
          bar.hidden = false;
          bar.setAttribute("aria-hidden", "false");
        } else {
          bar.hidden = true;
          bar.setAttribute("aria-hidden", "true");
        }
      }

      function resetPosEvalDisplay() {
        peLastScore = null;
        var fill = document.getElementById("posEvalFill");
        if (fill) {
          fill.style.left = "50%";
          fill.style.width = "0%";
          fill.classList.remove("pos-eval-opp-adv", "pos-eval-black-adv");
        }
      }

      function hidePosEval() {
        peGen += 1;
        setPosEvalVisible(false);
        resetPosEvalDisplay();
      }

      function setPosEvalEnabled(on) {
        posEvalEnabled = !!on;
        try {
          localStorage.setItem(POS_EVAL_KEY, posEvalEnabled ? "1" : "0");
        } catch (e) {}
        if (!posEvalEnabled) {
          hidePosEval();
          return;
        }
        setPosEvalVisible(true);
        if (typeof isPlayPhase === "function" && isPlayPhase()) {
          schedulePositionEval();
        } else {
          resetPosEvalDisplay();
        }
      }

      /**
       * Map white-pov score to a signed fill in [-1, +1] relative to the human
       * (userColor): +1 = near-full RIGHT (human better), -1 = near-full LEFT
       * (opponent better). Mate → near full; cp uses a smooth tanh curve.
       */
      function scoreToSignedFill(score) {
        if (!score || score.type == null) return 0;
        var whiteSigned = 0;
        if (score.type === "mate") {
          var mv = score.value | 0;
          if (mv !== 0) {
            var absM = Math.abs(mv);
            // M1 ≈ 0.98, longer mates slightly less full, floor ~0.92
            var mag = 0.92 + 0.06 * Math.max(0, 1 - (absM - 1) / 10);
            whiteSigned = (mv > 0 ? 1 : -1) * mag;
          }
        } else {
          var pawns = (score.value | 0) / 100;
          // tanh: ±1 pawn ≈ 0.36, ±3 ≈ 0.76, ±5 ≈ 0.91 of the 0.95 cap
          whiteSigned = Math.tanh(pawns / 2.5) * 0.95;
        }
        var humanIsBlack = (typeof userColor !== "undefined" && userColor === "b");
        return humanIsBlack ? -whiteSigned : whiteSigned;
      }

      function applyPosEvalScore(score) {
        peLastScore = score || null;
        var fill = document.getElementById("posEvalFill");
        if (!fill) return;
        var signed = scoreToSignedFill(peLastScore);
        var halfPct = Math.abs(signed) * 50; // 0..50% of track from center
        if (signed >= 0) {
          fill.style.left = "50%";
          fill.style.width = halfPct.toFixed(2) + "%";
          fill.classList.remove("pos-eval-opp-adv", "pos-eval-black-adv");
        } else {
          fill.style.left = (50 - halfPct).toFixed(2) + "%";
          fill.style.width = halfPct.toFixed(2) + "%";
          fill.classList.add("pos-eval-opp-adv");
          fill.classList.remove("pos-eval-black-adv");
        }
      }

      /**
       * Convert engine score (side-to-move POV) to white POV.
       */
      function scoreToWhitePov(score, fen) {
        if (!score) return null;
        var turn = "w";
        if (fen) {
          var parts = String(fen).split(/\s+/);
          if (parts[1] === "b" || parts[1] === "w") turn = parts[1];
        }
        if (turn === "w") return { type: score.type, value: score.value };
        return { type: score.type, value: -(score.value | 0) };
      }

      function schedulePositionEval() {
        if (!isPosEvalOn()) return;
        if (typeof isSetupPhase === "function" && isSetupPhase()) {
          resetPosEvalDisplay();
          return;
        }
        setPosEvalVisible(true);
        if (typeof BoardHackStockfish === "undefined" || !BoardHackStockfish.analyzePosition) {
          return;
        }
        var fen = game && game.fen ? game.fen() : null;
        if (!fen) return;
        var myGen = ++peGen;
        BoardHackStockfish.analyzePosition(fen, 12)
          .then(function (info) {
            if (myGen !== peGen || !isPosEvalOn()) return;
            var whiteScore = scoreToWhitePov(info && info.score, fen);
            applyPosEvalScore(whiteScore);
          })
          .catch(function (err) {
            if (err && err.message === "cancelled") return;
            if (myGen !== peGen) return;
            console.warn("Position eval failed:", err && err.message ? err.message : err);
          });
      }

      function isSetupPhase() {
        return gamePhase === "setup";
      }

      function isPlayPhase() {
        return gamePhase === "play";
      }

      function boardPosToPlacementFen(pos, turn) {
        var files = "abcdefgh";
        var ranks = [];
        for (var r = 8; r >= 1; r--) {
          var empty = 0;
          var row = "";
          for (var f = 0; f < 8; f++) {
            var sq = files[f] + r;
            var p = pos && pos[sq];
            if (!p) {
              empty++;
            } else {
              if (empty) { row += String(empty); empty = 0; }
              var color = p.charAt(0);
              var type = p.charAt(1);
              var ch = type.toLowerCase();
              row += color === "w" ? type.toUpperCase() : ch;
            }
          }
          if (empty) row += String(empty);
          ranks.push(row);
        }
        var t = turn === "b" ? "b" : "w";
        return ranks.join("/") + " " + t + " - - 0 1";
      }

      function buildSetupFen() {
        var pos = board ? board.position() : EMPTY_POSITION;
        return boardPosToPlacementFen(pos, setupTurn);
      }

      function countKings(pos) {
        var wk = 0, bk = 0;
        if (!pos) return { wk: 0, bk: 0 };
        Object.keys(pos).forEach(function (sq) {
          var p = pos[sq];
          if (p === "wK") wk++;
          if (p === "bK") bk++;
        });
        return { wk: wk, bk: bk };
      }

      function validateSetup(opts) {
        opts = opts || {};
        var pos = board ? board.position() : EMPTY_POSITION;
        var kings = countKings(pos);
        var fen = boardPosToPlacementFen(pos, setupTurn);
        var result = {
          ok: false,
          fen: fen,
          needKings: kings.wk !== 1 || kings.bk !== 1,
          warnMate: false,
          warnCheck: false,
          invalid: false,
          msg: ""
        };
        if (result.needKings) {
          result.msg = t("setupNeedKings");
          return result;
        }
        var probe = new Chess();
        var loaded = probe.load(fen);
        if (!loaded) {
          // try opposite turn (side not to move in check)
          var altTurn = setupTurn === "w" ? "b" : "w";
          var altFen = boardPosToPlacementFen(pos, altTurn);
          if (probe.load(altFen)) {
            result.invalid = true;
            result.msg = t("setupInvalid");
            result.fen = fen;
            return result;
          }
          result.invalid = true;
          result.msg = t("setupInvalid");
          return result;
        }
        result.ok = true;
        if (probe.in_checkmate()) {
          result.warnMate = true;
          result.msg = t("setupWarnMate");
        } else if (probe.in_check()) {
          result.warnCheck = true;
          result.msg = t("setupWarnCheck");
        }
        return result;
      }

      function updateSetupWarn() {
        if (!isSetupPhase()) return;
        var v = validateSetup();
        // Setup feedback belongs in the single status bar above the board.
        setStatus(v.msg || t("setupPhaseStatus"), v.msg ? "warn" : "info");
        return v;
      }

      function renderPiecePalette() {
        var $pal = $("#piecePalette");
        if (!$pal.length) return;
        var kings = countKings(board ? board.position() : EMPTY_POSITION);
        // Once a king is present, keep its palette button unavailable until
        // that king is removed with the eraser (or by clicking the piece).
        if ((kings.wk > 0 && setupPalettePiece === "wK") ||
            (kings.bk > 0 && setupPalettePiece === "bK")) {
          setupPalettePiece = null;
        }
        $pal.empty();
        PALETTE_ORDER.forEach(function (code) {
          var kingAlreadyPlaced = code === "wK" ? kings.wk > 0 : code === "bK" ? kings.bk > 0 : false;
          var url = PIECE_THEME.replace("{piece}", code);
          var $btn = $('<button type="button" class="palette-piece" role="option"></button>')
            .attr("data-piece", code)
            .attr("aria-label", code)
            .prop("disabled", kingAlreadyPlaced)
            .attr("aria-disabled", kingAlreadyPlaced ? "true" : "false")
            .toggleClass("active", setupPalettePiece === code)
            .append($("<img>").attr("src", url).attr("alt", code));
          $pal.append($btn);
        });
        var $erase = $('<button type="button" class="palette-piece palette-eraser" role="option"></button>')
          .attr("data-piece", "")
          .attr("aria-label", t("setupPaletteEraser"))
          .toggleClass("active", setupPalettePiece === "")
          .text("✕");
        $pal.append($erase);
      }

      function setPalettePiece(code) {
        var pos = board ? board.position() || {} : {};
        var kings = countKings(pos);
        if ((code === "wK" && kings.wk > 0) || (code === "bK" && kings.bk > 0)) {
          return;
        }
        if (setupPalettePiece === code) setupPalettePiece = null;
        else setupPalettePiece = code;
        renderPiecePalette();
      }

      function applySetupPosition(pos, animate) {
        if (!board) return;
        board.position(pos || {}, !!animate);
        renderPiecePalette();
        updateSetupWarn();
      }

      function clearSetupBoard() {
        applySetupPosition(EMPTY_POSITION, false);
        publishSetupSync();
      }

      function standardSetupBoard() {
        applySetupPosition(START_POSITION, false);
        setupTurn = "w";
        $("#setupTurnSelect").val("w");
        publishSetupSync();
      }

      function handleSetupSquareClick(square) {
        if (!isSetupPhase() || !board) return;
        if (isMultiplayer() && isSpectating()) return;
        if (isMultiplayer() && !canMpAct()) return;
        var pos = board.position() || {};
        var cur = pos[square];
        if (setupPalettePiece === null) {
          // no palette: click piece to remove
          if (cur) {
            delete pos[square];
            applySetupPosition(pos, false);
            publishSetupSync();
          }
          return;
        }
        if (setupPalettePiece === "") {
          if (cur) {
            delete pos[square];
            applySetupPosition(pos, false);
            publishSetupSync();
          }
          return;
        }
        if (cur === setupPalettePiece) {
          delete pos[square];
        } else {
          // Never place a second king of either color; use the eraser to move it.
          var kings = countKings(pos);
          if ((setupPalettePiece === "wK" && kings.wk > 0) ||
              (setupPalettePiece === "bK" && kings.bk > 0)) {
            return;
          }
          pos[square] = setupPalettePiece;
        }
        applySetupPosition(pos, false);
        publishSetupSync();
      }

      function enterSetupPhase(opts) {
        opts = opts || {};
        cancelScheduledBot();
        gamePhase = "setup";
        setupReadyLocal = false;
        setupReadyRemote = { w: false, b: false };
        setupPalettePiece = null;
        mqGen += 1;
        mqLast = null;
        clearMoveQualityBadge();
        if (typeof peGen !== "undefined") peGen += 1;
        if (typeof isPosEvalOn === "function" && isPosEvalOn()) {
          setPosEvalVisible(true);
          resetPosEvalDisplay();
        } else if (typeof hidePosEval === "function") {
          hidePosEval();
        }
        gameOver = false;
        botThinking = false;
        undoStack = [];
        plySans = [];
        clearSelection();
        clearDiceState();
        $thinking.removeClass("show");
        $("#setupPanel").removeClass("mp-hidden").show();
        $("#undoBtn").prop("disabled", true);
        $("#newGameBtn").text(t("newGame"));
        renderPiecePalette();
        if (!opts.keepPosition) {
          if (opts.standard) applySetupPosition(START_POSITION, false);
          else applySetupPosition(EMPTY_POSITION, false);
          setupTurn = "w";
          $("#setupTurnSelect").val("w");
        } else {
          updateSetupWarn();
        }
        if (board) board.orientation(boardOrientation());
        updateSetupMpUI();
        updateMoveList();
        updateStatus();
        applyStaticLang();
      }

      function beginPlayFromSetup(fenOverride) {
        var v = fenOverride ? { ok: true, fen: fenOverride, msg: "" } : validateSetup();
        if (!v.ok && !fenOverride) {
          updateSetupWarn();
          setStatus(v.msg || t("setupNeedKings"), "warn");
          return false;
        }
        var fen = v.fen || fenOverride;
        if (!game.load(fen)) {
          setStatus(t("setupInvalid"), "warn");
          return false;
        }
        gamePhase = "play";
        setupReadyLocal = false;
        setupReadyRemote = { w: false, b: false };
        undoStack = [];
        plySans = [];
        gameOver = false;
        botThinking = false;
        clearSelection();
        clearDiceState();
        $thinking.removeClass("show");
        $("#setupPanel").hide();
        $("#undoBtn").prop("disabled", false);
        if (board) {
          board.orientation(boardOrientation());
          board.position(game.fen(), false);
        }
        updateMoveList();
        updateStatus();
        applyStaticLang();
        if (typeof isPosEvalOn === "function" && isPosEvalOn()) {
          setPosEvalVisible(true);
          schedulePositionEval();
        }
        if (isMultiplayer()) {
          cancelScheduledBot();
          return true;
        }
        if (userColor === "b" && game.turn() === "w") {
          scheduleBot(250);
        } else if (game.turn() !== userColor) {
          scheduleBot(250);
        } else {
          updateStatus();
        }
        return true;
      }

      function tryStartLocalGame() {
        if (isMultiplayer()) return;
        var v = validateSetup();
        if (v.warnMate && v.ok) {
          // allow with warning already shown
        }
        beginPlayFromSetup();
      }

      function updateSetupMpUI() {
        var $actions = $("#setupMpActions");
        var $hint = $("#setupMpHint");
        var $host = $("#setupHostStartBtn");
        var $ready = $("#setupReadyBtn");
        if (!isSetupPhase()) {
          $actions.addClass("mp-hidden");
          $hint.addClass("mp-hidden");
          return;
        }
        if (!isMultiplayer() || isSpectating()) {
          $actions.addClass("mp-hidden");
          $hint.toggleClass("mp-hidden", !isMultiplayer());
          $("#setupStartBtn").toggleClass("mp-hidden", isMultiplayer());
          return;
        }
        $("#setupStartBtn").addClass("mp-hidden");
        $actions.removeClass("mp-hidden");
        $hint.removeClass("mp-hidden");
        $ready.text(setupReadyLocal ? t("setupReadyDone") : t("setupReady"));
        var isHost = mpRoom && mpRoom.hostId === getOrCreateClientId();
        $host.toggleClass("mp-hidden", !isHost);
        var other = mpSeat === "w" ? "b" : "w";
        if (setupReadyLocal && setupReadyRemote[other]) {
          $hint.text(t("setupWaitingReady"));
        } else {
          $hint.text(t("setupMpHint"));
        }
      }

      function publishSetupSync() {
        updateSetupWarn();
        if (!isMultiplayer() || !canMpAct() || !mpSocket || !isSetupPhase()) return;
        if (setupSyncTimer) clearTimeout(setupSyncTimer);
        setupSyncTimer = setTimeout(function () {
          mpSocket.emit("updateSetup", {
            clientId: getOrCreateClientId(),
            code: mpRoomCode,
            fen: buildSetupFen(),
            phase: "setup",
            setupTurn: setupTurn,
            ready: setupReadyLocal
          });
        }, 80);
      }

      function publishReadyToggle() {
        if (!isMultiplayer() || !canMpAct() || !mpSocket || !isSetupPhase()) return;
        setupReadyLocal = !setupReadyLocal;
        updateSetupMpUI();
        mpSocket.emit("updateSetup", {
          clientId: getOrCreateClientId(),
          code: mpRoomCode,
          fen: buildSetupFen(),
          phase: "setup",
          setupTurn: setupTurn,
          ready: setupReadyLocal
        });
        // if both ready, server will start; also try local optimistic check
      }

      function publishHostStart() {
        if (!isMultiplayer() || !canMpAct() || !mpSocket || !isSetupPhase()) return;
        var v = validateSetup();
        if (!v.ok) {
          updateSetupWarn();
          setStatus(v.msg || t("setupNeedKings"), "warn");
          return;
        }
        mpSocket.emit("startCustomGame", {
          clientId: getOrCreateClientId(),
          code: mpRoomCode,
          fen: v.fen,
          force: true
        });
      }

      function applySetupFromRoom(room) {
        if (!room) return;
        if (room.phase === "play") {
          // Transition into play once; ongoing moves use moveApplied / syncBoardFromMpRoom
          if (gamePhase !== "play") {
            beginPlayFromSetup(room.fen);
          }
          return;
        }
        // setup phase
        gamePhase = "setup";
        $("#setupPanel").show();
        if (room.fen) {
          var parts = String(room.fen).split(" ");
          if (parts[1] === "w" || parts[1] === "b") {
            setupTurn = parts[1];
            $("#setupTurnSelect").val(setupTurn);
          }
          // load position onto board without chess.js if kings missing
          var probe = new Chess();
          if (probe.load(room.fen)) {
            applySetupPosition(probe.fen(), false);
          } else {
            // parse placement manually via temporary board load of piece placement only
            try {
              var sparse = parts[0];
              var map = {};
              var files = "abcdefgh";
              var rank = 8, file = 0;
              for (var i = 0; i < sparse.length; i++) {
                var c = sparse.charAt(i);
                if (c === "/") { rank--; file = 0; continue; }
                if (/[1-8]/.test(c)) { file += parseInt(c, 10); continue; }
                var color = c === c.toUpperCase() ? "w" : "b";
                var type = c.toUpperCase();
                map[files[file] + rank] = color + type;
                file++;
              }
              applySetupPosition(map, false);
            } catch (e) {
              applySetupPosition(EMPTY_POSITION, false);
            }
          }
        }
        if (room.setupReady) {
          setupReadyRemote = {
            w: !!room.setupReady.w,
            b: !!room.setupReady.b
          };
          if (mpSeat && room.setupReady[mpSeat] != null) {
            setupReadyLocal = !!room.setupReady[mpSeat];
          }
        }
        updateSetupMpUI();
        updateSetupWarn();
        updateStatus();
      }

      function isDiceMode() {
        return gameMode === "dice";
      }

      function saveModeSettings() {
        try {
          localStorage.setItem(MODE_KEY, gameMode);
          localStorage.setItem(DICE_COUNT_KEY, String(diceCount));
        } catch (e) {}
      }

      function syncModeSelects() {
        if ($("#modeSelect").length) $("#modeSelect").val(gameMode);
        if ($("#diceCount").length) $("#diceCount").val(String(diceCount));
        if (isDiceMode()) {
          $("#diceCountWrap").removeClass("hidden");
          $("#dicePanel").addClass("visible");
        } else {
          $("#diceCountWrap").addClass("hidden");
          $("#dicePanel").removeClass("visible");
        }
      }

      function pieceName(type) {
        return t(PIECE_I18N[type] || "diceNone");
      }

      function cloneDiceList(list) {
        var out = [];
        for (var i = 0; i < list.length; i++) {
          out.push({
            value: list[i].value,
            type: list[i].type,
            status: list[i].status
          });
        }
        return out;
      }

      function clearDiceState() {
        diceRoll = [];
        remainingDice = [];
        diceSide = null;
        lastSkipMsg = "";
        consecutiveSkipPasses = 0;
        updateDiceUI();
      }

      function remainingTypesList() {
        var names = [];
        for (var i = 0; i < remainingDice.length; i++) {
          names.push(pieceName(remainingDice[i].type));
        }
        return names;
      }

      function updateDiceUI() {
        syncModeSelects();
        if (!isDiceMode()) {
          $("#diceFaces").empty();
          $("#diceAllowedHint").text("");
          return;
        }
        var html = "";
        var colorChar = diceSide || game.turn() || "w";
        for (var i = 0; i < diceRoll.length; i++) {
          var d = diceRoll[i];
          var cls = "die";
          if (d.status === "used") cls += " used";
          if (d.status === "skipped") cls += " skipped";
          var pieceCode = colorChar + d.type.toUpperCase();
          var imgSrc = PIECE_THEME.replace("{piece}", pieceCode);
          html +=
            '<div class="' + cls + '" title="' + pieceName(d.type) + '">' +
            '<img class="die-piece-img" src="' + imgSrc + '" alt="' + pieceName(d.type) + '" />' +
            "</div>";
        }
        $("#diceFaces").html(html);
        var hint = "";
        if (lastSkipMsg) hint = lastSkipMsg;
        if (remainingDice.length) {
          var rem = t("diceRemaining").replace("{pieces}", remainingTypesList().join(", "));
          hint = hint ? hint + " · " + rem : rem;
        } else if (diceRoll.length) {
          hint = hint ? hint + " · " + t("diceDone") : t("diceDone");
        } else {
          hint = hint || t("diceNone");
        }
        $("#diceAllowedHint").text(hint);
      }

      /** True only if chess.js reports a real legal move for this piece type. */
      function hasLegalForType(pieceType) {
        var all = game.moves({ verbose: true });
        for (var i = 0; i < all.length; i++) {
          if (all[i].piece === pieceType) return true;
        }
        return false;
      }

      function countKingsOnBoard() {
        var boardState = game.board();
        var w = 0;
        var b = 0;
        for (var r = 0; r < 8; r++) {
          for (var c = 0; c < 8; c++) {
            var p = boardState[r][c];
            if (!p || p.type !== "k") continue;
            if (p.color === "w") w++;
            else b++;
          }
        }
        return { w: w, b: b };
      }

      /**
       * After every ply: king missing, checkmate, stalemate, or other game_over.
       * Clears dice multi-move state. Returns true if play must stop.
       */
      function applyGameEndFromPosition() {
        var kings = countKingsOnBoard();
        if (kings.w < 1 || kings.b < 1) {
          gameOver = true;
          remainingDice = [];
          diceSide = null;
          var winnerColor = kings.w < 1 ? "b" : "w";
          var loserLabel = isMultiplayer() ? t("winnerOpp") : t("winnerBot");
          var winner = winnerColor === userColor ? t("winnerYou") : loserLabel;
          setStatus(t("kingCaptureWin").replace("{winner}", winner), "danger");
          $turnLabel.text(t("turnOver"));
          updateDiceUI();
          return true;
        }

        if (game.in_checkmate()) {
          gameOver = true;
          remainingDice = [];
          diceSide = null;
          var loserLabel = isMultiplayer() ? t("winnerOpp") : t("winnerBot");
          var wMate = game.turn() === userColor ? loserLabel : t("winnerYou");
          setStatus(t("checkmateWin").replace("{winner}", wMate), "danger");
          $turnLabel.text(t("turnOver"));
          updateDiceUI();
          return true;
        }

        if (game.in_stalemate()) {
          gameOver = true;
          remainingDice = [];
          diceSide = null;
          setStatus(t("stalemate"), "warn");
          $turnLabel.text(t("turnDraw"));
          updateDiceUI();
          return true;
        }

        if (game.in_threefold_repetition()) {
          gameOver = true;
          remainingDice = [];
          diceSide = null;
          setStatus(t("drawRepetition"), "warn");
          $turnLabel.text(t("turnDraw"));
          updateDiceUI();
          return true;
        }

        if (game.insufficient_material()) {
          gameOver = true;
          remainingDice = [];
          diceSide = null;
          setStatus(t("drawMaterial"), "warn");
          $turnLabel.text(t("turnDraw"));
          updateDiceUI();
          return true;
        }

        if (game.in_draw() || game.game_over()) {
          gameOver = true;
          remainingDice = [];
          diceSide = null;
          setStatus(t("draw"), "warn");
          $turnLabel.text(t("turnDraw"));
          updateDiceUI();
          return true;
        }

        return false;
      }

      function getDiceFilteredMoves() {
        if (!isDiceMode()) return game.moves({ verbose: true });
        if (!remainingDice.length) return [];
        var set = {};
        for (var i = 0; i < remainingDice.length; i++) set[remainingDice[i].type] = true;
        var all = game.moves({ verbose: true });
        var out = [];
        for (var j = 0; j < all.length; j++) {
          if (set[all[j].piece]) out.push(all[j]);
        }
        return out;
      }

      function dieTypeRemaining(pieceType) {
        for (var i = 0; i < remainingDice.length; i++) {
          if (remainingDice[i].type === pieceType) return true;
        }
        return false;
      }

      /** May select/move this type only if it remains on dice AND has a legal move now. */
      function pieceAllowedByDice(pieceType) {
        if (!isDiceMode()) return true;
        return dieTypeRemaining(pieceType) && hasLegalForType(pieceType);
      }

      /** Force active color in FEN (for multi-move dice turns). Returns success. */
      function setSideToMove(color) {
        var parts = game.fen().split(" ");
        if (parts.length < 6) return false;
        var prev = parts[1];
        if (prev === color) return true;
        parts[1] = color;
        // chess.js increments fullmove when Black moves → White; undo that if restoring Black
        if (color === "b" && prev === "w") {
          var fm = parseInt(parts[5], 10) || 1;
          if (fm > 1) parts[5] = String(fm - 1);
        }
        var newFen = parts.join(" ");
        if (game.load(newFen)) return true;

        // chess.js rejects FEN when the side not to move is in check (common mid dice-turn).
        // Temporarily remove opponent king, load turn, put king back.
        var opp = color === "w" ? "b" : "w";
        var boardState = game.board();
        var files = "abcdefgh";
        var kingSq = null;
        var kingPiece = null;
        for (var r = 0; r < 8; r++) {
          for (var c = 0; c < 8; c++) {
            var p = boardState[r][c];
            if (p && p.type === "k" && p.color === opp) {
              kingSq = files[c] + (8 - r);
              kingPiece = { type: p.type, color: p.color };
            }
          }
        }
        if (!kingSq || !kingPiece) return false;
        game.remove(kingSq);
        var mid = game.fen().split(" ");
        mid[1] = color;
        mid[2] = parts[2];
        mid[3] = "-";
        mid[4] = parts[4];
        mid[5] = parts[5];
        var ok = game.load(mid.join(" "));
        if (ok) {
          game.put(kingPiece, kingSq);
          return game.turn() === color;
        }
        game.put(kingPiece, kingSq);
        return false;
      }

      /** Who is mid dice-turn (source of truth over chess.js turn while dice remain). */
      function isHumanDiceTurnActive() {
        return (
          isDiceMode() &&
          !gameOver &&
          diceSide === userColor &&
          remainingDice.length > 0
        );
      }

      function isBotDiceTurnActive() {
        return (
          isDiceMode() &&
          !gameOver &&
          diceSide &&
          diceSide !== userColor &&
          remainingDice.length > 0
        );
      }

      function botColor() {
        return userColor === "w" ? "b" : "w";
      }

      function userHasRemainingDice() {
        return isDiceMode() && diceSide === userColor && remainingDice.length > 0;
      }

      function cancelScheduledBot() {
        if (botTimerId != null) {
          clearTimeout(botTimerId);
          botTimerId = null;
        }
        botSchedGen += 1;
        if (typeof BoardHackStockfish !== "undefined") {
          BoardHackStockfish.cancelSearch();
        }
      }

      /** Sole entry to queue a bot turn; invalidates any prior timer. */
      function scheduleBot(delayMs) {
        if (isMultiplayer() || isSetupPhase()) {
          cancelScheduledBot();
          return;
        }
        cancelScheduledBot();
        var gen = botSchedGen;
        botTimerId = window.setTimeout(function () {
          botTimerId = null;
          if (gen !== botSchedGen) return;
          makeBotMove();
        }, delayMs == null ? 250 : delayMs);
      }

      /**
       * Hard gate before starting (or continuing into) bot play.
       * alreadyThinking: true inside an in-progress botPly chain.
       */
      function canBotActNow(alreadyThinking) {
        if (isMultiplayer() || isSetupPhase()) return false;
        if (gameOver) return false;
        if (!alreadyThinking && botThinking) return false;
        if (!alreadyThinking && selectedSquare) return false;
        if (isDiceMode()) {
          // Never while user still has unresolved dice
          if (userHasRemainingDice() || isHumanDiceTurnActive()) return false;
          if (diceSide === userColor) return false;
        }
        // Must be bot's side to move (classic + dice)
        if (game.turn() !== botColor()) return false;
        return true;
      }

      /** Pass the turn with no move (all dice skipped). */
      function passTurnNoMove() {
        var parts = game.fen().split(" ");
        if (parts.length < 6) return;
        var was = parts[1];
        parts[1] = was === "w" ? "b" : "w";
        parts[3] = "-";
        if (was === "b") {
          parts[5] = String((parseInt(parts[5], 10) || 1) + 1);
        }
        game.load(parts.join(" "));
      }

      function markRollStatus(value, type, status) {
        for (var i = 0; i < diceRoll.length; i++) {
          if (
            diceRoll[i].status === "pending" &&
            diceRoll[i].value === value &&
            diceRoll[i].type === type
          ) {
            diceRoll[i].status = status;
            return;
          }
        }
        // fallback: first pending of same type
        for (var j = 0; j < diceRoll.length; j++) {
          if (diceRoll[j].status === "pending" && diceRoll[j].type === type) {
            diceRoll[j].status = status;
            return;
          }
        }
      }

      function consumeDie(pieceType) {
        for (var i = 0; i < remainingDice.length; i++) {
          if (remainingDice[i].type === pieceType) {
            var die = remainingDice.splice(i, 1)[0];
            markRollStatus(die.value, die.type, "used");
            consecutiveSkipPasses = 0;
            return true;
          }
        }
        return false;
      }

      /**
       * Pass only when NO remaining die type has a legal move right now.
       * Keep blocked types while at least one remaining type is playable
       * (e.g. pawn move may later free a bishop).
       * Returns true when this side's dice turn is over.
       */
      function endTurnIfNoPlayableDice(side) {
        if (!isDiceMode()) return true;

        if (remainingDice.length > 0 && getDiceFilteredMoves().length > 0) {
          // Some type is playable now — keep all remaining dice (including blocked)
          updateDiceUI();
          return false;
        }

        // Nothing playable among remaining (or no dice left) → skip leftovers and pass
        if (remainingDice.length > 0) {
          var names = [];
          for (var i = 0; i < remainingDice.length; i++) {
            names.push(pieceName(remainingDice[i].type));
            markRollStatus(remainingDice[i].value, remainingDice[i].type, "skipped");
          }
          lastSkipMsg = t("diceSkip").replace("{piece}", names.join(", "));
          remainingDice = [];
        }

        if (side && game.turn() === side) {
          passTurnNoMove();
        }
        diceSide = null;
        updateDiceUI();
        return true;
      }

      function rollDiceForSide(side) {
        lastSkipMsg = "";
        if (!isDiceMode() || game.game_over()) {
          clearDiceState();
          return;
        }
        diceSide = side;
        diceRoll = [];
        remainingDice = [];
        for (var i = 0; i < diceCount; i++) {
          var roll = 1 + Math.floor(Math.random() * 6);
          var pt = DICE_MAP[roll];
          var entry = { value: roll, type: pt, status: "pending" };
          diceRoll.push(entry);
          remainingDice.push({ value: roll, type: pt });
        }
        // Keep all dice on roll — even types with no legal move yet
        updateDiceUI();
      }

      function diceTurnComplete() {
        return !isDiceMode() || remainingDice.length === 0;
      }

      function setStatus(text, kind) {
        $statusText.text(text);
        $statusDot.removeClass("warn danger info");
        if (kind) $statusDot.addClass(kind);
      }

      function removeLegalHighlights() {
        $("#board .square-55d63").removeClass("legal-dot legal-capture");
      }

      var audioCtx = null;

      function getAudioCtx() {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") {
          try { audioCtx.resume(); } catch (e) {}
        }
        return audioCtx;
      }

      // Short wood-like thud: low thump + brief noise layer
      function playMoveSound() {
        try {
          var ctx = getAudioCtx();
          if (!ctx) return;
          var t0 = ctx.currentTime;
          var dur = 0.12;

          // Low wooden thump
          var osc = ctx.createOscillator();
          var oscGain = ctx.createGain();
          var oscFilter = ctx.createBiquadFilter();
          osc.type = "sine";
          osc.frequency.setValueAtTime(95, t0);
          osc.frequency.exponentialRampToValueAtTime(38, t0 + dur);
          oscFilter.type = "lowpass";
          oscFilter.frequency.setValueAtTime(280, t0);
          oscGain.gain.setValueAtTime(0.0001, t0);
          oscGain.gain.exponentialRampToValueAtTime(0.38, t0 + 0.006);
          oscGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(oscFilter);
          oscFilter.connect(oscGain);
          oscGain.connect(ctx.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.02);

          // Soft noise "wood contact" layer
          var nLen = Math.floor(ctx.sampleRate * 0.06);
          var buffer = ctx.createBuffer(1, nLen, ctx.sampleRate);
          var data = buffer.getChannelData(0);
          for (var i = 0; i < nLen; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nLen, 2.2);
          }
          var noise = ctx.createBufferSource();
          noise.buffer = buffer;
          var noiseFilter = ctx.createBiquadFilter();
          noiseFilter.type = "bandpass";
          noiseFilter.frequency.setValueAtTime(420, t0);
          noiseFilter.Q.setValueAtTime(0.9, t0);
          var noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.0001, t0);
          noiseGain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.004);
          noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.07);
          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(ctx.destination);
          noise.start(t0);
          noise.stop(t0 + 0.08);
        } catch (e) {}
      }

      function snapshotPush() {
        undoStack.push({
          fen: game.fen(),
          sans: plySans.slice(),
          diceRoll: cloneDiceList(diceRoll),
          remainingDice: cloneDiceList(remainingDice),
          diceSide: diceSide,
          lastSkipMsg: lastSkipMsg
        });
      }

      function restoreSnapshot(s) {
        game.load(s.fen);
        plySans = s.sans.slice();
        diceRoll = s.diceRoll ? cloneDiceList(s.diceRoll) : [];
        remainingDice = s.remainingDice ? cloneDiceList(s.remainingDice) : [];
        diceSide = s.diceSide != null ? s.diceSide : null;
        lastSkipMsg = s.lastSkipMsg || "";
      }

      // Standard chess.js move (includes O-O / O-O-O); castling needs king on dice
      // Returns the verbose move object on success, or false.
      function tryMakeUserMove(from, to) {
        var piece = game.get(from);
        if (piece && !pieceAllowedByDice(piece.type)) return false;
        snapshotPush();
        var move = game.move({ from: from, to: to, promotion: "q" });
        if (move === null) {
          undoStack.pop();
          return false;
        }
        if (isDiceMode() && !dieTypeRemaining(move.piece)) {
          game.undo();
          undoStack.pop();
          return false;
        }
        plySans.push(move.san);
        playMoveSound();
        if (isDiceMode()) {
          consumeDie(move.piece);
        }
        return move;
      }

      /**
       * After a successful user ply in dice mode: keep multi-moving or hand off to bot.
       * Returns true if the player's dice turn is finished (bot should play).
       */
      function afterUserDicePly() {
        // Always evaluate end first (classic + dice), before any multi-move restore
        if (applyGameEndFromPosition()) return true;
        if (!isDiceMode()) return true;

        if (remainingDice.length > 0) {
          diceSide = userColor;
          setSideToMove(userColor);
          // Pass only when none of the remaining types are playable right now
          if (endTurnIfNoPlayableDice(userColor)) return true;
          // Still human's dice turn — kill any pending bot kickoff
          cancelScheduledBot();
          updateDiceUI();
          return false;
        }
        diceSide = null;
        updateDiceUI();
        return true;
      }

      function beginDiceTurnFor(side) {
        if (!isDiceMode()) {
          clearDiceState();
          return true; // ready to move (classic: single move)
        }
        if (game.turn() !== side) {
          setSideToMove(side);
        }
        rollDiceForSide(side);
        // If no remaining type has a legal move, pass turn immediately
        if (endTurnIfNoPlayableDice(side)) {
          consecutiveSkipPasses++;
          return false;
        }
        consecutiveSkipPasses = 0;
        return true;
      }

      function showLegalMoves(fromSquare) {
        removeLegalHighlights();
        if (!fromSquare) return;
        var piece = game.get(fromSquare);
        if (piece && !pieceAllowedByDice(piece.type)) return;
        var moves = game.moves({ square: fromSquare, verbose: true });
        for (var i = 0; i < moves.length; i++) {
          var m = moves[i];
          if (!pieceAllowedByDice(m.piece)) continue;
          var $sq = $("#board .square-" + m.to);
          if (m.captured) {
            $sq.addClass("legal-capture");
          } else {
            $sq.addClass("legal-dot");
          }
        }
      }

      function clearSelection() {
        $("#board .square-55d63").removeClass("selected");
        removeLegalHighlights();
        selectedSquare = null;
      }

      function highlightSquare(sq) {
        clearSelection();
        if (!sq) return;
        selectedSquare = sq;
        $("#board .square-" + sq).addClass("selected");
        showLegalMoves(sq);
      }

      function findBestMoveStockfish(done) {
        var legal = getDiceFilteredMoves();
        if (!legal.length) {
          done(null);
          return;
        }
        var fen = game.fen();
        var searchUci = null;
        if (isDiceMode()) {
          searchUci = [];
          for (var i = 0; i < legal.length; i++) {
            searchUci.push(BoardHackStockfish.moveToUci(legal[i]));
          }
        }
        var genAtStart = botSchedGen;
        BoardHackStockfish.getBestMove(fen, searchUci, getSkillKey())
          .then(function (uci) {
            if (genAtStart !== botSchedGen) {
              done(null);
              return;
            }
            var parsed = BoardHackStockfish.parseUci(uci);
            if (!parsed) {
              done(legal[0] || null);
              return;
            }
            for (var j = 0; j < legal.length; j++) {
              var m = legal[j];
              if (m.from === parsed.from && m.to === parsed.to) {
                if (!parsed.promotion || m.promotion === parsed.promotion) {
                  done(m);
                  return;
                }
              }
            }
            // Fallback: try chess.js apply
            var tryMove = { from: parsed.from, to: parsed.to };
            if (parsed.promotion) tryMove.promotion = parsed.promotion;
            done(tryMove);
          })
          .catch(function (err) {
            if (genAtStart !== botSchedGen) {
              done(null);
              return;
            }
            if (err && err.message === "cancelled") {
              done(null);
              return;
            }
            console.warn("Stockfish search failed:", err && err.message ? err.message : err);
            done(legal[0] || null);
          });
      }

      function updateMoveList() {
        var history = plySans;
        $moveCount.text(String(history.length));
        if (!history.length) {
          $moveList.html('<div class="empty-moves"></div>');
          $moveList.find(".empty-moves").text(t("emptyMoves"));
          return;
        }
        var html = "";
        for (var i = 0; i < history.length; i += 2) {
          var num = Math.floor(i / 2) + 1;
          var white = history[i] ? history[i] : "";
          var black = history[i + 1] ? history[i + 1] : "";
          var wCls = "move-san" + (userColor === "b" ? " bot" : "");
          var bCls = "move-san" + (userColor === "w" ? " bot" : "");
          if (mqLast && isMoveAnalysisOn() && mqLast.sanIndex === i && mqLast.kind) {
            wCls += " mq-annot mq-" + mqLast.kind;
          }
          if (mqLast && isMoveAnalysisOn() && mqLast.sanIndex === i + 1 && mqLast.kind) {
            bCls += " mq-annot mq-" + mqLast.kind;
          }
          html +=
            '<div class="move-row">' +
            '<span class="move-num">' + num + ".</span>" +
            '<span class="' + wCls + '">' + white + "</span>" +
            '<span class="' + bCls + '">' + black + "</span>" +
            "</div>";
        }
        $moveList.html(html);
        $moveList.scrollTop($moveList[0].scrollHeight);
      }

      function updateStatus() {
        updateOpponentLabel();
        $("#sideLabel").text(userColor === "w" ? t("sideWhite") : t("sideBlack"));

        if (isSetupPhase()) {
          $turnLabel.text("—");
          updateSetupWarn();
          updateSetupMpUI();
          return;
        }

        if (applyGameEndFromPosition()) return;

        // During multi-move dice, diceSide + remainingDice own the turn UI
        var turnIsUser;
        if (isHumanDiceTurnActive()) {
          turnIsUser = true;
        } else if (isBotDiceTurnActive() || botThinking) {
          turnIsUser = false;
        } else {
          turnIsUser = game.turn() === userColor;
        }

        if (isMultiplayer()) {
          updateOpponentLabel();
          if (!mpBothSeated()) {
            $turnLabel.text("—");
            setStatus(t("mpWaiting"), "info");
            return;
          }
          if (!mpOpponentConnected()) {
            setStatus(t("mpOpponentGone"), "warn");
          }
          if (turnIsUser) {
            $turnLabel.text(t("turnYou"));
            if (game.in_check() && game.turn() === userColor) {
              setStatus(t("checkYou"), "warn");
            } else {
              setStatus(t("mpYourTurn"), null);
            }
          } else {
            $turnLabel.text(t("turnOpponent"));
            setStatus(t("mpOppTurn"), "info");
          }
          return;
        }

        if (turnIsUser) {
          $turnLabel.text(t("turnYou"));
          if (game.in_check() && game.turn() === userColor) {
            setStatus(t("checkYou"), "warn");
          } else {
            setStatus(isDiceMode() ? t("yourMoveDice") : t("yourMove"), null);
          }
        } else {
          $turnLabel.text(t("turnBot"));
          if (game.in_check() && game.turn() !== userColor) {
            setStatus(t("botInCheck"), "info");
          } else {
            setStatus(isDiceMode() ? t("botThinkingDice") : t("botThinking"), "info");
          }
        }
      }

      function finishBotThinking() {
        botThinking = false;
        $thinking.removeClass("show");
        $("#undoBtn").prop("disabled", false);
        clearSelection();
        updateMoveList();
        updateStatus();
      }

      function startUserTurnAfterBot() {
        finishBotThinking();
        cancelScheduledBot();
        if (gameOver || applyGameEndFromPosition()) {
          return;
        }
        if (game.turn() !== userColor) {
          setSideToMove(userColor);
        }
        if (game.turn() !== userColor) {
          // Still not user's turn — only resume bot if it truly is bot to move
          if (canBotActNow(false)) scheduleBot(80);
          return;
        }
        var canMove = beginDiceTurnFor(userColor);
        updateStatus();
        if (!canMove) {
          // all user dice unplayable — pass already done; bot's turn
          if (canBotActNow(false)) scheduleBot(200);
        }
      }

      function makeBotMove() {
        if (gameOver || applyGameEndFromPosition()) return;
        if (botThinking) return;

        // Absolute refusals: user dice left, user to move, mid-selection
        if (userHasRemainingDice() || isHumanDiceTurnActive()) {
          cancelScheduledBot();
          setSideToMove(userColor);
          updateStatus();
          return;
        }
        if (selectedSquare) {
          updateStatus();
          return;
        }
        if (game.turn() === userColor) {
          updateStatus();
          return;
        }
        if (game.turn() !== botColor()) {
          updateStatus();
          return;
        }
        if (!canBotActNow(false)) {
          updateStatus();
          return;
        }

        botThinking = true;
        $("#thinkingText").text(t("thinking"));
        $thinking.addClass("show");
        $("#undoBtn").prop("disabled", true);

        // Always roll/play as bot color — never game.turn() if it could be user
        var side = botColor();
        setSideToMove(side);
        var started = beginDiceTurnFor(side);
        updateStatus();

        if (!started) {
          // all bot dice skipped — user's turn now
          window.setTimeout(startUserTurnAfterBot, 120);
          return;
        }

        function botPly() {
          var genAtStart = botSchedGen;
          if (gameOver || applyGameEndFromPosition()) {
            finishBotThinking();
            return;
          }
          // Abort if human dice somehow became active
          if (userHasRemainingDice() || diceSide === userColor) {
            finishBotThinking();
            setSideToMove(userColor);
            updateStatus();
            return;
          }

          // Ensure bot side to move (dice multi-move may need FEN restore)
          if (isDiceMode()) {
            setSideToMove(botColor());
            if (game.turn() !== botColor()) {
              finishBotThinking();
              updateStatus();
              return;
            }
            if (endTurnIfNoPlayableDice(botColor())) {
              startUserTurnAfterBot();
              return;
            }
          } else if (game.turn() !== botColor()) {
            finishBotThinking();
            updateStatus();
            return;
          }

          if (!canBotActNow(true)) {
            finishBotThinking();
            updateStatus();
            return;
          }

          findBestMoveStockfish(function (best) {
            if (genAtStart !== botSchedGen) {
              finishBotThinking();
              return;
            }
            if (!best) {
              remainingDice = [];
              endTurnIfNoPlayableDice(botColor());
              startUserTurnAfterBot();
              return;
            }

            snapshotPush();
            var moved = game.move(best);
            if (moved) {
              // Sanity: never accept a move of the user's color
              if (moved.color === userColor) {
                game.undo();
                undoStack.pop();
                finishBotThinking();
                setSideToMove(userColor);
                updateStatus();
                return;
              }
              plySans.push(moved.san);
              playMoveSound();
              if (isDiceMode()) consumeDie(moved.piece);
              board.position(game.fen());
              updateMoveList();
              updateDiceUI();

              // End before any multi-move side restore (mate / king capture)
              if (applyGameEndFromPosition()) {
                finishBotThinking();
                // Still show quality for the mating move if toggle on
                afterLocalMoveForAnalysis(moved, null);
                return;
              }

              if (isDiceMode() && remainingDice.length > 0) {
                setSideToMove(botColor());
                if (!endTurnIfNoPlayableDice(botColor())) {
                  window.setTimeout(botPly, 180);
                  return;
                }
              }
              updateDiceUI();
              // Analyze bot move after search finished (engine free); then hand over
              afterLocalMoveForAnalysis(moved, function () {
                startUserTurnAfterBot();
              });
            } else {
              undoStack.pop();
              startUserTurnAfterBot();
            }
          });
        }

        window.setTimeout(botPly, 60);
      }

      function onDragStart(source, piece) {
        if (isSetupPhase()) return false;
        if (gameOver || botThinking || applyGameEndFromPosition()) return false;
        if (isMultiplayer()) {
          if (!canMpAct() || !mpBothSeated()) return false;
          cancelScheduledBot();
          if (game.turn() !== userColor || game.turn() !== mpSeat) return false;
        } else {
          cancelScheduledBot();
          if (isHumanDiceTurnActive() || userHasRemainingDice()) {
            setSideToMove(userColor);
          } else if (game.turn() !== userColor) {
            return false;
          }
        }
        if (piece.charAt(0) !== userColor) return false;
        var pType = piece.charAt(1).toLowerCase();
        if (!pieceAllowedByDice(pType)) return false;
        selectedSquare = source;
        $("#board .square-55d63").removeClass("selected");
        $("#board .square-" + source).addClass("selected");
        showLegalMoves(source);
        lockDragScroll();
        return true;
      }

      function onDrop(source, target) {
        unlockDragScroll();
        clearSelection();
        var moved = tryMakeUserMove(source, target);
        if (!moved) return "snapback";
        board.position(game.fen());
        updateMoveList();
        updateDiceUI();
        if (isMultiplayer()) {
          if (!canMpAct()) return "snapback";
          var san = plySans[plySans.length - 1];
          publishMpMove(source, target, san);
          updateStatus();
          cancelScheduledBot();
          // Local-only analysis in MP (own moves)
          afterLocalMoveForAnalysis(moved, null);
          return;
        }
        var handOff = afterUserDicePly();
        updateStatus();
        function continueAfterAnalysis() {
          if (handOff && !gameOver && !userHasRemainingDice() && canBotActNow(false)) {
            scheduleBot(250);
          } else {
            cancelScheduledBot();
          }
        }
        // Analyze before kicking the bot so the shared engine is free
        afterLocalMoveForAnalysis(moved, continueAfterAnalysis);
      }

      function onSnapEnd() {
        board.position(game.fen());
      }

      function tryClickMove(square) {
        if (isSetupPhase()) {
          handleSetupSquareClick(square);
          return;
        }
        if (gameOver || botThinking || applyGameEndFromPosition()) return;
        if (isMultiplayer()) {
          if (!mpBothSeated()) return;
          cancelScheduledBot();
          if (game.turn() !== userColor) return;
        } else {
          cancelScheduledBot();
          if (isHumanDiceTurnActive() || userHasRemainingDice()) {
            setSideToMove(userColor);
          } else if (game.turn() !== userColor) {
            return;
          }
        }

        var piece = game.get(square);

        if (!selectedSquare) {
          if (piece && piece.color === userColor && pieceAllowedByDice(piece.type)) {
            highlightSquare(square);
          }
          return;
        }

        if (selectedSquare === square) {
          clearSelection();
          return;
        }

        if (piece && piece.color === userColor) {
          if (pieceAllowedByDice(piece.type)) highlightSquare(square);
          return;
        }

        var from = selectedSquare;
        clearSelection();
        var moved = tryMakeUserMove(from, square);
        if (!moved) return;

        board.position(game.fen());
        updateMoveList();
        updateDiceUI();
        if (isMultiplayer()) {
          var san = plySans[plySans.length - 1];
          publishMpMove(from, square, san);
          updateStatus();
          cancelScheduledBot();
          afterLocalMoveForAnalysis(moved, null);
          return;
        }
        var handOff = afterUserDicePly();
        updateStatus();
        function continueAfterAnalysis() {
          if (handOff && !gameOver && !userHasRemainingDice() && canBotActNow(false)) {
            scheduleBot(250);
          } else {
            cancelScheduledBot();
          }
        }
        afterLocalMoveForAnalysis(moved, continueAfterAnalysis);
      }

      function boardOrientation() {
        return userColor === "w" ? "white" : "black";
      }

      function saveUserColor() {
        try { localStorage.setItem(COLOR_KEY, userColor); } catch (e) {}
      }

      function syncSideSelect() {
        $("#sideSelect").val(userColor);
      }

      function newGame() {
        cancelScheduledBot();
        if (isMultiplayer()) {
          if (mpSocket && mpRoom && mpRoom.hostId === getOrCreateClientId()) {
            mpSocket.emit("resetGame", { clientId: getOrCreateClientId(), code: mpRoomCode, nick: getNick() });
          }
          enterSetupPhase({ standard: false });
          publishSetupSync();
          return;
        }
        enterSetupPhase({ standard: false });
      }

      function undoMove() {
        if (isMultiplayer() || isSetupPhase()) return;
        if (botThinking || undoStack.length === 0) return;
        mqGen += 1;
        mqLast = null;
        clearMoveQualityBadge();
        if (typeof peGen !== "undefined") peGen += 1;
        if (isDiceMode()) {
          // Undo one ply; dice state restored from snapshot
          restoreSnapshot(undoStack.pop());
        } else if (game.turn() === userColor && undoStack.length >= 2) {
          undoStack.pop();
          restoreSnapshot(undoStack.pop());
        } else {
          restoreSnapshot(undoStack.pop());
        }
        gameOver = false;
        clearSelection();
        board.position(game.fen());
        updateMoveList();
        updateDiceUI();
        updateStatus();
        if (typeof schedulePositionEval === "function") schedulePositionEval();
        cancelScheduledBot();
        if (!gameOver && canBotActNow(false)) {
          scheduleBot(250);
        }
      }

      function onSideChange() {
        if (isMultiplayer()) {
          if (mpAloneCanSwitch()) {
            var want = $("#sideSelect").val() === "b" ? "b" : "w";
            claimMpSeat(want);
            return;
          }
          syncSideSelect();
          return;
        }
        var next = $("#sideSelect").val() === "b" ? "b" : "w";
        userColor = next;
        saveUserColor();
        if (isSetupPhase()) {
          if (board) board.orientation(boardOrientation());
          updateStatus();
          return;
        }
        // keep current play position; only flip orientation / bot side
        if (board) board.orientation(boardOrientation());
        updateStatus();
        // Eval bar is relative to who the human plays as — flip fill direction
        if (typeof applyPosEvalScore === "function" && peLastScore) {
          applyPosEvalScore(peLastScore);
        }
        if (!gameOver && game.turn() !== userColor) scheduleBot(250);
      }

      function onModeChange() {
        var next = $("#modeSelect").val() === "dice" ? "dice" : "classic";
        if (next === gameMode) return;
        gameMode = next;
        saveModeSettings();
        newGame();
      }

      function onDiceCountChange() {
        var v = parseInt($("#diceCount").val(), 10);
        var next = v === 1 || v === 3 ? v : 2;
        if (next === diceCount) return;
        diceCount = next;
        saveModeSettings();
        newGame();
      }

      $(function () {
        syncSideSelect();
        syncModeSelects();
        applyStaticLang();
        wireModeMenu();

        board = Chessboard("board", {
          draggable: true,
          position: EMPTY_POSITION,
          orientation: boardOrientation(),
          pieceTheme: PIECE_THEME,
          onDragStart: onDragStart,
          onDrop: onDrop,
          onSnapEnd: onSnapEnd
        });

        $("#board").on("click", ".square-55d63", function () {
          var sq = $(this).data("square");
          if (sq) tryClickMove(sq);
        });

        $("#newGameBtn").on("click", newGame);
        $("#undoBtn").on("click", undoMove);
        $("#setupClearBtn").on("click", function () {
          if (!isSetupPhase()) return;
          if (isMultiplayer() && (isSpectating() || !canMpAct())) return;
          clearSetupBoard();
        });
        $("#setupStandardBtn").on("click", function () {
          if (!isSetupPhase()) return;
          if (isMultiplayer() && (isSpectating() || !canMpAct())) return;
          standardSetupBoard();
        });
        $("#setupStartBtn").on("click", function () {
          if (!isSetupPhase() || isMultiplayer()) return;
          tryStartLocalGame();
        });
        $("#setupReadyBtn").on("click", function () {
          if (!isSetupPhase() || !isMultiplayer() || isSpectating()) return;
          var v = validateSetup();
          if (!setupReadyLocal && !v.ok) {
            updateSetupWarn();
            setStatus(v.msg || t("setupNeedKings"), "warn");
            return;
          }
          publishReadyToggle();
        });
        $("#setupHostStartBtn").on("click", function () { publishHostStart(); });
        $("#setupTurnSelect").on("change", function () {
          if (!isSetupPhase()) return;
          if (isMultiplayer() && (isSpectating() || !canMpAct())) {
            $("#setupTurnSelect").val(setupTurn);
            return;
          }
          setupTurn = $("#setupTurnSelect").val() === "b" ? "b" : "w";
          setupReadyLocal = false;
          updateSetupWarn();
          publishSetupSync();
        });
        $("#piecePalette").on("click", ".palette-piece", function () {
          if (!isSetupPhase()) return;
          if (isMultiplayer() && (isSpectating() || !canMpAct())) return;
          var code = $(this).attr("data-piece");
          if (code === "") setPalettePiece("");
          else setPalettePiece(code);
        });
        var rulesDialog = document.getElementById("rulesDialog");
        $("#rulesBtn").on("click", function () {
          if (!rulesDialog.open) rulesDialog.showModal();
        });
        $("#rulesCloseBtn").on("click", function () { rulesDialog.close(); });
        $(rulesDialog).on("click", function (e) {
          if (e.target === rulesDialog) rulesDialog.close();
        });
        $("#sideSelect").on("change", onSideChange);
        if ($("#modeSelect").length) $("#modeSelect").on("change", onModeChange);
        if ($("#diceCount").length) $("#diceCount").on("change", onDiceCountChange);
        $("#difficulty").on("change", function () {
          updateOpponentLabel();
        });
        syncMoveAnalysisToggle();
        $("#moveAnalysisToggle").on("click", function () {
          var next = $(this).attr("aria-checked") !== "true";
          setMoveAnalysisEnabled(next);
          syncMoveAnalysisToggle();
          if (!next && typeof isPosEvalOn === "function" && isPosEvalOn()) {
            schedulePositionEval();
          }
        });
        syncPosEvalToggle();
        if (isPosEvalOn() && isPlayPhase()) {
          setPosEvalVisible(true);
          schedulePositionEval();
        } else if (isPosEvalOn()) {
          setPosEvalVisible(true);
          resetPosEvalDisplay();
        } else {
          hidePosEval();
        }
        $("#posEvalToggle").on("click", function () {
          var next = $(this).attr("aria-checked") !== "true";
          setPosEvalEnabled(next);
          syncPosEvalToggle();
        });

        if (typeof BoardHackStockfish !== "undefined") {
          BoardHackStockfish.ensureReady().catch(function (e) {
            console.warn("Stockfish init:", e && e.message ? e.message : e);
          });
        }

        $("#langRu").on("click", function () { setLang("ru"); });
        $("#langEn").on("click", function () { setLang("en"); });

        $(window).on("resize", function () {
          board.resize();
          if (mqLast && isMoveAnalysisOn()) {
            placeMoveQualityBadge(mqLast.square, mqLast.kind);
          }
        });

        updateMoveList();
        updateStatus();
        updateMpUI();
        setMpConn("offline");

        $("#mpRoomsRefreshBtn").on("click", function () {
          ensureMpSocket(function (err) { if (!err) requestRoomList(); });
        });
        $("#mpCreateBtn").on("click", function () { enterMpFromCreate(); });
        $("#mpJoinToggleBtn").on("click", function () {
          $("#mpJoinPanel").toggleClass("mp-hidden");
          $("#mpSpectatePanel").addClass("mp-hidden");
          if (!$("#mpJoinPanel").hasClass("mp-hidden")) $("#mpJoinCode").trigger("focus");
        });
        $("#mpJoinBtn").on("click", function () { enterMpFromJoin($("#mpJoinCode").val()); });
        $("#mpJoinCode").on("keydown", function (e) {
          if (e.key === "Enter") enterMpFromJoin($("#mpJoinCode").val());
        });
        $("#mpSpectateToggleBtn").on("click", function () {
          $("#mpSpectatePanel").toggleClass("mp-hidden");
          $("#mpJoinPanel").addClass("mp-hidden");
          if (!$("#mpSpectatePanel").hasClass("mp-hidden")) $("#mpSpectateCode").trigger("focus");
        });
        $("#mpSpectateBtn").on("click", function () { enterMpFromSpectate($("#mpSpectateCode").val()); });
        $("#mpSpectateCode").on("keydown", function (e) {
          if (e.key === "Enter") enterMpFromSpectate($("#mpSpectateCode").val());
        });
        $("#mpNick").on("change blur", persistNickFromInput);
        $("#mpCopyBtn").on("click", function () {
          var link = buildShareLink(mpRoomCode);
          var done = function () {
            var toast = document.getElementById("mpCopyToast");
            if (toast) {
              toast.textContent = t("mpCopied");
              toast.classList.add("show");
              window.clearTimeout(toast._hideTimer);
              toast._hideTimer = window.setTimeout(function () { toast.classList.remove("show"); }, 1200);
            }
            $("#mpCopyBtn").text(t("mpCopied"));
            window.setTimeout(function () { $("#mpCopyBtn").text(mpRoomCode ? copyBtnLabel() : t("mpCopyInvite")); }, 1200);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(link).then(done).catch(function () {
              try { window.prompt(t("mpCodeLabel"), link); } catch (e) {}
            });
          } else {
            try { window.prompt(t("mpCodeLabel"), link); done(); } catch (e) {}
          }
        });
                $("#mpSeatW").on("click keydown", function (e) {
          if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
          if (e.type === "keydown") e.preventDefault();
          claimMpSeat("w");
        });
        $("#mpSeatB").on("click keydown", function (e) {
          if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
          if (e.type === "keydown") e.preventDefault();
          claimMpSeat("b");
        });
        $("#mpLeaveBtn").on("click", function () { leaveMultiplayer(); });
        $("#mpResetBtn").on("click", newGame);

        // Auto-join from ?room= or saved room (reconnect)
        var _paramsEarly = new URLSearchParams(window.location.search);
        var _maybeMp = !!(_paramsEarly.get("join") || _paramsEarly.get("room") || _paramsEarly.get("spectate") || (function () {
          try { return localStorage.getItem(MP_ROOM_KEY); } catch (e) { return null; }
        })());
        enterSetupPhase({ standard: false });
        tryAutoRejoin();
        if (!isMultiplayer() && !_maybeMp) {
          updateStatus();
        }
      });
    
    })();
  </script>

</body>
</html>
