<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardHack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
  <link rel="stylesheet" href="../../../css/boardhack.css" />
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a href="../../../index.html">
          <div class="brand-mark">♞</div>
          <div>Board<span class="accent">Hack</span></div>
        </a>
        <span class="mode-badge" id="modeBadge">chess · dice</span>
      </div>
      <div class="topbar-actions">
        <div class="mode-menu" id="modeMenu">
          <button type="button" class="mode-menu-btn" id="modeMenuBtn" aria-haspopup="true" aria-expanded="false">
            <span id="modeMenuLabel">Mode</span>
            <span class="chev">▾</span>
          </button>
          <div class="mode-menu-panel" id="modeMenuPanel" role="menu">
            <a href="../classic/index.html" data-mode="classic">
              <span>♟</span>
              <span>
                <span id="menuClassic">Classic</span>
                <span class="mode-desc" id="menuClassicDesc"></span>
              </span>
            </a>
            <a href="./index.html" class="active" data-mode="dice">
              <span>🎲</span>
              <span>
                <span id="menuDice">Dice</span>
                <span class="mode-desc" id="menuDiceDesc"></span>
              </span>
            </a>
          </div>
        </div>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" id="langRu" data-lang="ru">RU</button>
          <span class="lang-sep">|</span>
          <button type="button" id="langEn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="layout">
      <section class="card">
        <div class="card-title" id="playAreaTitle"></div>
        <div class="status-bar" id="statusBar">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText"></span>
        </div>
        <div class="board-wrap">
          <div id="board"></div>
          <div class="thinking" id="thinking"><div class="thinking-pill" id="thinkingText"></div></div>
        </div>
      </section>

      <aside class="side-stack">
        <section class="card">
          <div class="card-title" id="missionTitle"></div>
          <div class="controls">
            <div id="sideSelectWrap">
              <label class="field-label" for="sideSelect" id="sideSelectLabel"></label>
              <select id="sideSelect">
                <option value="w" selected></option>
                <option value="b"></option>
              </select>
            </div>
            <div id="difficultyWrap">
              <label class="field-label" for="difficulty" id="diffLabel"></label>
              <select id="difficulty">
                <option value="easy"></option>
                <option value="medium" selected></option>
                <option value="hard"></option>
                <option value="expert"></option>
                <option value="master"></option>
              </select>
            </div>
            <div id="diceCountWrap">
              <label class="field-label" for="diceCount" id="diceCountLabel"></label>
              <select id="diceCount">
                <option value="1"></option>
                <option value="2" selected></option>
                <option value="3"></option>
              </select>
            </div>
            <div class="dice-panel visible" id="dicePanel">
              <div class="card-title" id="dicePanelTitle"></div>
              <div class="dice-faces" id="diceFaces"></div>
              <p class="diff-hint" id="diceAllowedHint"></p>
            </div>
            <div class="btn-row" id="spGameBtns">
              <button type="button" class="btn btn-primary" id="newGameBtn"></button>
              <button type="button" class="btn btn-ghost" id="undoBtn"></button>
              <button type="button" class="btn btn-ghost" id="rulesBtn"></button>
            </div>
          </div>
        </section>


        <section class="card mp-card" id="mpCard">
          <div class="card-title" id="mpTitle">Мультиплеер</div>
          <div class="mp-conn" id="mpConnRow">
            <span class="mp-conn-dot" id="mpConnDot"></span>
            <span id="mpConnText">офлайн</span>
          </div>
          <div class="mp-nick-row" id="mpNickRow">
            <label class="field-label" for="mpNick" id="mpNickLabel">Ник</label>
            <input type="text" id="mpNick" maxlength="24" autocomplete="nickname" spellcheck="false" placeholder="" />
          </div>
          <div id="mpLobby">
            <div class="btn-row">
              <button type="button" class="btn btn-primary" id="mpCreateBtn">Создать комнату</button>
              <button type="button" class="btn btn-ghost" id="mpJoinToggleBtn">Войти</button>
              <button type="button" class="btn btn-ghost" id="mpSpectateToggleBtn">Наблюдать</button>
            </div>
            <div id="mpJoinPanel" class="mp-hidden" style="margin-top:0.65rem">
              <div class="mp-join-row">
                <input type="text" id="mpJoinCode" maxlength="8" autocomplete="off" spellcheck="false" placeholder="КОД" />
                <button type="button" class="btn btn-primary" id="mpJoinBtn">OK</button>
              </div>
            </div>
            <div id="mpSpectatePanel" class="mp-hidden" style="margin-top:0.65rem">
              <div class="mp-join-row">
                <input type="text" id="mpSpectateCode" maxlength="8" autocomplete="off" spellcheck="false" placeholder="КОД" />
                <button type="button" class="btn btn-primary" id="mpSpectateBtn">OK</button>
              </div>
            </div>
            <p class="mp-hint" id="mpHint">Пригласите друга по коду. Аккаунт не нужен.</p>
          </div>
          <div id="mpActive" class="mp-hidden">
            <div class="mp-code-box">
              <div class="mp-code-label" id="mpCodeLabel">Код комнаты</div>
              <div class="mp-code-value" id="mpCodeValue">------</div>
              <div class="mp-share-link" id="mpShareLink"></div>
            </div>
            <div class="mp-seats">
              <div class="mp-seat" id="mpSeatW" role="button" tabindex="0">White — …</div>
              <div class="mp-seat" id="mpSeatB" role="button" tabindex="0">Black — …</div>
            </div>
            <p class="mp-seat-pick-hint mp-hidden" id="mpSeatPickHint"></p>
            <div class="btn-row">
              <button type="button" class="btn btn-ghost" id="mpCopyBtn">Копировать</button>
              <button type="button" class="btn btn-ghost" id="mpLeaveBtn">Выйти</button>
              <button type="button" class="btn btn-primary mp-hidden" id="mpResetBtn"></button>
            </div>
            <p class="mp-hint mp-hidden" id="mpSpectateBanner"></p>
            <p class="mp-hint" id="mpSpectatorCount"></p>
            <p class="mp-hint" id="mpActiveHint"></p>
          </div>
        </section>

        <section class="card">
          <div class="card-title" id="sessionTitle"></div>
          <div class="meta-grid">
            <div class="meta-item">
              <div class="k" id="metaSideK"></div>
              <div class="v" id="sideLabel"></div>
            </div>
            <div class="meta-item">
              <div class="k" id="metaTurnK"></div>
              <div class="v" id="turnLabel"></div>
            </div>
            <div class="meta-item">
              <div class="k" id="metaMovesK"></div>
              <div class="v" id="moveCount">0</div>
            </div>
            <div class="meta-item">
              <div class="k" id="metaBotK"></div>
              <div class="v" id="botLabel"></div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-title" id="historyTitle"></div>
          <div class="move-list" id="moveList"></div>
        </section>
      </aside>
    </div>

    <footer class="footer">BoardHack</footer>
  </main>

  <dialog class="rules-dialog" id="rulesDialog" aria-labelledby="rulesTitle">
    <div class="rules-dialog-head">
      <h2 class="card-title" id="rulesTitle"></h2>
      <button type="button" class="rules-dialog-close" id="rulesCloseBtn" aria-label="Close">×</button>
    </div>
    <div class="rules-box" id="rulesBox"></div>
  </dialog>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <script src="../../../js/stockfish-bot.js"></script>

        $("#mpLeaveBtn").text(t("mpLeave"));

        updateDiceUI();
        $("#metaSideK").text(t("metaSide"));
        $("#metaTurnK").text(t("metaTurn"));

      // Standard FIDE starting position — white K e1 / Q d1, black K e8 / Q d8
      var START_FEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
      var START_POSITION = {
        a8: "bR", b8: "bN", c8: "bB", d8: "bQ", e8: "bK", f8: "bB", g8: "bN", h8: "bR",
        a7: "bP", b7: "bP", c7: "bP", d7: "bP", e7: "bP", f7: "bP", g7: "bP", h7: "bP",
        a2: "wP", b2: "wP", c2: "wP", d2: "wP", e2: "wP", f2: "wP", g2: "wP", h2: "wP",
        a1: "wR", b1: "wN", c1: "wB", d1: "wQ", e1: "wK", f1: "wB", g1: "wN", h1: "wR"
      };
      var PIECE_THEME =
        "https://cdn.jsdelivr.net/gh/oakmac/chessboardjs@master/website/img/chesspieces/wikipedia/{piece}.png";


      var game = new Chess();
      game.load(START_FEN);
      var board = null;

      try {

      } catch (e) {}
      var selectedSquare = null;
      var gameOver = false;
      var botThinking = false;
      var botTimerId = null;
      var botSchedGen = 0;
      var undoStack = [];
      var plySans = [];
      // Dice-mode turn log: [{side, dice:[{value,type,status}], plies:[{san,piece}], passed, closed}]
      var diceTurnLog = [];

      // Dice Chess: 1=p, 2=n, 3=b, 4=r, 5=q, 6=k
      // Each die = one required move of that type this turn (duplicates = multiple moves).
      // After each move, consume one matching die. Unplayable remaining dice are auto-skipped.
      // Multi-move: after an intermediate move, force the same side to move again via FEN.
      var DICE_MAP = { 1: "p", 2: "n", 3: "b", 4: "r", 5: "q", 6: "k" };
      var PIECE_I18N = { p: "pieceP", n: "pieceN", b: "pieceB", r: "pieceR", q: "pieceQ", k: "pieceK" };
      var PIECE_GLYPH = { p: "♟", n: "♞", b: "♝", r: "♜", q: "♛", k: "♚" };

      var gameMode = GAME_MODE;
      try { localStorage.setItem(MODE_KEY, gameMode); } catch (e) {}

      var diceCount = 2;
      try {
        var savedDice = parseInt(localStorage.getItem(DICE_COUNT_KEY), 10);
        if (savedDice === 1 || savedDice === 2 || savedDice === 3) diceCount = savedDice;
      } catch (e) {}

      // diceRoll: original faces [{value, type, status: "pending"|"used"|"skipped"}]
      // remainingDice: still-required [{value, type}]
      var diceRoll = [];
      var remainingDice = [];
      var diceSide = null;
      var lastSkipMsg = "";
      var consecutiveSkipPasses = 0;
      var DICE_REVEAL_MS = 750;
      var diceRevealUntil = 0;
      var diceRevealTimerId = null;
      var mpIgnoreDiceCountChange = false;

      var $statusText = $("#statusText");
      var $statusDot = $("#statusDot");
      var $moveList = $("#moveList");
      var $thinking = $("#thinking");
      var $turnLabel = $("#turnLabel");
      var $moveCount = $("#moveCount");
      var $botLabel = $("#botLabel");

      // ——— Multiplayer (room-by-code) ———
      var CLIENT_ID_KEY = "boardhack-client-id";
      var MP_ROOM_KEY = "boardhack-mp-room-dice";
      var mpActive = false;
      var mpSocket = null;
      var mpRoomCode = null;
      var mpSeat = null;
      var mpRoom = null;
      var mpConnState = "offline"; // offline|connecting|connected|waiting|playing|error
      var mpApplyingRemote = false;

      var NICK_KEY = "boardhack-nick";
      var mpSpectating = false;

      function sanitizeNickClient(raw) {
        return String(raw == null ? "" : raw)
          .replace(/[\u0000-\u001f\u007f]/g, "")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 24);
      }

      function getNick() {
        var el = document.getElementById("mpNick");
        var n = sanitizeNickClient(el ? el.value : "");
        if (!n) {
          try { n = sanitizeNickClient(localStorage.getItem(NICK_KEY) || ""); } catch (e) {}
        }
        if (el && el.value !== n) el.value = n;
        try { if (n) localStorage.setItem(NICK_KEY, n); } catch (e) {}
        return n;
      }

      function loadNickIntoInput() {
        var el = document.getElementById("mpNick");
        if (!el) return;
        try {
          var saved = sanitizeNickClient(localStorage.getItem(NICK_KEY) || "");
          if (saved && !el.value) el.value = saved;
        } catch (e) {}
        el.setAttribute("placeholder", t("mpNickPlaceholder"));
      }

      function persistNickFromInput() {
        var el = document.getElementById("mpNick");
        if (!el) return;
        var n = sanitizeNickClient(el.value);
        el.value = n;
        try { localStorage.setItem(NICK_KEY, n); } catch (e) {}
      }

      var mpServerUrl = "https://chessboard-ulhg.onrender.com";

      function getOrCreateClientId() {
        var id = null;
        try { id = localStorage.getItem(CLIENT_ID_KEY); } catch (e) {}
        if (!id || id.length < 8) {
          id = "c_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
          try { localStorage.setItem(CLIENT_ID_KEY, id); } catch (e) {}
        }
        return id;
      }

      function resolveServerUrl() {
        var params = new URLSearchParams(window.location.search);
        var s = params.get("server");
        if (s) {
          s = s.trim();
          if (s.indexOf("://") === -1) s = "http://" + s;
          return s.replace(/\/$/, "");
        }
        return "https://chessboard-ulhg.onrender.com";
      }

      function isMultiplayer() {
        return mpActive && (!!mpSeat || mpSpectating);
      }
      function isSpectating() {
        return mpActive && mpSpectating;
      }
      function canMpAct() {
        return mpActive && !!mpSeat && !mpSpectating;
      }

      function mpOpponentConnected() {
        if (!mpRoom || !mpRoom.seats) return false;
        var other = mpSeat === "w" ? "b" : "w";
        var s = mpRoom.seats[other];
        return !!(s && s.occupied && s.connected);
      }

      function mpBothSeated() {
        if (!mpRoom || !mpRoom.seats) return false;
        return !!(mpRoom.seats.w && mpRoom.seats.w.occupied && mpRoom.seats.b && mpRoom.seats.b.occupied);
      }

      function buildShareLink(code) {
        var u = new URL(window.location.href);
        u.searchParams.set("room", code);
        if (mpServerUrl && mpServerUrl !== "https://chessboard-ulhg.onrender.com") {
          u.searchParams.set("server", mpServerUrl);
        } else {
          u.searchParams.delete("server");
        }
        return u.toString();
      }

      function setMpConn(state, detail) {
        mpConnState = state;
        var $dot = $("#mpConnDot");
        $dot.removeClass("online waiting offline error");
        var label = t("mpOffline");
        if (state === "connecting") { $dot.addClass("waiting"); label = t("mpConnecting"); }
        else if (state === "connected") { $dot.addClass("online"); label = t("mpConnected"); }
        else if (state === "waiting") { $dot.addClass("waiting"); label = t("mpWaiting"); }
        else if (state === "playing") { $dot.addClass("online"); label = t("mpPlaying"); }
        else if (state === "error") { $dot.addClass("error"); label = detail || t("mpError"); }
        else { $dot.addClass("offline"); label = t("mpOffline"); }
        $("#mpConnText").text(label);
      }

      function seatLabel(color) {
        if (!mpRoom || !mpRoom.seats) return t("mpSeatEmpty");
        var s = mpRoom.seats[color];
        if (!s || !s.occupied) return t("mpSeatEmpty");
        var nick = sanitizeNickClient(s.nick || "");
        if (mpSeat === color) return nick ? (nick + " (" + t("mpSeatYou") + ")") : t("mpSeatYou");
        if (!s.connected) return nick ? (nick + " (" + t("mpSeatOffline") + ")") : t("mpSeatOffline");
        return nick || t("mpSeatOpp");
      }


      function mpAloneCanSwitch() {
        if (!isMultiplayer() || !mpRoom || !mpRoom.seats || !mpSeat) return false;
        if (mpBothSeated()) return false;
        var wOcc = !!(mpRoom.seats.w && mpRoom.seats.w.occupied);
        var bOcc = !!(mpRoom.seats.b && mpRoom.seats.b.occupied);
        return (wOcc ? 1 : 0) + (bOcc ? 1 : 0) === 1;
      }

      function claimMpSeat(color) {
        color = color === "b" ? "b" : "w";
        if (!mpAloneCanSwitch() || !mpSocket || !mpRoomCode) return;
        if (color === mpSeat) return;
        mpSocket.emit(
          "claimSeat",
          { clientId: getOrCreateClientId(), code: mpRoomCode, seat: color },
          function (res) {
            if (!res || !res.ok) {
              if (res && res.error === "seats_locked") return;
              setMpConn("error", (res && res.error) || t("mpError"));
              return;
            }
            applyMpRoom(res);
          }
        );
      }

      function updateMpUI() {
        $("#mpTitle").text(t("mpTitle"));
        // Keep mission card visible in MP so #dicePanel stays shown; hide only vs-bot controls.
        $("#missionTitle").closest("section.card").removeClass("mp-hidden");
        $("#sideSelectWrap").toggleClass("mp-hidden", isMultiplayer());
        $("#difficultyWrap").toggleClass("mp-hidden", isMultiplayer());
        $("#spGameBtns").toggleClass("mp-hidden", isMultiplayer());
        $("#mpResetBtn").toggleClass("mp-hidden", !canMpAct() || !mpRoom || mpRoom.hostId !== getOrCreateClientId());
        updateDiceCountControl();
        if (!mpActive) {
          $("#mpLobby").removeClass("mp-hidden");
          $("#mpActive").addClass("mp-hidden");
          $("#sideSelectWrap").removeClass("mp-hidden");
          $("#difficultyWrap").removeClass("mp-hidden");
          $("#spGameBtns").removeClass("mp-hidden");
          $("#sideSelect").prop("disabled", false);
          $("#difficulty").prop("disabled", false);
          $("#diceCount").prop("disabled", false);
          $(".sp-disabled-note").remove();
          return;
        }
        $("#mpLobby").addClass("mp-hidden");
        $("#mpActive").removeClass("mp-hidden");
        $("#mpCodeValue").text(mpRoomCode || "------");
        $("#mpShareLink").text(mpRoomCode ? buildShareLink(mpRoomCode) : "");
        var canPick = mpAloneCanSwitch();
        $("#mpSeatW")
          .text(t("sideWhite") + " — " + seatLabel("w"))
          .toggleClass("you", mpSeat === "w")
          .toggleClass("filled", !!(mpRoom && mpRoom.seats.w && mpRoom.seats.w.occupied))
          .toggleClass("pickable", canPick && mpSeat !== "w")
          .attr("aria-disabled", canPick ? "false" : "true");
        $("#mpSeatB")
          .text(t("sideBlack") + " — " + seatLabel("b"))
          .toggleClass("you", mpSeat === "b")
          .toggleClass("filled", !!(mpRoom && mpRoom.seats.b && mpRoom.seats.b.occupied))
          .toggleClass("pickable", canPick && mpSeat !== "b")
          .attr("aria-disabled", canPick ? "false" : "true");
        if (canPick) {
          $("#mpSeatPickHint").removeClass("mp-hidden").text(t("mpSeatPickHint"));
        } else {
          $("#mpSeatPickHint").addClass("mp-hidden").text("");
        }
        $("#mpActiveHint").text(mpBothSeated() ? t("mpPlayingHint") : t("mpWaitingHint"));
        $("#sideSelectWrap").addClass("mp-hidden");
        $("#difficultyWrap").addClass("mp-hidden");
        $("#spGameBtns").addClass("mp-hidden");
        $("#sideSelect").prop("disabled", true);
        $("#difficulty").prop("disabled", true);
        $(".sp-disabled-note").remove();
        $("#sideSelect").val(userColor);
        $("#sideLabel").text(userColor === "w" ? t("sideWhite") : t("sideBlack"));
        var specN = (mpRoom && typeof mpRoom.spectatorCount === "number") ? mpRoom.spectatorCount : 0;
        if (specN > 0) {
          $("#mpSpectatorCount").removeClass("mp-hidden").text(t("mpSpectatorCount").replace("{n}", String(specN)));
        } else {
          $("#mpSpectatorCount").addClass("mp-hidden").text("");
        }
        if (mpSpectating) {
          $("#mpSpectateBanner").removeClass("mp-hidden").text(t("mpYouSpectate"));
        } else {
          $("#mpSpectateBanner").addClass("mp-hidden").text("");
        }
        updateOpponentLabel();
      }

      function snapshotDiceState() {
        return {
          diceCount: diceCount,
          diceRoll: cloneDiceList(diceRoll),
          remainingDice: cloneDiceList(remainingDice),
          diceSide: diceSide,
          lastSkipMsg: lastSkipMsg || ""
        };
      }

      function isMpHost() {
        return isMultiplayer() && mpRoom && mpRoom.hostId === getOrCreateClientId();
      }

      function updateDiceCountControl() {
        if (!$("#diceCount").length) return;
        // In MP only the host may change dice count (avoids sync/newGame feedback loop).
        var canEdit = !isMultiplayer() || !mpActive || isMpHost();
        $("#diceCount").prop("disabled", !canEdit);
      }

      /** Apply dice count without firing the select change → newGame loop. */
      function applyDiceCountFromRemote(n) {
        if (n !== 1 && n !== 2 && n !== 3) return false;
        diceCount = n;
        mpIgnoreDiceCountChange = true;
        try {
          if ($("#diceCount").length) $("#diceCount").val(String(diceCount));
        } finally {
          mpIgnoreDiceCountChange = false;
        }
        try { localStorage.setItem(DICE_COUNT_KEY, String(diceCount)); } catch (e) {}
        updateDiceCountControl();
        return true;
      }

      function applyDiceState(d) {
        if (!d) {
          clearDiceState();
          return;
        }
        if (d.diceCount === 1 || d.diceCount === 2 || d.diceCount === 3) {
          applyDiceCountFromRemote(d.diceCount);
        }
        diceRoll = d.diceRoll ? cloneDiceList(d.diceRoll) : [];
        remainingDice = d.remainingDice ? cloneDiceList(d.remainingDice) : [];
        diceSide = d.diceSide != null ? d.diceSide : null;
        lastSkipMsg = d.lastSkipMsg || "";
        updateDiceUI();
        // Fresh roll from peer: hold so both sides can see faces before play continues.
        if (diceRoll.length && remainingDice.length && diceSide) {
          var allPending = true;
          for (var i = 0; i < diceRoll.length; i++) {
            if (diceRoll[i].status && diceRoll[i].status !== "pending") { allPending = false; break; }
          }
          if (allPending) noteDiceReveal();
        }
      }

      function ensureMpSocket(cb) {
        mpServerUrl = resolveServerUrl();
        if (mpSocket && mpSocket.connected) {
          if (cb) cb(null);
          return;
        }
        if (typeof io === "undefined") {
          setMpConn("error", t("mpError"));
          if (cb) cb(new Error("socket.io missing"));
          return;
        }
        setMpConn("connecting");
        if (mpSocket) {
          try { mpSocket.removeAllListeners(); mpSocket.disconnect(); } catch (e) {}
          mpSocket = null;
        }
        mpSocket = io(mpServerUrl, {
          transports: ["websocket", "polling"],
          reconnection: true,
          reconnectionAttempts: 12,
          timeout: 8000
        });
        mpSocket.on("connect", function () {
          setMpConn(mpBothSeated() ? "playing" : (mpActive ? "waiting" : "connected"));
          if (mpActive && mpRoomCode) {
            mpSocket.emit("reconnectRoom", { clientId: getOrCreateClientId(), code: mpRoomCode, nick: getNick() }, function (res) {
              if (res && res.ok) applyMpRoom(res);
            });
          }
          if (cb) { var f = cb; cb = null; f(null); }
        });
        mpSocket.on("connect_error", function () {
          setMpConn("error", t("mpError"));
          if (cb) { var f = cb; cb = null; f(new Error("connect_error")); }
        });
        mpSocket.on("disconnect", function () {
          if (mpActive) setMpConn("error", t("mpError"));
          else setMpConn("offline");
        });
        mpSocket.on("roomState", function (msg) {
          if (msg && msg.room) applyMpRoom({ room: msg.room, seat: msg.room.yourSeat || mpSeat, code: msg.room.code });
        });
        mpSocket.on("moveApplied", function (msg) {
          if (!mpActive || !msg) return;
          if (msg.by === mpSeat && !mpApplyingRemote) {
            if (msg.fen && msg.fen !== game.fen()) applyRemotePosition(msg);
            else if (msg.dice) {
              applyDiceState(msg.dice);
              if (mpRoom) mpRoom.dice = msg.dice;
            }
            return;
          }
          applyRemotePosition(msg);
        });
        mpSocket.on("gameReset", function (msg) {
          if (!mpActive) return;
          if (msg && msg.room) {
            mpRoom = msg.room;
            if (msg.room.diceCount === 1 || msg.room.diceCount === 2 || msg.room.diceCount === 3) {
              applyDiceCountFromRemote(msg.room.diceCount);
            }
            if (mpBothSeated()) setMpConn("playing");
            else setMpConn("waiting");
            updateMpUI();
          }
          // One-shot board clear + roll; do not re-enter applyMpRoom (avoids double ensure/sync).
          syncBoardFromMpRoom(true);
          ensureMpDiceTurnIfNeeded();
        });
        mpSocket.on("opponentJoined", function () {
          updateMpUI();
          updateStatus();
          ensureMpDiceTurnIfNeeded();
        });
        mpSocket.on("opponentLeft", function () {
          setMpConn("waiting");
          updateMpUI();
          updateStatus();
        });
        mpSocket.on("opponentDisconnected", function () {
          setMpConn("waiting");
          updateMpUI();
          updateStatus();
        });
        mpSocket.on("opponentReconnected", function () {
          setMpConn(mpBothSeated() ? "playing" : "waiting");
          updateMpUI();
          updateStatus();
        });
      }

      function applyMpRoom(res) {
        if (!res) return;
        if (res.room) mpRoom = res.room;
        if (res.code) mpRoomCode = res.code;
        var role = res.role || (res.room && res.room.yourRole) || null;
        if (role === "spectator" || res.role === "spectator") {
          mpSpectating = true;
          mpSeat = null;
        } else if (res.seat) {
          mpSpectating = false;
          mpSeat = res.seat;
          userColor = res.seat;
          saveUserColor();
        } else if (res.room && res.room.yourSeat) {
          mpSpectating = false;
          mpSeat = res.room.yourSeat;
          userColor = mpSeat;
          saveUserColor();
        } else {
          mpSpectating = false;
        }
        mpActive = true;
        try { localStorage.setItem(MP_ROOM_KEY, mpRoomCode); } catch (e) {}
        if (mpRoom && (mpRoom.diceCount === 1 || mpRoom.diceCount === 2 || mpRoom.diceCount === 3)) {
          applyDiceCountFromRemote(mpRoom.diceCount);
        }
        if (mpBothSeated()) setMpConn("playing");
        else setMpConn("waiting");
        updateMpUI();
        cancelScheduledBot();
        botThinking = false;
        $thinking.removeClass("show");
        if (board) {
          board.orientation(boardOrientation());
        }
        syncBoardFromMpRoom(false);
        updateStatus();
        ensureMpDiceTurnIfNeeded();
      }

      function syncBoardFromMpRoom(forceReset) {
        if (!mpRoom) return;
        var fen = mpRoom.fen || START_FEN;
        if (forceReset || game.fen() !== fen) {
          game.load(fen);
          if (Array.isArray(mpRoom.plySans)) plySans = mpRoom.plySans.slice();
          if (Array.isArray(mpRoom.diceTurnLog)) diceTurnLog = cloneDiceTurnLog(mpRoom.diceTurnLog);
          gameOver = false;
          if (board) board.position(game.fen(), false);
          clearSelection();
          updateMoveList();
        }
        if (mpRoom.dice) applyDiceState(mpRoom.dice);
        else if (forceReset) clearDiceState();
        applyGameEndFromPosition();
      }

      function applyRemotePosition(msg) {
        mpApplyingRemote = true;
        try {
          if (msg.fen) game.load(msg.fen);
          if (Array.isArray(msg.plySans)) plySans = msg.plySans.slice();
          else if (msg.move && msg.move.san && plySans[plySans.length - 1] !== msg.move.san) {
            plySans.push(msg.move.san);
          }
          if (Array.isArray(msg.diceTurnLog)) {
            diceTurnLog = cloneDiceTurnLog(msg.diceTurnLog);
          }
          if (!msg.stateSync) playMoveSound();
          if (Object.prototype.hasOwnProperty.call(msg, "dice")) {
            applyDiceState(msg.dice);
          }
          if (board) board.position(game.fen());
          clearSelection();
          updateMoveList();
          if (msg.dice && msg.dice.diceSide && msg.dice.remainingDice && msg.dice.remainingDice.length) {
            setSideToMove(msg.dice.diceSide);
          }
          refreshDiceHighlights();
          if (msg.status === "finished" || applyGameEndFromPosition()) {
            /* status updated inside */
          } else {
            updateStatus();
          }
          if (mpRoom) {
            mpRoom.fen = msg.fen || mpRoom.fen;
            mpRoom.plySans = plySans.slice();
            if (Array.isArray(msg.diceTurnLog)) mpRoom.diceTurnLog = cloneDiceTurnLog(msg.diceTurnLog);
            if (msg.move) mpRoom.lastMove = msg.move;
            if (msg.status) mpRoom.status = msg.status;
            if (Object.prototype.hasOwnProperty.call(msg, "dice")) mpRoom.dice = msg.dice;
          }
        } finally {
          mpApplyingRemote = false;
        }
        ensureMpDiceTurnIfNeeded();
      }

      function enterMpFromCreate() {
        persistNickFromInput();
        ensureMpSocket(function (err) {
          if (err) return;
          mpSocket.emit(
            "createRoom",
            { clientId: getOrCreateClientId(), mode: "dice", preferredSeat: (userColor === "b" ? "b" : "w"), diceCount: diceCount, nick: getNick() },
            function (res) {
              if (!res || !res.ok) {
                setMpConn("error", (res && res.error) || t("mpError"));
                return;
              }
              applyMpRoom(res);
            }
          );
        });
      }

      function enterMpFromJoin(code) {
        code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
        if (!code) return;
        persistNickFromInput();
        ensureMpSocket(function (err) {
          if (err) return;
          mpSocket.emit(
            "joinRoom",
            { clientId: getOrCreateClientId(), code: code, mode: "dice", nick: getNick() },
            function (res) {
              if (!res || !res.ok) {
                var errKey = res && res.error;
                var msg = t("mpError");
                if (errKey === "room_not_found") msg = t("mpNotFound");
                if (errKey === "room_full") msg = t("mpRoomFull");
                if (errKey === "wrong_mode") msg = t("mpWrongMode");
                setMpConn("error", msg);
                return;
              }
              applyMpRoom(res);
            }
          );
        });
      }


      function enterMpFromSpectate(code) {
        code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
        if (!code) return;
        persistNickFromInput();
        ensureMpSocket(function (err) {
          if (err) return;
          mpSocket.emit(
            "spectateRoom",
            { clientId: getOrCreateClientId(), code: code, mode: "dice", nick: getNick() },
            function (res) {
              if (!res || !res.ok) {
                var errKey = res && res.error;
                var msg = t("mpError");
                if (errKey === "room_not_found") msg = t("mpNotFound");
                if (errKey === "wrong_mode") msg = t("mpWrongMode");
                setMpConn("error", msg);
                return;
              }
              applyMpRoom(res);
            }
          );
        });
      }

      function leaveMultiplayer() {
        if (mpSocket && mpRoomCode) {
          try { mpSocket.emit("leaveRoom", { clientId: getOrCreateClientId(), code: mpRoomCode, nick: getNick() }); } catch (e) {}
        }
        mpActive = false;
        mpSpectating = false;
        mpRoomCode = null;
        mpSeat = null;
        mpRoom = null;
        try { localStorage.removeItem(MP_ROOM_KEY); } catch (e) {}
        if (mpSocket) {
          try { mpSocket.removeAllListeners(); mpSocket.disconnect(); } catch (e) {}
          mpSocket = null;
        }
        setMpConn("offline");
        updateMpUI();
        newGame();
      }

      function publishMpMove(from, to, san) {
        if (!canMpAct() || !mpSocket) return;
        var dice = snapshotDiceState();
        mpSocket.emit("makeMove", {
          clientId: getOrCreateClientId(),
          code: mpRoomCode,
          from: from,
          to: to,
          promotion: "q",
          fen: game.fen(),
          san: san,
          plySans: plySans.slice(),
          diceTurnLog: cloneDiceTurnLog(diceTurnLog),
          gameOver: !!gameOver,
          dice: dice
        });
        if (mpRoom) {
          mpRoom.fen = game.fen();
          mpRoom.plySans = plySans.slice();
          mpRoom.diceTurnLog = cloneDiceTurnLog(diceTurnLog);
          mpRoom.lastMove = { from: from, to: to, san: san, color: mpSeat };
          mpRoom.dice = dice;
        }
      }

      function publishMpStateSync() {
        if (!isMultiplayer() || !mpSocket || mpApplyingRemote) return;
        var dice = snapshotDiceState();
        mpSocket.emit("makeMove", {
          clientId: getOrCreateClientId(),
          code: mpRoomCode,
          fen: game.fen(),
          plySans: plySans.slice(),
          diceTurnLog: cloneDiceTurnLog(diceTurnLog),
          gameOver: !!gameOver,
          dice: dice,
          stateSync: true
        });
        if (mpRoom) {
          mpRoom.fen = game.fen();
          mpRoom.plySans = plySans.slice();
          mpRoom.diceTurnLog = cloneDiceTurnLog(diceTurnLog);
          mpRoom.dice = dice;
        }
      }

      /** If both seated and it is my chess turn with no active dice, roll and sync. */
      function ensureMpDiceTurnIfNeeded() {
        if (!isMultiplayer() || !mpBothSeated() || gameOver || mpApplyingRemote) return;
        if (game.turn() !== userColor) return;
        if (diceSide === userColor && remainingDice.length > 0) return;
        if (diceSide && diceSide !== userColor) return;
        if (diceRevealPending()) return;
        // Roll + sync immediately so opponent sees faces; resolve skip/pass after reveal delay.
        beginDiceTurnFor(userColor, { deferResolve: true });
        publishMpStateSync();
        updateStatus();
        afterDiceReveal(function () {
          if (!isMultiplayer() || mpApplyingRemote || gameOver) return;
          if (game.turn() !== userColor) return;
          var canMove = resolveDiceTurnAfterReveal(userColor);
          publishMpStateSync();
          updateStatus();
          if (!canMove) {
            // Turn may have passed via skips; opponent will roll when they receive sync.
          }
        });
      }

      function tryAutoRejoin() {
        var params = new URLSearchParams(window.location.search);
        var roomParam = params.get("room");
        var saved = null;
        try { saved = localStorage.getItem(MP_ROOM_KEY); } catch (e) {}
        var code = (roomParam || saved || "").toUpperCase().trim();
        if (!code) return;
        ensureMpSocket(function (err) {
          if (err) return;
          mpSocket.emit(
            "reconnectRoom",
            { clientId: getOrCreateClientId(), code: code, nick: getNick() },
            function (res) {
              if (res && res.ok) {
                if (res.room && res.room.mode && res.room.mode !== "dice") {
                  setMpConn("error", t("mpWrongMode"));
                  return;
                }
                applyMpRoom(res);
                return;
              }
              mpSocket.emit(
                "joinRoom",
                { clientId: getOrCreateClientId(), code: code, mode: "dice", nick: getNick() },
                function (res2) {
                  if (res2 && res2.ok) applyMpRoom(res2);
                  else if (roomParam) {
                    var msg = t("mpNotFound");
                    if (res2 && res2.error === "wrong_mode") msg = t("mpWrongMode");
                    setMpConn("error", msg);
                  }
                }
              );
            }
          );
        });
      }

      function getSkillKey() {
        var v = $("#difficulty").val();
        if (v && BoardHackStockfish && BoardHackStockfish.SKILLS[v]) return v;
        return "medium";
      }

      function skillLabel(key) {
        var cfg = BoardHackStockfish.getSkill(key);
        return t(cfg.labelKey);
      }

      function updateOpponentLabel() {
        $("#metaBotK").text(t("metaOpp"));
        if (!isMultiplayer()) {
          $botLabel.text(t("metaBot") + " \u2014 " + skillLabel(getSkillKey()));
          return;
        }
        var oppColor = mpSeat === "w" ? "b" : (mpSeat === "b" ? "w" : null);
        var nick = "";
        if (oppColor && mpRoom && mpRoom.seats && mpRoom.seats[oppColor] && mpRoom.seats[oppColor].occupied) {
          nick = sanitizeNickClient(mpRoom.seats[oppColor].nick || "");
        }
        if (mpSpectating) {
          var wn = (mpRoom && mpRoom.seats && mpRoom.seats.w && mpRoom.seats.w.occupied) ? sanitizeNickClient(mpRoom.seats.w.nick || "") : "";
          var bn = (mpRoom && mpRoom.seats && mpRoom.seats.b && mpRoom.seats.b.occupied) ? sanitizeNickClient(mpRoom.seats.b.nick || "") : "";
          $botLabel.text((wn || t("sideWhite")) + " vs " + (bn || t("sideBlack")));
        } else {
          $botLabel.text(nick || t("mpOpponent") || t("metaOpp"));
        }
      }

      function isDiceMode() {
        return gameMode === "dice";
      }

      function saveModeSettings() {
        try {
          localStorage.setItem(MODE_KEY, gameMode);
          localStorage.setItem(DICE_COUNT_KEY, String(diceCount));
        } catch (e) {}
      }

      function syncModeSelects() {
        if ($("#modeSelect").length) $("#modeSelect").val(gameMode);
        if ($("#diceCount").length) {
          mpIgnoreDiceCountChange = true;
          try { $("#diceCount").val(String(diceCount)); }
          finally { mpIgnoreDiceCountChange = false; }
        }
        if (isDiceMode()) {
          $("#diceCountWrap").removeClass("hidden");
          $("#dicePanel").addClass("visible");
        } else {
          $("#diceCountWrap").addClass("hidden");
          $("#dicePanel").removeClass("visible");
        }
        updateDiceCountControl();
      }

      function pieceName(type) {
        return t(PIECE_I18N[type] || "diceNone");
      }

      function cloneDiceList(list) {
        var out = [];
        for (var i = 0; i < list.length; i++) {
          out.push({
            value: list[i].value,
            type: list[i].type,
            status: list[i].status
          });
        }
        return out;
      }

      function cloneDiceTurnLog(list) {
        var out = [];
        if (!list) return out;
        for (var i = 0; i < list.length; i++) {
          var t = list[i];
          var plies = [];
          if (t.plies) {
            for (var j = 0; j < t.plies.length; j++) {
              plies.push({ san: t.plies[j].san, piece: t.plies[j].piece });
            }
          }
          out.push({
            side: t.side,
            dice: cloneDiceList(t.dice || []),
            plies: plies,
            passed: !!t.passed,
            closed: !!t.closed
          });
        }
        return out;
      }

      /** True if side has at least one piece of this type on the board. */
      function sideHasPieceType(side, pieceType) {
        var boardState = game.board();
        for (var r = 0; r < 8; r++) {
          for (var c = 0; c < 8; c++) {
            var p = boardState[r][c];
            if (p && p.color === side && p.type === pieceType) return true;
          }
        }
        return false;
      }

      function startDiceTurnLogEntry(side) {
        diceTurnLog.push({
          side: side,
          dice: cloneDiceList(diceRoll),
          plies: [],
          passed: false,
          closed: false
        });
      }

      function syncOpenDiceTurnFaces() {
        if (!diceTurnLog.length) return;
        var last = diceTurnLog[diceTurnLog.length - 1];
        if (last.closed) return;
        last.dice = cloneDiceList(diceRoll);
      }

      function appendDiceTurnPly(san, piece) {
        if (!diceTurnLog.length) return;
        var last = diceTurnLog[diceTurnLog.length - 1];
        if (last.closed) return;
        last.plies.push({ san: san, piece: piece });
        last.passed = false;
        last.dice = cloneDiceList(diceRoll);
      }

      function closeDiceTurnLogEntry() {
        if (!diceTurnLog.length) return;
        var last = diceTurnLog[diceTurnLog.length - 1];
        if (last.closed) return;
        last.dice = cloneDiceList(diceRoll);
        if (!last.plies.length) last.passed = true;
        last.closed = true;
      }

      function clearDiceReveal() {
        if (diceRevealTimerId != null) {
          clearTimeout(diceRevealTimerId);
          diceRevealTimerId = null;
        }
        diceRevealUntil = 0;
      }

      function noteDiceReveal() {
        diceRevealUntil = Date.now() + DICE_REVEAL_MS;
      }

      function diceRevealPending() {
        return Date.now() < diceRevealUntil;
      }

      function afterDiceReveal(fn) {
        var wait = Math.max(0, diceRevealUntil - Date.now());
        if (diceRevealTimerId != null) {
          clearTimeout(diceRevealTimerId);
          diceRevealTimerId = null;
        }
        if (wait <= 0) {
          fn();
          return;
        }
        diceRevealTimerId = window.setTimeout(function () {
          diceRevealTimerId = null;
          fn();
        }, wait);
      }

      function clearDiceState() {
        clearDiceReveal();
        diceRoll = [];
        remainingDice = [];
        diceSide = null;
        lastSkipMsg = "";
        consecutiveSkipPasses = 0;
        updateDiceUI();
      }

      function remainingTypesList() {
        var names = [];
        for (var i = 0; i < remainingDice.length; i++) {
          names.push(pieceName(remainingDice[i].type));
        }
        return names;
      }

      /** Re-classify die playability (green/red/dim). Call after every ply, not only on roll. */
      function refreshDiceHighlights() {
        updateDiceUI();
      }

      function updateDiceUI() {
        syncModeSelects();
        if (!isDiceMode()) {
          $("#diceFaces").empty();
          $("#diceAllowedHint").text("");
          return;
        }
        syncOpenDiceTurnFaces();
        var html = "";
        var colorChar = diceSide || game.turn() || "w";
        var evalSide = diceSide || game.turn() || "w";
        // After a ply FEN turn flips, but diceSide still owns remaining dice.
        // Classify geometry for evalSide or blocked dice falsely look playable (opp moves).
        if (diceSide && remainingDice.length > 0 && game.turn() !== diceSide) {
          setSideToMove(diceSide);
          evalSide = diceSide;
          colorChar = diceSide;
        }
        for (var i = 0; i < diceRoll.length; i++) {
          var d = diceRoll[i];
          var cls = "die";
          var statusLabel = "";
          if (d.status === "used") {
            cls += " used";
            statusLabel = t("histUsed");
          } else if (d.status === "skipped") {
            cls += " skipped";
            statusLabel = t("histSkipped");
          } else {
            // pending: green = playable geometry, red = on board but blocked, dim = missing
            var onBoard = sideHasPieceType(evalSide, d.type);
            if (!onBoard) {
              cls += " missing";
            } else if (hasLegalForType(d.type, evalSide)) {
              cls += " playable";
            } else {
              cls += " blocked";
            }
          }
          var pieceCode = colorChar + d.type.toUpperCase();
          var imgSrc = PIECE_THEME.replace("{piece}", pieceCode);
          var title = pieceName(d.type) + (statusLabel ? " — " + statusLabel : "");
          html +=
            '<div class="' + cls + '" title="' + title + '">' +
            '<img class="die-piece-img" src="' + imgSrc + '" alt="' + pieceName(d.type) + '" />' +
            "</div>";
        }
        $("#diceFaces").html(html);
        var hint = "";
        if (lastSkipMsg) hint = lastSkipMsg;
        if (remainingDice.length) {
          var rem = t("diceRemaining").replace("{pieces}", remainingTypesList().join(", "));
          hint = hint ? hint + " · " + rem : rem;
        } else if (diceRoll.length) {
          hint = hint ? hint + " · " + t("diceDone") : t("diceDone");
        } else {
          hint = hint || t("diceNone");
        }
        $("#diceAllowedHint").text(hint);
      }

      /**
       * Dice mode: chess.js FIDE-legal moves hide anything that leaves/ignores check.
       * Use pseudo-legal (geometry) moves when legal:false — still piece-correct,
       * but not filtered by check/mate. Classic mode keeps default legal:true.
       */
      function getModeMoves(extra) {
        var opts = { verbose: true };
        if (isDiceMode()) opts.legal = false;
        if (extra) {
          for (var k in extra) {
            if (Object.prototype.hasOwnProperty.call(extra, k)) opts[k] = extra[k];
          }
        }
        return game.moves(opts);
      }

      /**
       * True if this piece type has a geometry (dice) / legal (classic) move now
       * for the given side (defaults to active diceSide, else game.turn()).
       * Must not use a flipped post-ply turn — that scores the opponent and paints
       * blocked dice green.
       */
      function hasLegalForType(pieceType, side) {
        side = side || diceSide || game.turn();
        if (side && game.turn() !== side) {
          setSideToMove(side);
        }
        if (side && game.turn() !== side) return false;
        var all = getModeMoves();
        for (var i = 0; i < all.length; i++) {
          if (all[i].piece === pieceType) return true;
        }
        return false;
      }

      function findGeometryMove(from, to, promotion) {
        promotion = promotion || "q";
        var dirty = getModeMoves();
        for (var i = 0; i < dirty.length; i++) {
          var m = dirty[i];
          if (m.from !== from || m.to !== to) continue;
          if (m.promotion && m.promotion !== promotion) continue;
          return m;
        }
        return null;
      }

      /**
       * Apply a pseudo-legal verbose move that chess.js move() would reject
       * (leaves own king in check). Rebuilds FEN after geometric board edits.
       */
      function applyGeometryMove(vm) {
        if (!vm || !vm.from || !vm.to) return null;
        var from = vm.from;
        var to = vm.to;
        var fenBefore = game.fen();
        var parts = fenBefore.split(" ");
        if (parts.length < 6) return null;
        var turn = parts[1];
        var castling = parts[2];
        var half = parseInt(parts[4], 10) || 0;
        var full = parseInt(parts[5], 10) || 1;
        var flags = vm.flags || "";

        if (flags.indexOf("e") !== -1) {
          game.remove(to.charAt(0) + from.charAt(1));
        } else if (vm.captured) {
          game.remove(to);
        }

        var piece = game.remove(from);
        if (!piece) {
          game.load(fenBefore);
          return null;
        }

        if (flags.indexOf("k") !== -1) {
          if (turn === "w") {
            game.remove("h1");
            game.put({ type: "r", color: "w" }, "f1");
          } else {
            game.remove("h8");
            game.put({ type: "r", color: "b" }, "f8");
          }
        } else if (flags.indexOf("q") !== -1) {
          if (turn === "w") {
            game.remove("a1");
            game.put({ type: "r", color: "w" }, "d1");
          } else {
            game.remove("a8");
            game.put({ type: "r", color: "b" }, "d8");
          }
        }

        game.put(
          { type: vm.promotion || piece.type, color: piece.color },
          to
        );

        var nc = castling;
        function stripCastle(ch) {
          nc = nc.replace(ch, "");
        }
        if (piece.type === "k") {
          if (turn === "w") {
            stripCastle("K");
            stripCastle("Q");
          } else {
            stripCastle("k");
            stripCastle("q");
          }
        }
        if (from === "a1" || to === "a1") stripCastle("Q");
        if (from === "h1" || to === "h1") stripCastle("K");
        if (from === "a8" || to === "a8") stripCastle("q");
        if (from === "h8" || to === "h8") stripCastle("k");
        if (!nc) nc = "-";

        var newEp = "-";
        if (flags.indexOf("b") !== -1) {
          var fr = parseInt(from.charAt(1), 10);
          var tr = parseInt(to.charAt(1), 10);
          newEp = from.charAt(0) + String((fr + tr) / 2);
        }

        var newHalf =
          piece.type === "p" || vm.captured || flags.indexOf("e") !== -1
            ? 0
            : half + 1;
        var newFull = turn === "b" ? full + 1 : full;
        var newTurn = turn === "w" ? "b" : "w";
        var boardPart = game.fen().split(" ")[0];
        var newFen = [boardPart, newTurn, nc, newEp, String(newHalf), String(newFull)].join(
          " "
        );
        if (!game.load(newFen)) {
          game.load(fenBefore);
          return null;
        }
        return {
          color: piece.color,
          from: from,
          to: to,
          piece: piece.type,
          captured: vm.captured,
          promotion: vm.promotion,
          flags: flags,
          san: vm.san || from + to
        };
      }

      /**
       * Make a move: FIDE-legal via chess.js when possible; in dice mode fall back
       * to geometry apply so check/mate does not block.
       */
      function applyGameMove(moveInput) {
        var from;
        var to;
        var promotion = "q";
        if (typeof moveInput === "string") {
          var moved = game.move(moveInput);
          if (moved) return moved;
          if (!isDiceMode() || moveInput.length < 4) return null;
          from = moveInput.slice(0, 2);
          to = moveInput.slice(2, 4);
          if (moveInput.length > 4) promotion = moveInput.charAt(4).toLowerCase();
        } else if (moveInput && typeof moveInput === "object") {
          from = moveInput.from;
          to = moveInput.to;
          if (moveInput.promotion) promotion = moveInput.promotion;
          var movedObj = game.move({
            from: from,
            to: to,
            promotion: promotion
          });
          if (movedObj) return movedObj;
          if (!isDiceMode()) return null;
        } else {
          return null;
        }
        var vm = findGeometryMove(from, to, promotion);
        if (!vm) return null;
        return applyGeometryMove(vm);
      }

      function countKingsOnBoard() {
        var boardState = game.board();
        var w = 0;
        var b = 0;
        for (var r = 0; r < 8; r++) {
          for (var c = 0; c < 8; c++) {
            var p = boardState[r][c];
            if (!p || p.type !== "k") continue;
            if (p.color === "w") w++;
            else b++;
          }
        }
        return { w: w, b: b };
      }

      /**
       * After every ply: king missing, (classic) checkmate/stalemate, or draws.
       * Dice mode ignores FIDE checkmate/stalemate — geometry moves may still exist;
       * king capture remains the decisive check-like win.
       * Clears dice multi-move state. Returns true if play must stop.
       */
      function applyGameEndFromPosition() {
        var kings = countKingsOnBoard();
        if (kings.w < 1 || kings.b < 1) {
          gameOver = true;
          remainingDice = [];
          diceSide = null;
          var winnerColor = kings.w < 1 ? "b" : "w";
          var loserLabel = isMultiplayer() ? t("winnerOpp") : t("winnerBot");
          var winner = winnerColor === userColor ? t("winnerYou") : loserLabel;
          setStatus(t("kingCaptureWin").replace("{winner}", winner), "danger");
          $turnLabel.text(t("turnOver"));
          closeDiceTurnLogEntry();
          updateDiceUI();
          updateMoveList();
          return true;
        }

        // Dice: do not end on FIDE mate/stalemate (move gen ignores check).
        if (!isDiceMode()) {
          if (game.in_checkmate()) {
            gameOver = true;
            remainingDice = [];
            diceSide = null;
            var loserLabelMate = isMultiplayer() ? t("winnerOpp") : t("winnerBot");
            var wMate = game.turn() === userColor ? loserLabelMate : t("winnerYou");
            setStatus(t("checkmateWin").replace("{winner}", wMate), "danger");
            $turnLabel.text(t("turnOver"));
            updateDiceUI();
            return true;
          }

          if (game.in_stalemate()) {
            gameOver = true;
            remainingDice = [];
            diceSide = null;
            setStatus(t("stalemate"), "warn");
            $turnLabel.text(t("turnDraw"));
            updateDiceUI();
            return true;
          }
        }

        if (game.in_threefold_repetition()) {
          gameOver = true;
          remainingDice = [];
          diceSide = null;
          setStatus(t("drawRepetition"), "warn");
          $turnLabel.text(t("turnDraw"));
          closeDiceTurnLogEntry();
          updateDiceUI();
          updateMoveList();
          return true;
        }

        if (game.insufficient_material()) {
          gameOver = true;
          remainingDice = [];
          diceSide = null;
          setStatus(t("drawMaterial"), "warn");
          $turnLabel.text(t("turnDraw"));
          closeDiceTurnLogEntry();
          updateDiceUI();
          updateMoveList();
          return true;
        }

        // 50-move draw (halfmove clock) — valid in both modes; skip mate/stale via in_draw
        var halfMove = parseInt(game.fen().split(" ")[4], 10) || 0;
        if (halfMove >= 100) {
          gameOver = true;
          remainingDice = [];
          diceSide = null;
          setStatus(t("draw"), "warn");
          $turnLabel.text(t("turnDraw"));
          closeDiceTurnLogEntry();
          updateDiceUI();
          updateMoveList();
          return true;
        }

        if (!isDiceMode() && (game.in_draw() || game.game_over())) {
          gameOver = true;
          remainingDice = [];
          diceSide = null;
          setStatus(t("draw"), "warn");
          $turnLabel.text(t("turnDraw"));
          updateDiceUI();
          return true;
        }

        return false;
      }

      function getDiceFilteredMoves() {
        if (!isDiceMode()) return getModeMoves();
        if (!remainingDice.length) return [];
        var set = {};
        for (var i = 0; i < remainingDice.length; i++) set[remainingDice[i].type] = true;
        var all = getModeMoves();
        var out = [];
        for (var j = 0; j < all.length; j++) {
          if (set[all[j].piece]) out.push(all[j]);
        }
        return out;
      }

      function dieTypeRemaining(pieceType) {
        for (var i = 0; i < remainingDice.length; i++) {
          if (remainingDice[i].type === pieceType) return true;
        }
        return false;
      }

      /** May select/move this type only if it remains on dice AND has a geometry/legal move now. */
      function pieceAllowedByDice(pieceType) {
        if (!isDiceMode()) return true;
        return dieTypeRemaining(pieceType) && hasLegalForType(pieceType);
      }

      /** Force active color in FEN (for multi-move dice turns). Returns success. */
      function setSideToMove(color) {
        var parts = game.fen().split(" ");
        if (parts.length < 6) return false;
        var prev = parts[1];
        if (prev === color) return true;
        parts[1] = color;
        // EP square is only valid for the side that did not just double-push.
        // Clearing it lets chess.js accept a mid dice-turn side restore.
        parts[3] = "-";
        // chess.js increments fullmove when Black moves → White; undo that if restoring Black
        if (color === "b" && prev === "w") {
          var fm = parseInt(parts[5], 10) || 1;
          if (fm > 1) parts[5] = String(fm - 1);
        }
        var newFen = parts.join(" ");
        if (game.load(newFen)) return true;

        // chess.js rejects FEN when the side not to move is in check (common mid dice-turn).
        // Temporarily remove opponent king, load turn, put king back.
        var opp = color === "w" ? "b" : "w";
        var boardState = game.board();
        var files = "abcdefgh";
        var kingSq = null;
        var kingPiece = null;
        for (var r = 0; r < 8; r++) {
          for (var c = 0; c < 8; c++) {
            var p = boardState[r][c];
            if (p && p.type === "k" && p.color === opp) {
              kingSq = files[c] + (8 - r);
              kingPiece = { type: p.type, color: p.color };
            }
          }
        }
        if (!kingSq || !kingPiece) return false;
        game.remove(kingSq);
        var mid = game.fen().split(" ");
        mid[1] = color;
        mid[2] = parts[2];
        mid[3] = "-";
        mid[4] = parts[4];
        mid[5] = parts[5];
        var ok = game.load(mid.join(" "));
        if (ok) {
          game.put(kingPiece, kingSq);
          return game.turn() === color;
        }
        game.put(kingPiece, kingSq);
        return false;
      }

      /** Who is mid dice-turn (source of truth over chess.js turn while dice remain). */
      function isHumanDiceTurnActive() {
        return (
          isDiceMode() &&
          !gameOver &&
          diceSide === userColor &&
          remainingDice.length > 0
        );
      }

      function isBotDiceTurnActive() {
        return (
          isDiceMode() &&
          !gameOver &&
          diceSide &&
          diceSide !== userColor &&
          remainingDice.length > 0
        );
      }

      function botColor() {
        return userColor === "w" ? "b" : "w";
      }

      function userHasRemainingDice() {
        return isDiceMode() && diceSide === userColor && remainingDice.length > 0;
      }

      function cancelScheduledBot() {
        if (botTimerId != null) {
          clearTimeout(botTimerId);
          botTimerId = null;
        }
        botSchedGen += 1;
        if (typeof BoardHackStockfish !== "undefined") {
          BoardHackStockfish.cancelSearch();
        }
      }

      /** Sole entry to queue a bot turn; invalidates any prior timer. */
      function scheduleBot(delayMs) {
        if (isMultiplayer()) {
          cancelScheduledBot();
          return;
        }
        cancelScheduledBot();
        var gen = botSchedGen;
        botTimerId = window.setTimeout(function () {
          botTimerId = null;
          if (gen !== botSchedGen) return;
          makeBotMove();
        }, delayMs == null ? 250 : delayMs);
      }

      /**
       * Hard gate before starting (or continuing into) bot play.
       * alreadyThinking: true inside an in-progress botPly chain.
       */
      function canBotActNow(alreadyThinking) {
        if (isMultiplayer()) return false;
        if (gameOver) return false;
        if (!alreadyThinking && botThinking) return false;
        if (!alreadyThinking && selectedSquare) return false;
        if (isDiceMode()) {
          // Never while user still has unresolved dice
          if (userHasRemainingDice() || isHumanDiceTurnActive()) return false;
          if (diceSide === userColor) return false;
        }
        // Must be bot's side to move (classic + dice)
        if (game.turn() !== botColor()) return false;
        return true;
      }

      /** Pass the turn with no move (all dice skipped). */
      function passTurnNoMove() {
        var parts = game.fen().split(" ");
        if (parts.length < 6) return;
        var was = parts[1];
        parts[1] = was === "w" ? "b" : "w";
        parts[3] = "-";
        if (was === "b") {
          parts[5] = String((parseInt(parts[5], 10) || 1) + 1);
        }
        game.load(parts.join(" "));
      }

      function markRollStatus(value, type, status) {
        for (var i = 0; i < diceRoll.length; i++) {
          if (
            diceRoll[i].status === "pending" &&
            diceRoll[i].value === value &&
            diceRoll[i].type === type
          ) {
            diceRoll[i].status = status;
            return;
          }
        }
        // fallback: first pending of same type
        for (var j = 0; j < diceRoll.length; j++) {
          if (diceRoll[j].status === "pending" && diceRoll[j].type === type) {
            diceRoll[j].status = status;
            return;
          }
        }
      }

      function consumeDie(pieceType) {
        for (var i = 0; i < remainingDice.length; i++) {
          if (remainingDice[i].type === pieceType) {
            var die = remainingDice.splice(i, 1)[0];
            markRollStatus(die.value, die.type, "used");
            consecutiveSkipPasses = 0;
            return true;
          }
        }
        return false;
      }

      /**
       * Pass only when NO remaining die type has a geometry (dice) move right now.
       * Keep blocked types while at least one remaining type is playable
       * (e.g. pawn move may later free a bishop).
       * Returns true when this side's dice turn is over.
       */
      function endTurnIfNoPlayableDice(side) {
        if (!isDiceMode()) return true;

        if (remainingDice.length > 0 && getDiceFilteredMoves().length > 0) {
          // Some type is playable now — keep all remaining dice (including blocked)
          updateDiceUI();
          return false;
        }

        // Nothing playable among remaining (or no dice left) → skip leftovers and pass
        if (remainingDice.length > 0) {
          var names = [];
          for (var i = 0; i < remainingDice.length; i++) {
            names.push(pieceName(remainingDice[i].type));
            markRollStatus(remainingDice[i].value, remainingDice[i].type, "skipped");
          }
          lastSkipMsg = t("diceSkip").replace("{piece}", names.join(", "));
          remainingDice = [];
        }

        if (side && game.turn() === side) {
          passTurnNoMove();
        }
        diceSide = null;
        closeDiceTurnLogEntry();
        updateDiceUI();
        updateMoveList();
        return true;
      }

      function rollDiceForSide(side) {
        lastSkipMsg = "";
        if (!isDiceMode() || gameOver) {
          clearDiceState();
          return;
        }
        // Close previous turn log before overwriting diceRoll faces
        closeDiceTurnLogEntry();
        updateMoveList();
        diceSide = side;
        diceRoll = [];
        remainingDice = [];
        for (var i = 0; i < diceCount; i++) {
          var roll = 1 + Math.floor(Math.random() * 6);
          var pt = DICE_MAP[roll];
          var entry = { value: roll, type: pt, status: "pending" };
          diceRoll.push(entry);
          remainingDice.push({ value: roll, type: pt });
        }
        // Keep all dice on roll — even types with no legal move yet
        startDiceTurnLogEntry(side);
        updateDiceUI();
        noteDiceReveal();
      }

      function diceTurnComplete() {
        return !isDiceMode() || remainingDice.length === 0;
      }

      function setStatus(text, kind) {
        $statusText.text(text);
        $statusDot.removeClass("warn danger info");
        if (kind) $statusDot.addClass(kind);
      }

      function removeLegalHighlights() {
        $("#board .square-55d63").removeClass("legal-dot legal-capture");
      }

      var audioCtx = null;

      function getAudioCtx() {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") {
          try { audioCtx.resume(); } catch (e) {}
        }
        return audioCtx;
      }

      // Short wood-like thud: low thump + brief noise layer
      function playMoveSound() {
        try {
          var ctx = getAudioCtx();
          if (!ctx) return;
          var t0 = ctx.currentTime;
          var dur = 0.12;

          // Low wooden thump
          var osc = ctx.createOscillator();
          var oscGain = ctx.createGain();
          var oscFilter = ctx.createBiquadFilter();
          osc.type = "sine";
          osc.frequency.setValueAtTime(95, t0);
          osc.frequency.exponentialRampToValueAtTime(38, t0 + dur);
          oscFilter.type = "lowpass";
          oscFilter.frequency.setValueAtTime(280, t0);
          oscGain.gain.setValueAtTime(0.0001, t0);
          oscGain.gain.exponentialRampToValueAtTime(0.38, t0 + 0.006);
          oscGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(oscFilter);
          oscFilter.connect(oscGain);
          oscGain.connect(ctx.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.02);

          // Soft noise "wood contact" layer
          var nLen = Math.floor(ctx.sampleRate * 0.06);
          var buffer = ctx.createBuffer(1, nLen, ctx.sampleRate);
          var data = buffer.getChannelData(0);
          for (var i = 0; i < nLen; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nLen, 2.2);
          }
          var noise = ctx.createBufferSource();
          noise.buffer = buffer;
          var noiseFilter = ctx.createBiquadFilter();
          noiseFilter.type = "bandpass";
          noiseFilter.frequency.setValueAtTime(420, t0);
          noiseFilter.Q.setValueAtTime(0.9, t0);
          var noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.0001, t0);
          noiseGain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.004);
          noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.07);
          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(ctx.destination);
          noise.start(t0);
          noise.stop(t0 + 0.08);
        } catch (e) {}
      }

      function snapshotPush() {
        undoStack.push({
          fen: game.fen(),
          sans: plySans.slice(),
          diceRoll: cloneDiceList(diceRoll),
          remainingDice: cloneDiceList(remainingDice),
          diceSide: diceSide,
          lastSkipMsg: lastSkipMsg,
          diceTurnLog: cloneDiceTurnLog(diceTurnLog)
        });
      }

      function restoreSnapshot(s) {
        game.load(s.fen);
        plySans = s.sans.slice();
        diceRoll = s.diceRoll ? cloneDiceList(s.diceRoll) : [];
        remainingDice = s.remainingDice ? cloneDiceList(s.remainingDice) : [];
        diceSide = s.diceSide != null ? s.diceSide : null;
        lastSkipMsg = s.lastSkipMsg || "";
        diceTurnLog = s.diceTurnLog ? cloneDiceTurnLog(s.diceTurnLog) : [];
      }

      // chess.js move (O-O / O-O-O); dice may use geometry when in check/mate
      function tryMakeUserMove(from, to) {
        var piece = game.get(from);
        if (piece && !pieceAllowedByDice(piece.type)) return false;
        snapshotPush();
        var snap = undoStack[undoStack.length - 1];
        var move = applyGameMove({ from: from, to: to, promotion: "q" });
        if (move === null) {
          undoStack.pop();
          return false;
        }
        if (isDiceMode() && !dieTypeRemaining(move.piece)) {
          restoreSnapshot(snap);
          undoStack.pop();
          return false;
        }
        plySans.push(move.san);
        playMoveSound();
        if (isDiceMode()) {
          consumeDie(move.piece);
          appendDiceTurnPly(move.san, move.piece);
        }
        return true;
      }

      /**
       * After a successful user ply in dice mode: keep multi-moving or hand off to bot.
       * Returns true if the player's dice turn is finished (bot should play).
       */
      function afterUserDicePly() {
        // Always evaluate end first (classic + dice), before any multi-move restore
        if (applyGameEndFromPosition()) return true;
        if (!isDiceMode()) return true;

        if (remainingDice.length > 0) {
          diceSide = userColor;
          setSideToMove(userColor);
          // Pass only when none of the remaining types are playable right now
          if (endTurnIfNoPlayableDice(userColor)) return true;
          // Still human's dice turn — kill any pending bot kickoff
          cancelScheduledBot();
          updateDiceUI();
          return false;
        }
        diceSide = null;
        closeDiceTurnLogEntry();
        updateDiceUI();
        updateMoveList();
        return true;
      }

      function resolveDiceTurnAfterReveal(side) {
        if (!isDiceMode()) return true;
        if (endTurnIfNoPlayableDice(side)) {
          consecutiveSkipPasses++;
          return false;
        }
        consecutiveSkipPasses = 0;
        return true;
      }

      /**
       * Roll dice for side and show UI immediately.
       * opts.deferResolve: skip auto-pass so caller can wait ~750ms (dice reveal) first.
       */
      function beginDiceTurnFor(side, opts) {
        opts = opts || {};
        if (!isDiceMode()) {
          clearDiceState();
          return true; // ready to move (classic: single move)
        }
        if (game.turn() !== side) {
          setSideToMove(side);
        }
        rollDiceForSide(side);
        if (opts.deferResolve) return true;
        // If no remaining type has a geometry move, pass turn immediately
        if (endTurnIfNoPlayableDice(side)) {
          consecutiveSkipPasses++;
          return false;
        }
        consecutiveSkipPasses = 0;
        return true;
      }

      function showLegalMoves(fromSquare) {
        removeLegalHighlights();
        if (!fromSquare) return;
        var piece = game.get(fromSquare);
        if (piece && !pieceAllowedByDice(piece.type)) return;
        var moves = getModeMoves({ square: fromSquare });
        for (var i = 0; i < moves.length; i++) {
          var m = moves[i];
          if (!pieceAllowedByDice(m.piece)) continue;
          var $sq = $("#board .square-" + m.to);
          if (m.captured) {
            $sq.addClass("legal-capture");
          } else {
            $sq.addClass("legal-dot");
          }
        }
      }

      function clearSelection() {
        $("#board .square-55d63").removeClass("selected");
        removeLegalHighlights();
        selectedSquare = null;
      }

      function highlightSquare(sq) {
        clearSelection();
        if (!sq) return;
        selectedSquare = sq;
        $("#board .square-" + sq).addClass("selected");
        showLegalMoves(sq);
      }

      /** Prefer king capture, then any capture, else first geometry/legal move. */
      function pickDiceFallbackMove(moves) {
        if (!moves || !moves.length) return null;
        var i;
        for (i = 0; i < moves.length; i++) {
          if (moves[i].captured === "k") return moves[i];
        }
        for (i = 0; i < moves.length; i++) {
          if (moves[i].captured) return moves[i];
        }
        return moves[0];
      }

      function findBestMoveStockfish(done) {
        var pool = getDiceFilteredMoves();
        if (!pool.length) {
          done(null);
          return;
        }
        // Dice: king capture wins immediately — do not wait on Stockfish
        if (isDiceMode()) {
          for (var ki = 0; ki < pool.length; ki++) {
            if (pool[ki].captured === "k") {
              done(pool[ki]);
              return;
            }
          }
        }

        var fen = game.fen();
        var searchUci = null;
        var searchPool = pool;
        if (isDiceMode()) {
          // Stockfish only accepts FIDE-legal moves; geometry-only escapes stay local
          var fide = game.moves({ verbose: true });
          searchPool = [];
          searchUci = [];
          for (var i = 0; i < pool.length; i++) {
            var pm = pool[i];
            for (var f = 0; f < fide.length; f++) {
              var fm = fide[f];
              if (
                fm.from === pm.from &&
                fm.to === pm.to &&
                (!pm.promotion || fm.promotion === pm.promotion)
              ) {
                searchPool.push(pm);
                searchUci.push(BoardHackStockfish.moveToUci(pm));
                break;
              }
            }
          }
          if (!searchUci.length) {
            done(pickDiceFallbackMove(pool));
            return;
          }
        }
        var genAtStart = botSchedGen;
        BoardHackStockfish.getBestMove(fen, searchUci, getSkillKey())
          .then(function (uci) {
            if (genAtStart !== botSchedGen) {
              done(null);
              return;
            }
            var parsed = BoardHackStockfish.parseUci(uci);
            if (!parsed) {
              done(pickDiceFallbackMove(isDiceMode() ? pool : searchPool));
              return;
            }
            for (var j = 0; j < pool.length; j++) {
              var m = pool[j];
              if (m.from === parsed.from && m.to === parsed.to) {
                if (!parsed.promotion || m.promotion === parsed.promotion) {
                  done(m);
                  return;
                }
              }
            }
            // Fallback: try apply (dice geometry if needed)
            var tryMove = { from: parsed.from, to: parsed.to };
            if (parsed.promotion) tryMove.promotion = parsed.promotion;
            done(tryMove);
          })
          .catch(function (err) {
            if (genAtStart !== botSchedGen) {
              done(null);
              return;
            }
            if (err && err.message === "cancelled") {
              done(null);
              return;
            }
            console.warn("Stockfish search failed:", err && err.message ? err.message : err);
            done(pickDiceFallbackMove(isDiceMode() ? pool : searchPool));
          });
      }

      function dieFaceMiniHtml(d, side) {
        var colorChar = side || "w";
        var pieceCode = colorChar + String(d.type || "p").toUpperCase();
        var imgSrc = PIECE_THEME.replace("{piece}", pieceCode);
        var st = d.status || "pending";
        var cls = "hist-die hist-die-" + st;
        return (
          '<span class="' + cls + '" title="' + pieceName(d.type) + '">' +
          '<img src="' + imgSrc + '" alt="' + pieceName(d.type) + '" />' +
          "</span>"
        );
      }

      function updateMoveList() {
        if (isDiceMode()) {
          syncOpenDiceTurnFaces();
          var totalPlies = 0;
          for (var ti = 0; ti < diceTurnLog.length; ti++) {
            totalPlies += (diceTurnLog[ti].plies && diceTurnLog[ti].plies.length) || 0;
          }
          $moveCount.text(String(totalPlies));
          if (!diceTurnLog.length) {
            $moveList.html('<div class="empty-moves"></div>');
            $moveList.find(".empty-moves").text(t("emptyMoves"));
            return;
          }
          var html = "";
          var turnNum = 0;
          for (var i = 0; i < diceTurnLog.length; i++) {
            var entry = diceTurnLog[i];
            if (entry.side === "w") turnNum++;
            var sideLabel = entry.side === "w" ? t("histWhiteTurn") : t("histBlackTurn");
            var isOpp =
              (isMultiplayer() && entry.side !== userColor) ||
              (!isMultiplayer() && entry.side !== userColor);
            var diceHtml = "";
            for (var di = 0; di < (entry.dice || []).length; di++) {
              diceHtml += dieFaceMiniHtml(entry.dice[di], entry.side);
            }
            var body = "";
            if (entry.passed || !(entry.plies && entry.plies.length)) {
              if (entry.closed || entry.passed) {
                body = '<span class="hist-pass">' + t("histPass") + "</span>";
              } else {
                body = '<span class="hist-pass hist-pass-pending">…</span>';
              }
            } else {
              for (var pi = 0; pi < entry.plies.length; pi++) {
                var ply = entry.plies[pi];
                body +=
                  '<span class="hist-ply' + (isOpp ? " bot" : "") + '">' +
                  '<span class="hist-ply-idx">' + (pi + 1) + ".</span> " +
                  ply.san +
                  "</span>";
              }
            }
            html +=
              '<div class="hist-turn' + (isOpp ? " hist-turn-opp" : "") + (entry.closed ? "" : " hist-turn-open") + '">' +
              '<div class="hist-turn-head">' +
              '<span class="hist-turn-num">' + (entry.side === "w" ? turnNum + "." : "") + "</span>" +
              '<span class="hist-turn-side">' + sideLabel + "</span>" +
              '<span class="hist-turn-dice">' + diceHtml + "</span>" +
              "</div>" +
              '<div class="hist-turn-body">' + body + "</div>" +
              "</div>";
          }
          $moveList.html(html);
          $moveList.scrollTop($moveList[0].scrollHeight);
          return;
        }

        // Classic: plain SAN pair rows (unchanged)
        var history = plySans;
        $moveCount.text(String(history.length));
        if (!history.length) {
          $moveList.html('<div class="empty-moves"></div>');
          $moveList.find(".empty-moves").text(t("emptyMoves"));
          return;
        }
        var htmlC = "";
        for (var ci = 0; ci < history.length; ci += 2) {
          var num = Math.floor(ci / 2) + 1;
          var white = history[ci] ? history[ci] : "";
          var black = history[ci + 1] ? history[ci + 1] : "";
          htmlC +=
            '<div class="move-row">' +
            '<span class="move-num">' + num + ".</span>" +
            '<span class="move-san' + (userColor === "b" ? " bot" : "") + '">' + white + "</span>" +
            '<span class="move-san' + (userColor === "w" ? " bot" : "") + '">' + black + "</span>" +
            "</div>";
        }
        $moveList.html(htmlC);
        $moveList.scrollTop($moveList[0].scrollHeight);
      }

      function updateStatus() {
        updateOpponentLabel();
        $("#sideLabel").text(userColor === "w" ? t("sideWhite") : t("sideBlack"));

        if (applyGameEndFromPosition()) return;

        // During multi-move dice, diceSide + remainingDice own the turn UI
        var turnIsUser;
        if (isHumanDiceTurnActive()) {
          turnIsUser = true;
        } else if (isBotDiceTurnActive() || botThinking) {
          turnIsUser = false;
        } else {
          turnIsUser = game.turn() === userColor;
        }
