<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardHack — Atomic Chess</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
  <link rel="stylesheet" href="../../../css/boardhack.css" />
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a href="../../../">
          <div class="brand-mark">♞</div>
          <div>Board<span class="accent">Hack</span></div>
        </a>
        <span class="mode-badge" id="modeBadge">шахматы · атомные</span>
      </div>
      <div class="topbar-actions">
        <div class="settings-menu" id="settingsMenu">
          <button type="button" class="settings-menu-btn" id="settingsMenuBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsDialog" aria-label="Settings" title="Settings">
            <span aria-hidden="true">⚙</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="layout">
      <section class="card">
        <div class="card-title" id="playAreaTitle"></div>
        <div class="status-bar" id="statusBar">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText"></span>
        </div>
        <div class="board-wrap">
          <div id="board"></div>
          <div class="thinking" id="thinking"><div class="thinking-pill" id="thinkingText"></div></div>
        </div>
      </section>

      <aside class="side-stack">
        <section class="card">
          <div class="card-title" id="missionTitle"></div>
          <div class="controls">
            <div id="sideSelectWrap">
              <label class="field-label" for="sideSelect" id="sideSelectLabel"></label>
              <select id="sideSelect">
                <option value="w" selected></option>
                <option value="b"></option>
              </select>
            </div>
            <div id="difficultyWrap">
              <label class="field-label" for="difficulty" id="diffLabel"></label>
              <select id="difficulty">
                <option value="easy"></option>
                <option value="medium" selected></option>
                <option value="hard"></option>
                <option value="expert"></option>
                <option value="master"></option>
              </select>
            </div>
            <div class="btn-row">
              <button type="button" class="btn btn-primary" id="newGameBtn"></button>
              <button type="button" class="btn btn-ghost" id="undoBtn"></button>
              <button type="button" class="btn btn-ghost" id="rulesBtn"></button>
            </div>
          </div>
        </section>

<section class="card mp-card" id="mpCard">
          <div class="card-title" id="mpTitle">Мультиплеер</div>
          <div class="mp-conn" id="mpConnRow">
            <span class="mp-conn-dot" id="mpConnDot"></span>
            <span id="mpConnText">офлайн</span>
          </div>
          <div class="mp-nick-row" id="mpNickRow">
            <label class="field-label" for="mpNick" id="mpNickLabel">Ник</label>
            <input type="text" id="mpNick" maxlength="24" autocomplete="nickname" spellcheck="false" placeholder="" />
          </div>
          <div id="mpLobby">
            <div class="btn-row">
              <button type="button" class="btn btn-primary" id="mpCreateBtn">Создать комнату</button>
              <button type="button" class="btn btn-ghost" id="mpJoinToggleBtn">Войти</button>
              <button type="button" class="btn btn-ghost" id="mpSpectateToggleBtn">Наблюдать</button>
            </div>
            <div id="mpJoinPanel" class="mp-hidden" style="margin-top:0.65rem">
              <div class="mp-join-row">
                <input type="text" id="mpJoinCode" maxlength="8" autocomplete="off" spellcheck="false" placeholder="КОД" />
                <button type="button" class="btn btn-primary" id="mpJoinBtn">OK</button>
              </div>
            </div>
            <div id="mpSpectatePanel" class="mp-hidden" style="margin-top:0.65rem">
              <div class="mp-join-row">
                <input type="text" id="mpSpectateCode" maxlength="8" autocomplete="off" spellcheck="false" placeholder="КОД" />
                <button type="button" class="btn btn-primary" id="mpSpectateBtn">OK</button>
              </div>
            </div>
            <p class="mp-hint" id="mpHint">Пригласите друга по коду. Аккаунт не нужен.</p>
            <div class="mp-room-list" id="mpRoomListSection">
              <div class="mp-room-list-head">
                <span class="mp-room-list-title" id="mpRoomsTitle">Комнаты</span>
                <button type="button" class="btn btn-ghost mp-rooms-refresh" id="mpRoomsRefreshBtn">Обновить</button>
              </div>
              <div class="mp-rooms-list" id="mpRoomsList"></div>
              <p class="mp-hint" id="mpRoomsEmpty">Нет открытых комнат</p>
            </div>
          </div>
          <div id="mpActive" class="mp-hidden">
            <div class="mp-code-box">
              <div class="mp-code-label" id="mpCodeLabel">Код комнаты</div>
              <div class="mp-code-value" id="mpCodeValue">------</div>
              <div class="mp-share-link" id="mpShareLink"></div>
            </div>
            <div class="mp-seats">
              <div class="mp-seat" id="mpSeatW" role="button" tabindex="0">White — …</div>
              <div class="mp-seat" id="mpSeatB" role="button" tabindex="0">Black — …</div>
            </div>
            <p class="mp-seat-pick-hint mp-hidden" id="mpSeatPickHint"></p>
            <div class="btn-row">
              <button type="button" class="btn btn-ghost" id="mpCopyBtn">Копировать приглашение</button>
              <button type="button" class="btn btn-ghost" id="mpLeaveBtn">Выйти</button>
              <button type="button" class="btn btn-primary mp-hidden" id="mpResetBtn"></button>
            </div>
            <p class="mp-hint mp-hidden" id="mpSpectateBanner"></p>
            <p class="mp-copy-toast" id="mpCopyToast" role="status" aria-live="polite"></p>
            <p class="mp-hint" id="mpSpectatorCount"></p>
            <p class="mp-hint" id="mpActiveHint"></p>
          </div>
        </section>

        <section class="card">
          <div class="card-title" id="sessionTitle"></div>
          <div class="meta-grid">
            <div class="meta-item">
              <div class="k" id="metaSideK"></div>
              <div class="v" id="sideLabel"></div>
            </div>
            <div class="meta-item">
              <div class="k" id="metaTurnK"></div>
              <div class="v" id="turnLabel"></div>
            </div>
            <div class="meta-item">
              <div class="k" id="metaMovesK"></div>
              <div class="v" id="moveCount">0</div>
            </div>
            <div class="meta-item">
              <div class="k" id="metaBotK"></div>
              <div class="v" id="botLabel"></div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-title" id="historyTitle"></div>
          <div class="move-list" id="moveList"></div>
        </section>
      </aside>
    </div>
    <footer class="footer">BoardHack</footer>
  </main>

  <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="settings-dialog-head">
      <h2 class="card-title" id="settingsTitle">Settings</h2>
      <button type="button" class="settings-dialog-close" id="settingsCloseBtn" aria-label="Close">×</button>
    </div>
    <div class="settings-dialog-body">
      <div class="settings-menu-section">
        <div class="settings-menu-label" id="settingsLangLabel">Language</div>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" id="langRu" data-lang="ru">RU</button>
          <span class="lang-sep">|</span>
          <button type="button" id="langEn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="rules-dialog" id="rulesDialog" aria-labelledby="rulesTitle">
    <div class="rules-dialog-head">
      <h2 class="card-title" id="rulesTitle"></h2>
      <button type="button" class="rules-dialog-close" id="rulesCloseBtn" aria-label="Close">×</button>
    </div>
    <div class="rules-box" id="rulesBox"></div>
  </dialog>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="../../../js/i18n.js?v=20261003a"></script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="../../../js/atomic-chess.js?v=20260929-atomic2"></script>
  <script src="../../../js/drag-scroll-lock.js"></script>
  <script src="../../../js/board-context-guard.js"></script>
  <script>
    (function () {
      try {
        var u = new URL(window.location.href);
        if (/\/index\.html$/i.test(u.pathname)) {
          u.pathname = u.pathname.replace(/\/index\.html$/i, "/");
          history.replaceState(null, "", u.pathname + u.search + u.hash);
        }
      } catch (e) {}
    })();

    (function () {
      "use strict";
      var GAME_MODE = "atomic";

      function isDiceMode() { return false; }
      function updateDiceUI() {}
      function beginDiceTurnFor(side) { return true; }
      function clearDiceState() {}

      var COLOR_KEY = "boardhack-atomic-color";

                  var i18nReady = BoardHackI18n.init({ page: "chess/atomic", base: "../../../locales" });
      var lang = BoardHackI18n.getLang();

      function t(key) {
        return BoardHackI18n.t(key);
      }

var START_FEN = BoardHackAtomic.START_FEN;
      var START_POSITION = "start";
      var PIECE_THEME =
        "https://cdn.jsdelivr.net/gh/oakmac/chessboardjs@master/website/img/chesspieces/wikipedia/{piece}.png";

      var game = BoardHackAtomic.createGame(START_FEN);
      var board = null;
      var userColor = "w";
      try {
        var savedColor = localStorage.getItem(COLOR_KEY);
        if (savedColor === "w" || savedColor === "b") userColor = savedColor;
      } catch (e) {}
      var selectedSquare = null;
      var gameOver = false;
      var botThinking = false;
      var botTimerId = null;
      var botSchedGen = 0;
      var undoStack = [];
      var plySans = [];

      var $statusText = $("#statusText");
      var $statusDot = $("#statusDot");
      var $thinking = $("#thinking");
      var $moveList = $("#moveList");
      var $moveCount = $("#moveCount");
      var $turnLabel = $("#turnLabel");
      var $botLabel = $("#botLabel");

var CLIENT_ID_KEY = "boardhack-client-id";
      var MP_ROOM_KEY = "boardhack-mp-room-atomic";
      var mpActive = false;
      var mpSocket = null;
      var mpRoomCode = null;
      var mpSeat = null;
      var mpRoom = null;
      var mpConnState = "offline"; // offline|connecting|connected|waiting|playing|error
      var mpApplyingRemote = false;

      var NICK_KEY = "boardhack-nick";
      var mpSpectating = false;

      function sanitizeNickClient(raw) {
        return String(raw == null ? "" : raw)
          .replace(/[\u0000-\u001f\u007f]/g, "")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 24);
      }

      function getNick() {
        var el = document.getElementById("mpNick");
        var n = sanitizeNickClient(el ? el.value : "");
        if (!n) {
          try { n = sanitizeNickClient(localStorage.getItem(NICK_KEY) || ""); } catch (e) {}
        }
        if (el && el.value !== n) el.value = n;
        try { if (n) localStorage.setItem(NICK_KEY, n); } catch (e) {}
        return n;
      }

      function loadNickIntoInput() {
        var el = document.getElementById("mpNick");
        if (!el) return;
        try {
          var saved = sanitizeNickClient(localStorage.getItem(NICK_KEY) || "");
          if (saved && !el.value) el.value = saved;
        } catch (e) {}
        el.setAttribute("placeholder", t("mpNickPlaceholder"));
      }

      function persistNickFromInput() {
        var el = document.getElementById("mpNick");
        if (!el) return;
        var n = sanitizeNickClient(el.value);
        el.value = n;
        try { localStorage.setItem(NICK_KEY, n); } catch (e) {}
      }

      var mpServerUrl = "https://chessboard-ulhg.onrender.com";

      function getOrCreateClientId() {
        var id = null;
        try { id = localStorage.getItem(CLIENT_ID_KEY); } catch (e) {}
        if (!id || id.length < 8) {
          id = "c_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
          try { localStorage.setItem(CLIENT_ID_KEY, id); } catch (e) {}
        }
        return id;
      }

      function resolveServerUrl() {
        var params = new URLSearchParams(window.location.search);
        var s = params.get("server");
        if (s) {
          s = s.trim();
          if (s.indexOf("://") === -1) s = "http://" + s;
          return s.replace(/\/$/, "");
        }
        return "https://chessboard-ulhg.onrender.com";
      }

      function isMultiplayer() {
        return mpActive && (!!mpSeat || mpSpectating);
      }
      function isSpectating() {
        return mpActive && mpSpectating;
      }
      function canMpAct() {
        return mpActive && !!mpSeat && !mpSpectating;
      }

      function mpOpponentConnected() {
        if (!mpRoom || !mpRoom.seats) return false;
        var other = mpSeat === "w" ? "b" : "w";
        var s = mpRoom.seats[other];
        return !!(s && s.occupied && s.connected);
      }

      function mpBothSeated() {
        if (!mpRoom || !mpRoom.seats) return false;
        return !!(mpRoom.seats.w && mpRoom.seats.w.occupied && mpRoom.seats.b && mpRoom.seats.b.occupied);
      }

      function buildShareLink(code) {
        var u = new URL(window.location.href);
        if (/\/index\.html$/i.test(u.pathname)) {
          u.pathname = u.pathname.replace(/\/index\.html$/i, "/");
        }

        u.searchParams.delete("room");
        u.searchParams.delete("join");
        u.searchParams.delete("spectate");
        if (mpBothSeated()) {
          u.searchParams.set("spectate", code);
        } else {
          u.searchParams.set("join", code);
        }
        if (mpServerUrl && mpServerUrl !== "https://chessboard-ulhg.onrender.com") {
          u.searchParams.set("server", mpServerUrl);
        } else {
          u.searchParams.delete("server");
        }
        return u.toString();
      }
      function copyBtnLabel() {
        return mpBothSeated() ? t("mpCopySpectate") : t("mpCopyInvite");
      }


      function setMpConn(state, detail) {
        mpConnState = state;
        var $dot = $("#mpConnDot");
        $dot.removeClass("online waiting offline error");
        var label = t("mpOffline");
        if (state === "connecting") { $dot.addClass("waiting"); label = t("mpConnecting"); }
        else if (state === "connected") { $dot.addClass("online"); label = t("mpConnected"); }
        else if (state === "waiting") { $dot.addClass("waiting"); label = t("mpWaiting"); }
        else if (state === "playing") { $dot.addClass("online"); label = t("mpPlaying"); }
        else if (state === "error") { $dot.addClass("error"); label = detail || t("mpError"); }
        else { $dot.addClass("offline"); label = t("mpOffline"); }
        $("#mpConnText").text(label);
      }

      function displayNickOrStub(raw) {
        var nick = sanitizeNickClient(raw || "");
        return nick || t("mpPlayerStub");
      }

      function roomListSeatText(raw) {
        // null/undefined => empty seat; string (incl. "") => occupied
        if (raw == null) return t("mpSeatEmpty");
        return displayNickOrStub(raw);
      }

      function seatLabel(color) {
        if (!mpRoom || !mpRoom.seats) return t("mpSeatEmpty");
        var s = mpRoom.seats[color];
        if (!s || !s.occupied) return t("mpSeatEmpty");
        var nick = displayNickOrStub(s.nick || "");
        if (mpSeat === color) return nick + " (" + t("mpSeatYou") + ")";
        if (!s.connected) return nick + " (" + t("mpSeatOffline") + ")";
        return nick;
      }


      function mpAloneCanSwitch() {
        if (!isMultiplayer() || !mpRoom || !mpRoom.seats || !mpSeat) return false;
        if (mpBothSeated()) return false;
        var wOcc = !!(mpRoom.seats.w && mpRoom.seats.w.occupied);
        var bOcc = !!(mpRoom.seats.b && mpRoom.seats.b.occupied);
        return (wOcc ? 1 : 0) + (bOcc ? 1 : 0) === 1;
      }

      function claimMpSeat(color) {
        color = color === "b" ? "b" : "w";
        if (!mpAloneCanSwitch() || !mpSocket || !mpRoomCode) return;
        if (color === mpSeat) return;
        mpSocket.emit(
          "claimSeat",
          { clientId: getOrCreateClientId(), code: mpRoomCode, seat: color },
          function (res) {
            if (!res || !res.ok) {
              if (res && res.error === "seats_locked") return;
              setMpConn("error", (res && res.error) || t("mpError"));
              return;
            }
            applyMpRoom(res);
          }
        );
      }

      function updateMpUI() {
        $("#mpTitle").text(t("mpTitle"));
        $("#missionTitle").closest("section.card").toggleClass("mp-hidden", isMultiplayer());
        $("#mpResetBtn").toggleClass("mp-hidden", !canMpAct() || !mpRoom || mpRoom.hostId !== getOrCreateClientId());
        if (!mpActive) {
          $("#mpLobby").removeClass("mp-hidden");
          $("#mpActive").addClass("mp-hidden");
          $("#sideSelectWrap").removeClass("mp-hidden");
          $("#difficultyWrap").removeClass("mp-hidden");
          $("#sideSelect").prop("disabled", false);
          $("#difficulty").prop("disabled", false);
          $(".sp-disabled-note").remove();
          $("#mpRoomsTitle").text(t("mpRooms"));
          $("#mpRoomsRefreshBtn").text(t("mpRoomsRefresh"));
          startRoomListPolling();
          return;
        }
        stopRoomListPolling();
        $("#mpLobby").addClass("mp-hidden");
        $("#mpActive").removeClass("mp-hidden");
        // Hide single-player controls before rendering room details.
        $("#sideSelectWrap").addClass("mp-hidden");
        $("#difficultyWrap").addClass("mp-hidden");
        $("#mpCodeValue").text(mpRoomCode || "------");
        $("#mpShareLink").text(mpRoomCode ? buildShareLink(mpRoomCode) : "");
        $("#mpCopyBtn").text(mpRoomCode ? copyBtnLabel() : t("mpCopyInvite"));
        var canPick = mpAloneCanSwitch();
        $("#mpSeatW")
          .text(t("sideWhite") + " — " + seatLabel("w"))
          .toggleClass("you", mpSeat === "w")
          .toggleClass("filled", !!(mpRoom && mpRoom.seats.w && mpRoom.seats.w.occupied))
          .toggleClass("pickable", canPick && mpSeat !== "w")
          .attr("aria-disabled", canPick ? "false" : "true");
        $("#mpSeatB")
          .text(t("sideBlack") + " — " + seatLabel("b"))
          .toggleClass("you", mpSeat === "b")
          .toggleClass("filled", !!(mpRoom && mpRoom.seats.b && mpRoom.seats.b.occupied))
          .toggleClass("pickable", canPick && mpSeat !== "b")
          .attr("aria-disabled", canPick ? "false" : "true");
        if (canPick) {
          $("#mpSeatPickHint").removeClass("mp-hidden").text(t("mpSeatPickHint"));
        } else {
          $("#mpSeatPickHint").addClass("mp-hidden").text("");
        }
        var bothSeated = mpBothSeated();
        $("#mpActiveHint").toggleClass("mp-hidden", bothSeated).text(bothSeated ? "" : t("mpWaitingHint"));
        $("#sideSelect").prop("disabled", true);
        $("#difficulty").prop("disabled", true);
        $(".sp-disabled-note").remove();
        $("#sideSelect").val(userColor);
        $("#sideLabel").text(userColor === "w" ? t("sideWhite") : t("sideBlack"));
        var specN = (mpRoom && typeof mpRoom.spectatorCount === "number") ? mpRoom.spectatorCount : 0;
        if (specN > 0) {
          $("#mpSpectatorCount").removeClass("mp-hidden").text(t("mpSpectatorCount").replace("{n}", String(specN)));
        } else {
          $("#mpSpectatorCount").addClass("mp-hidden").text("");
        }
        if (mpSpectating) {
          $("#mpSpectateBanner").removeClass("mp-hidden").text(t("mpYouSpectate"));
        } else {
          $("#mpSpectateBanner").addClass("mp-hidden").text("");
        }
        updateOpponentLabel();
      }

      function ensureMpSocket(cb) {
        mpServerUrl = resolveServerUrl();
        if (mpSocket && mpSocket.connected) {
          if (cb) cb(null);
          return;
        }
        if (typeof io === "undefined") {
          setMpConn("error", t("mpError"));
          if (cb) cb(new Error("socket.io missing"));
          return;
        }
        setMpConn("connecting");
        if (mpSocket) {
          try { mpSocket.removeAllListeners(); mpSocket.disconnect(); } catch (e) {}
          mpSocket = null;
        }
        mpSocket = io(mpServerUrl, {
          transports: ["websocket", "polling"],
          reconnection: true,
          reconnectionAttempts: 12,
          timeout: 8000
        });
        mpSocket.on("connect", function () {
          setMpConn(mpBothSeated() ? "playing" : (mpActive ? "waiting" : "connected"));
          if (mpActive && mpRoomCode) {
            mpSocket.emit("reconnectRoom", { clientId: getOrCreateClientId(), code: mpRoomCode, nick: getNick() }, function (res) {
              if (res && res.ok) applyMpRoom(res);
            });
          } else if (!mpActive) {
            requestRoomList();
          }
          if (cb) { var f = cb; cb = null; f(null); }
        });
        mpSocket.on("connect_error", function () {
          setMpConn("error", t("mpError"));
          if (cb) { var f = cb; cb = null; f(new Error("connect_error")); }
        });
        mpSocket.on("disconnect", function () {
          if (mpActive) setMpConn("error", t("mpError"));
          else setMpConn("offline");
        });
        mpSocket.on("roomState", function (msg) {
          if (msg && msg.room) applyMpRoom({ room: msg.room, seat: msg.room.yourSeat || mpSeat, code: msg.room.code });
        });
        mpSocket.on("moveApplied", function (msg) {
          if (!mpActive || !msg) return;
          if (msg.by === mpSeat && !mpApplyingRemote) {
            // echo of our own move — still sync fen if needed
            if (msg.fen && msg.fen !== game.fen()) applyRemotePosition(msg);
            return;
          }
          applyRemotePosition(msg);
        });
        mpSocket.on("gameReset", function (msg) {
          if (!mpActive) return;
          if (msg && msg.room) applyMpRoom({ room: msg.room, seat: mpSeat, code: mpRoomCode });
          syncBoardFromMpRoom(true);
        });
        mpSocket.on("opponentJoined", function () { updateMpUI(); updateStatus(); });
        mpSocket.on("roomEnded", function () {
          if (typeof clearMpSession === "function") clearMpSession(false);
          else {
            mpActive = false; mpSpectating = false; mpRoomCode = null; mpSeat = null; mpRoom = null;
            try { localStorage.removeItem(MP_ROOM_KEY); } catch (e) {}
            setMpConn("offline");
            if (typeof updateMpUI === "function") updateMpUI();
          }
          if (typeof updateStatus === "function") updateStatus();
        });
        mpSocket.on("opponentLeft", function () {
          if (typeof promoteMpToLocalBot === "function" && promoteMpToLocalBot()) return;
          setMpConn("waiting");
          updateMpUI();
          updateStatus();
        });
        mpSocket.on("opponentDisconnected", function () {
          setMpConn("waiting");
          updateMpUI();
          updateStatus();
        });
        mpSocket.on("opponentReconnected", function () {
          setMpConn(mpBothSeated() ? "playing" : "waiting");
          updateMpUI();
          updateStatus();
        });
        mpSocket.on("roomList", function (msg) {
          if (msg && Array.isArray(msg.rooms) && (!msg.mode || msg.mode === GAME_MODE)) {
            renderRoomList(msg.rooms);
          }
        });
      }

      function applyMpRoom(res) {
        if (!res) return;
        if (res.room) mpRoom = res.room;
        if (res.code) mpRoomCode = res.code;
        var role = res.role || (res.room && res.room.yourRole) || null;
        if (role === "spectator" || res.role === "spectator") {
          mpSpectating = true;
          mpSeat = null;
        } else if (res.seat) {
          mpSpectating = false;
          mpSeat = res.seat;
          userColor = res.seat;
          saveUserColor();
        } else if (res.room && res.room.yourSeat) {
          mpSpectating = false;
          mpSeat = res.room.yourSeat;
          userColor = mpSeat;
          saveUserColor();
        } else {
          mpSpectating = false;
        }
        mpActive = true;
        try { localStorage.setItem(MP_ROOM_KEY, mpRoomCode); } catch (e) {}
        if (!mpSpectating && plySans.length > 0 && mpRoom && mpRoom.seats) {
          var otherSeatColor = mpSeat === "w" ? "b" : "w";
          var otherSeatObj = mpRoom.seats[otherSeatColor];
          if (!otherSeatObj || !otherSeatObj.occupied) {
            if (typeof promoteMpToLocalBot === "function" && promoteMpToLocalBot()) return;
          }
        }
        if (mpBothSeated()) setMpConn("playing");
        else setMpConn("waiting");
        updateMpUI();
        cancelScheduledBot();
        botThinking = false;
        $thinking.removeClass("show");
        if (board) {
          board.orientation(boardOrientation());
        }
        syncBoardFromMpRoom(false);
        updateStatus();
      }

      function syncBoardFromMpRoom(forceReset) {
        if (!mpRoom) return;
        var fen = mpRoom.fen || START_FEN;
        if (forceReset || game.fen() !== fen) {
          game.load(fen);
          if (Array.isArray(mpRoom.plySans)) plySans = mpRoom.plySans.slice();
          gameOver = false;
          if (board) board.position(game.fen(), false);
          clearSelection();
          updateMoveList();
        }
        applyGameEndFromPosition();
      }

      function applyRemotePosition(msg) {
        mpApplyingRemote = true;
        try {
          if (msg.fen) game.load(msg.fen);
          if (Array.isArray(msg.plySans)) plySans = msg.plySans.slice();
          else if (msg.move && msg.move.san && plySans[plySans.length - 1] !== msg.move.san) {
            plySans.push(msg.move.san);
          }
          playMoveSound();
          if (board) board.position(game.fen());
          clearSelection();
          updateMoveList();
          if (msg.status === "finished" || applyGameEndFromPosition()) {
            /* status updated inside */
          } else {
            updateStatus();
          }
          if (mpRoom) {
            mpRoom.fen = msg.fen || mpRoom.fen;
            mpRoom.plySans = plySans.slice();
            mpRoom.lastMove = msg.move || mpRoom.lastMove;
            if (msg.status) mpRoom.status = msg.status;
          }
        } finally {
          mpApplyingRemote = false;
        }
      }


      var mpRoomListTimer = null;
      var mpLastRoomList = [];

      function requestRoomList() {
        if (mpActive) return;
        if (!mpSocket || !mpSocket.connected) return;
        mpSocket.emit("listRooms", { mode: GAME_MODE }, function (res) {

          requestRoomList();

            if (!mpActive) requestRoomList();
          }, 6000);
        });

      function stopRoomListPolling() {
        if (mpRoomListTimer) {
          clearInterval(mpRoomListTimer);
          mpRoomListTimer = null;

      function renderRoomList(rooms) {
        mpLastRoomList = Array.isArray(rooms) ? rooms : [];

      function enterMpFromCreate() {
        persistNickFromInput();
        ensureMpSocket(function (err) {

          mpSocket.emit(

      function enterMpFromJoin(code) {

        persistNickFromInput();
        ensureMpSocket(function (err) {

                if (errKey === "room_not_found") msg = t("mpNotFound");

                setMpConn("error", msg);
                return;

              applyMpRoom(res);

      function clearMpSession(disconnectSocket) {
        mpActive = false;
        mpSpectating = false;
        mpRoomCode = null;
        mpSeat = null;
        mpRoom = null;
        try { localStorage.removeItem(MP_ROOM_KEY); } catch (e) {}
        if (disconnectSocket && mpSocket) {

        // restore single-player (also refreshes status bar to local turn text)
        newGame();

      /** Opponent left mid-game: keep position and continue vs Stockfish. */
      function promoteMpToLocalBot() {
        if (!mpActive || mpSpectating) return false;
        if (gameOver) return false;
        var midGame = plySans.length > 0 || (mpRoom && mpRoom.status === "playing");
        if (!midGame) return false;
        var keptSeat = mpSeat || userColor || "w";
        var fen = game.fen();
        var keptPly = plySans.slice();
        var keptUndo = undoStack.slice();
        var keptDiceRoll = typeof diceRoll !== "undefined" ? diceRoll.slice() : [];
        var keptRemaining = typeof remainingDice !== "undefined" ? remainingDice.slice() : [];
        var keptDiceSide = typeof diceSide !== "undefined" ? diceSide : null;
        if (mpSocket && mpRoomCode) {
          try { mpSocket.emit("leaveRoom", { clientId: getOrCreateClientId(), code: mpRoomCode, nick: getNick() }); } catch (e) {}
        }
        clearMpSession(true);
        userColor = keptSeat === "b" ? "b" : "w";
        try { localStorage.setItem(COLOR_KEY, userColor); } catch (e) {}
        game.load(fen);
        plySans = keptPly;
        undoStack = keptUndo;
        if (typeof diceRoll !== "undefined") {
          diceRoll = keptDiceRoll;
          remainingDice = keptRemaining;
          diceSide = keptDiceSide;
        }
        gameOver = false;
        botThinking = false;
        $thinking.removeClass("show");
        if (board) {
          board.orientation(boardOrientation());
          board.position(game.fen(), false);
        }
        updateMoveList();
        if (typeof updateDiceUI === "function") updateDiceUI();
        setStatus(t("mpContinueBot"), "warn");
        updateOpponentLabel();
        if (!gameOver && game.turn() !== userColor) {
          scheduleBot(450);
        } else {
          updateStatus();
        }
        return true;
      }

      function publishMpMove(from, to, san, promotion) {
        if (!canMpAct() || !mpSocket) return;
        mpSocket.emit("makeMove", {
          clientId: getOrCreateClientId(),
          code: mpRoomCode,
          from: from,
          to: to,
          promotion: promotion || null,
          fen: game.fen(),
          san: san,
          plySans: plySans.slice(),
          gameOver: !!gameOver
        });
        if (mpRoom) {
          mpRoom.fen = game.fen();
          mpRoom.plySans = plySans.slice();
          mpRoom.lastMove = { from: from, to: to, san: san, color: mpSeat };
        }
      }

      function tryAutoRejoin() {
        var params = new URLSearchParams(window.location.search);
        var roomParam = params.get("join") || params.get("room");
        var spectateParam = params.get("spectate");
        if (spectateParam) {
          enterMpFromSpectate(spectateParam);
          return;
        }
        var saved = null;
        try { saved = localStorage.getItem(MP_ROOM_KEY); } catch (e) {}
        var code = (roomParam || saved || "").toUpperCase().trim();
        if (!code) return;
        ensureMpSocket(function (err) {
          if (err) return;
          mpSocket.emit(
            "reconnectRoom",
            { clientId: getOrCreateClientId(), code: code, nick: getNick() },
            function (res) {
              if (res && res.ok) {
                applyMpRoom(res);
                return;
              }
              // fall back to join if seat not claimed yet
              mpSocket.emit(
                "joinRoom",
                { clientId: getOrCreateClientId(), code: code, nick: getNick() },
                function (res2) {
                  if (res2 && res2.ok) applyMpRoom(res2);
                  else if (roomParam) setMpConn("error", t("mpNotFound"));
                }
              );
            }
          );
        });
      }

      function cancelScheduledBot() {
        if (botTimerId != null) {
          clearTimeout(botTimerId);

      function scheduleBot(delayMs) {
        cancelScheduledBot();
        var gen = botSchedGen;

          botTimerId = null;

          makeBotMove();
        }, delayMs == null ? 250 : delayMs);

      function canBotActNow(alreadyThinking) {
        if (typeof isMultiplayer === "function" && isMultiplayer()) return false;
        if (gameOver) return false;
        if (!alreadyThinking && botThinking) return false;

      var audioCtx = null;
      function getAudioCtx() {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") {
          try { audioCtx.resume(); } catch (e) {}
        }
        return audioCtx;
      }

      function playMoveSound() {
        try {
          var ctx = getAudioCtx();
          if (!ctx) return;
          var t0 = ctx.currentTime;
          var dur = 0.12;
          var osc = ctx.createOscillator();
          var oscGain = ctx.createGain();
          var oscFilter = ctx.createBiquadFilter();
          osc.type = "sine";
          osc.frequency.setValueAtTime(95, t0);
          osc.frequency.exponentialRampToValueAtTime(38, t0 + dur);
          oscFilter.type = "lowpass";
          oscFilter.frequency.setValueAtTime(280, t0);
          oscGain.gain.setValueAtTime(0.0001, t0);
          oscGain.gain.exponentialRampToValueAtTime(0.38, t0 + 0.006);
          oscGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(oscFilter);
          oscFilter.connect(oscGain);
          oscGain.connect(ctx.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.02);
        } catch (e) {}
      }

      function snapshotPush() {
        undoStack.push(game.snapshot());
      }

      function tryMakeUserMove(from, to) {
        if (!from || !to || to === "offboard" || from === to) return null;
        snapshotPush();
        var piece = game.get(from);
        var opts = { from: from, to: to };
        if (piece && piece.type === "p") {
          var rank = to.charAt(1);
          if (rank === "8" || rank === "1") opts.promotion = "q";
        }
        var moved = game.move(opts);
        if (!moved) {
          undoStack.pop();
          return null;
        }
        plySans.push(moved.san);
        playMoveSound();
        return moved;
      }

      function syncBoard(useAnimation) {
        if (!board) return;

      function applyGameEndFromPosition() {
        var w = game.king_exploded_winner();
        if (w) {
          gameOver = true;
          var loserLabel = (typeof isMultiplayer === "function" && isMultiplayer()) ? t("winnerOpp") : t("winnerBot");
          var winner = w === userColor ? t("winnerYou") : loserLabel;
          setStatus(t("explodeWin").replace("{winner}", winner), "danger");
          $turnLabel.text(t("turnOver"));
          return true;
        }
        if (game.in_checkmate()) {
          gameOver = true;
          var loserLabel = (typeof isMultiplayer === "function" && isMultiplayer()) ? t("winnerOpp") : t("winnerBot");
          var wMate = game.turn() === userColor ? loserLabel : t("winnerYou");
          setStatus(t("checkmateWin").replace("{winner}", wMate), "danger");
          $turnLabel.text(t("turnOver"));
          return true;
        }
        if (game.in_stalemate()) {
          gameOver = true;
          setStatus(t("stalemate"), "warn");
          $turnLabel.text(t("turnDraw"));
          return true;
        }
        if (game.game_over()) {
          gameOver = true;
          setStatus(t("draw"), "warn");
          $turnLabel.text(t("turnDraw"));
          return true;
        }
        return false;
      }

      function updateMoveList() {
        var history = plySans;
        $moveCount.text(String(history.length));
        if (!history.length) {
          $moveList.html('<div class="empty-moves"></div>');
          $moveList.find(".empty-moves").text(t("emptyMoves"));
          return;
        }
        var html = "";
        for (var i = 0; i < history.length; i += 2) {
          var num = Math.floor(i / 2) + 1;
          var white = history[i] ? history[i] : "";
          var black = history[i + 1] ? history[i + 1] : "";
          html +=
            '<div class="move-row">' +
            '<span class="move-num">' + num + ".</span>" +
            '<span class="move-san' + (userColor === "b" ? " bot" : "") + '">' + white + "</span>" +
            '<span class="move-san' + (userColor === "w" ? " bot" : "") + '">' + black + "</span>" +
            "</div>";
        }
        $moveList.html(html);
        $moveList.scrollTop($moveList[0].scrollHeight);
      }

      function updateStatus() {
        updateOpponentLabel();
        $("#sideLabel").text(userColor === "w" ? t("sideWhite") : t("sideBlack"));
        if (applyGameEndFromPosition()) return;
        if (typeof isMultiplayer === "function" && isMultiplayer()) {
          if (mpSpectating) {
            $turnLabel.text(game.turn() === "w" ? t("turnWhite") : t("turnBlack"));
            setStatus(t("mpSpectating"), "info");
            return;
          }
          if (!mpBothSeated()) {
            $turnLabel.text(t("mpWaiting"));
            setStatus(t("mpWaitingHint"), "warn");
            return;
          }
          var myTurn = game.turn() === (mpSeat || userColor);
          if (myTurn) {
            $turnLabel.text(t("turnYou"));
            if (game.in_check()) setStatus(t("checkYou"), "warn");
            else setStatus(t("mpYourTurn"), null);
          } else {
            $turnLabel.text(t("turnOpponent"));
            setStatus(t("mpOppTurn"), "info");
          }
          return;
        }
        var turnIsUser = botThinking ? false : (game.turn() === userColor);
        if (turnIsUser) {
          $turnLabel.text(t("turnYou"));
          if (game.in_check() && game.turn() === userColor) setStatus(t("checkYou"), "warn");
          else setStatus(t("yourMove"), null);
        } else {
          $turnLabel.text(t("turnBot"));
          if (game.in_check() && game.turn() !== userColor) setStatus(t("botInCheck"), "info");
          else setStatus(t("botThinking"), "info");
        }
      }

      function finishBotThinking() {
        botThinking = false;
        $thinking.removeClass("show");
        $("#undoBtn").prop("disabled", false);
        clearSelection();
        updateMoveList();
        updateStatus();
      }

      function startUserTurnAfterBot() {
        finishBotThinking();
        cancelScheduledBot();
        if (gameOver || applyGameEndFromPosition()) return;
        if (game.turn() !== userColor) {
          if (canBotActNow(false)) scheduleBot(80);
          return;
        }
        updateStatus();
      }

      function pickBotMove() {
        var depth = (BoardHackAtomic.DEPTHS && BoardHackAtomic.DEPTHS[getSkillKey()]) || 2;
        var skill = getSkillKey();
        var moves = game.moves({ verbose: true });
        if (!moves.length) return null;
        // Easy: often random
        if (skill === "easy" && Math.random() < 0.55) {
          return moves[Math.floor(Math.random() * moves.length)];
        }
        var result = game.searchBest(depth, botColor());
        if (!result || !result.move) {
          return moves[Math.floor(Math.random() * moves.length)];
        }
        // Medium: occasionally blunder to random legal
        if (skill === "medium" && Math.random() < 0.2) {
          return moves[Math.floor(Math.random() * moves.length)];
        }
        return result.move;
      }

      function makeBotMove() {
        if (gameOver || applyGameEndFromPosition()) return;
        if (botThinking) return;
        if (selectedSquare) { updateStatus(); return; }
        if (game.turn() !== botColor()) { updateStatus(); return; }
        if (!canBotActNow(false)) { updateStatus(); return; }

        botThinking = true;
        $("#thinkingText").text(t("thinking"));
        $thinking.addClass("show");
        $("#undoBtn").prop("disabled", true);
        updateStatus();

        var genAtStart = botSchedGen;
        window.setTimeout(function () {
          if (genAtStart !== botSchedGen) { finishBotThinking(); return; }
          try {
            var best = pickBotMove();
            if (!best) { startUserTurnAfterBot(); return; }
            snapshotPush();
            var botOpts = { from: best.from, to: best.to };
            if (best.promotion) botOpts.promotion = best.promotion;
            var moved = game.move(botOpts);
            if (moved) {
              plySans.push(moved.san);
              playMoveSound();
              syncBoard(false);
              updateMoveList();
              if (applyGameEndFromPosition()) { finishBotThinking(); return; }
              startUserTurnAfterBot();
            } else {
              undoStack.pop();
              startUserTurnAfterBot();
            }
          } catch (err) {
            console.error("atomic bot move failed", err);
            startUserTurnAfterBot();
          }
        }, 80);
      }

      function onDragStart(source, piece) {
        if (gameOver || botThinking || applyGameEndFromPosition()) return false;
        if (typeof isSpectating === "function" && isSpectating()) return false;
        cancelScheduledBot();
        if (typeof isMultiplayer === "function" && isMultiplayer()) {
          if (!canMpAct() || !mpBothSeated()) return false;
          if (game.turn() !== mpSeat) return false;
          if (piece.charAt(0) !== mpSeat) return false;
        } else {
          if (game.turn() !== userColor) return false;
          if (piece.charAt(0) !== userColor) return false;
        }
        selectedSquare = source;
        $("#board .square-55d63").removeClass("selected");
        $("#board .square-" + source).addClass("selected");
        showLegalMoves(source);
        if (typeof lockDragScroll === "function") lockDragScroll();
        return true;
      }

      function onDrop(source, target) {
        if (typeof unlockDragScroll === "function") unlockDragScroll();
        if (!target || target === "offboard" || source === target) {
          return "snapback";
        }
        clearSelection();
        if (typeof isMultiplayer === "function" && isMultiplayer()) {
          if (!canMpAct()) return "snapback";
        }
        var moved = tryMakeUserMove(source, target);
        if (!moved) return "snapback";
        syncBoard(false);
        updateMoveList();
        updateStatus();
        if (typeof isMultiplayer === "function" && isMultiplayer()) {
          publishMpMove(source, target, moved.san, moved.promotion || null);
          return;
        }
        if (!gameOver && canBotActNow(false)) scheduleBot(250);
        else cancelScheduledBot();
      }

      function onSnapEnd() { syncBoard(false); }

      function tryClickMove(square) {
        if (gameOver || botThinking || applyGameEndFromPosition()) return;
        if (typeof isSpectating === "function" && isSpectating()) return;
        cancelScheduledBot();
        var actColor = userColor;
        if (typeof isMultiplayer === "function" && isMultiplayer()) {
          if (!canMpAct() || !mpBothSeated()) return;
          actColor = mpSeat;
        }
        if (game.turn() !== actColor) return;
        var piece = game.get(square);
        if (!selectedSquare) {
          if (piece && piece.color === actColor) highlightSquare(square);
          return;
        }
        if (selectedSquare === square) { clearSelection(); return; }
        if (piece && piece.color === actColor) { highlightSquare(square); return; }
        var from = selectedSquare;
        clearSelection();
        var moved = tryMakeUserMove(from, square);
        if (!moved) return;
        syncBoard(false);
        updateMoveList();
        updateStatus();
        if (typeof isMultiplayer === "function" && isMultiplayer()) {
          publishMpMove(from, square, moved.san, moved.promotion || null);
          return;
        }
        if (!gameOver && canBotActNow(false)) scheduleBot(250);
        else cancelScheduledBot();
      }

      function boardOrientation() { return userColor === "w" ? "white" : "black"; }
      function saveUserColor() { try { localStorage.setItem(COLOR_KEY, userColor); } catch (e) {} }
      function syncSideSelect() { $("#sideSelect").val(userColor); }

      function newGame() {
        if (typeof isMultiplayer === "function" && isMultiplayer()) {
          if (!canMpAct() || !mpSocket || !mpRoom || mpRoom.hostId !== getOrCreateClientId()) return;
          mpSocket.emit("resetGame", { clientId: getOrCreateClientId(), code: mpRoomCode }, function (res) {
            if (!res || !res.ok) return;
          });
          return;
        }
        cancelScheduledBot();
        undoStack = [];
        plySans = [];
        game.reset();
        gameOver = false;
        botThinking = false;
        clearSelection();
        $thinking.removeClass("show");
        board.orientation(boardOrientation());
        syncBoard(false);
        updateMoveList();
        updateStatus();
        $("#undoBtn").prop("disabled", false);
        if (userColor === "b") scheduleBot(250);
      }

      function undoMove() {
        if (typeof isMultiplayer === "function" && isMultiplayer()) return;
        if (botThinking || undoStack.length === 0) return;
        if (game.turn() === userColor && undoStack.length >= 2) {
          undoStack.pop();
          game.restore(undoStack.pop());
        } else {
          game.restore(undoStack.pop());
        }
        plySans = game.history_san();
        gameOver = false;
        clearSelection();
        syncBoard(false);
        updateMoveList();
        updateStatus();
        cancelScheduledBot();
        if (!gameOver && canBotActNow(false)) scheduleBot(250);
      }

      function onSideChange() {
        if (typeof isMultiplayer === "function" && isMultiplayer()) {
          syncSideSelect();
          return;
        }
        var next = $("#sideSelect").val() === "b" ? "b" : "w";
        userColor = next;
        saveUserColor();
        newGame();
      }

      $(function () {
        i18nReady.then(function () {
        lang = BoardHackI18n.getLang();

        syncSideSelect();
        applyStaticLang();
        wireSettingsMenu();

        if (typeof Chessboard !== "function") {
          setStatus("Chessboard failed to load", "danger");
          return;
        }
        if (!window.BoardHackAtomic) {
          setStatus("Atomic engine failed to load", "danger");
          return;
        }
        board = Chessboard("board", {
          draggable: true,
          position: "start",
          orientation: boardOrientation(),
          pieceTheme: PIECE_THEME,
          onDragStart: onDragStart,
          onDrop: onDrop,
          onSnapEnd: onSnapEnd
        });
        syncBoard(false);

        $("#board").on("click", ".square-55d63", function () {
          var sq = $(this).data("square");
          if (sq) tryClickMove(sq);
        });

        $("#newGameBtn").on("click", newGame);
        $("#undoBtn").on("click", undoMove);
        var rulesDialog = document.getElementById("rulesDialog");
        $("#rulesBtn").on("click", function () {
          if (!rulesDialog.open) rulesDialog.showModal();
        });
        $("#rulesCloseBtn").on("click", function () { rulesDialog.close(); });
        $(rulesDialog).on("click", function (e) {
          if (e.target === rulesDialog) rulesDialog.close();
        });
        $("#sideSelect").on("change", onSideChange);
        $("#difficulty").on("change", function () { updateOpponentLabel(); });
        $("#langRu").on("click", function () { setLang("ru"); });
        $("#langEn").on("click", function () { setLang("en"); });
        $(window).on("resize", function () { board.resize(); });

        updateMoveList();
        updateStatus();

        updateMpUI();
        setMpConn("offline");
        $("#mpRoomsRefreshBtn").on("click", function () {
          ensureMpSocket(function (err) { if (!err) requestRoomList(); });
        });
        $("#mpCreateBtn").on("click", function () { enterMpFromCreate(); });
        $("#mpJoinToggleBtn").on("click", function () {
          $("#mpJoinPanel").toggleClass("mp-hidden");
          $("#mpSpectatePanel").addClass("mp-hidden");
          if (!$("#mpJoinPanel").hasClass("mp-hidden")) $("#mpJoinCode").trigger("focus");
        });
        $("#mpJoinBtn").on("click", function () { enterMpFromJoin($("#mpJoinCode").val()); });
        $("#mpJoinCode").on("keydown", function (e) {
          if (e.key === "Enter") enterMpFromJoin($("#mpJoinCode").val());
        });
        $("#mpSpectateToggleBtn").on("click", function () {
          $("#mpSpectatePanel").toggleClass("mp-hidden");
          $("#mpJoinPanel").addClass("mp-hidden");
          if (!$("#mpSpectatePanel").hasClass("mp-hidden")) $("#mpSpectateCode").trigger("focus");
        });
        $("#mpSpectateBtn").on("click", function () { enterMpFromSpectate($("#mpSpectateCode").val()); });
        $("#mpSpectateCode").on("keydown", function (e) {
          if (e.key === "Enter") enterMpFromSpectate($("#mpSpectateCode").val());
        });
        $("#mpNick").on("change blur", persistNickFromInput);
        $("#mpCopyBtn").on("click", function () {
          var link = buildShareLink(mpRoomCode);
          var done = function () {
            var toast = document.getElementById("mpCopyToast");
            if (toast) {
              toast.textContent = t("mpCopied");
              toast.classList.add("show");
              window.clearTimeout(toast._hideTimer);
              toast._hideTimer = window.setTimeout(function () { toast.classList.remove("show"); }, 1200);
            }
            $("#mpCopyBtn").text(t("mpCopied"));
            window.setTimeout(function () { $("#mpCopyBtn").text(mpRoomCode ? copyBtnLabel() : t("mpCopyInvite")); }, 1200);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(link).then(done).catch(function () {
              try { window.prompt(t("mpCodeLabel"), link); } catch (e) {}
            });
          } else {
            try { window.prompt(t("mpCodeLabel"), link); done(); } catch (e) {}
          }
        });
        $("#mpSeatW").on("click keydown", function (e) {
          if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
          if (e.type === "keydown") e.preventDefault();
          claimMpSeat("w");
        });
        $("#mpSeatB").on("click keydown", function (e) {
          if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
          if (e.type === "keydown") e.preventDefault();
          claimMpSeat("b");
        });
        $("#mpLeaveBtn").on("click", function () { leaveMultiplayer(); });
        $("#mpResetBtn").on("click", newGame);

        var _paramsEarly = new URLSearchParams(window.location.search);
        var _maybeMp = !!(_paramsEarly.get("join") || _paramsEarly.get("room") || _paramsEarly.get("spectate") || (function () {
          try { return localStorage.getItem(MP_ROOM_KEY); } catch (e) { return null; }
        })());
        tryAutoRejoin();


        if (!isMultiplayer() && !_maybeMp) {
          if (userColor === "b") scheduleBot(250);
        }
              });
      });
    })();
  </script>
</body>
</html>
