<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardHack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/boardhack.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a href="index.html">
          <div class="brand-mark">♞</div>
          <div>Board<span class="accent">Hack</span></div>
        </a>
      </div>
      <div class="topbar-actions">
        <div class="mode-menu" id="modeMenu">
          <button type="button" class="mode-menu-btn" id="modeMenuBtn" aria-haspopup="true" aria-expanded="false">
            <span id="modeMenuLabel">Режим</span>
            <span class="chev">▾</span>
          </button>
          <div class="mode-menu-panel" id="modeMenuPanel" role="menu">
            <a href="gamemodes/classic/index.html" data-mode="classic">
              <span>♟</span>
              <span>
                <span id="menuClassic">Классика</span>
                <span class="mode-desc" id="menuClassicDesc">Стандартные шахматы</span>
              </span>
            </a>
            <a href="gamemodes/dice/index.html" data-mode="dice">
              <span>🎲</span>
              <span>
                <span id="menuDice">Кости</span>
                <span class="mode-desc" id="menuDiceDesc">Ходы по броску костей</span>
              </span>
            </a>
          </div>
        </div>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" id="langRu" data-lang="ru">RU</button>
          <span class="lang-sep">|</span>
          <button type="button" id="langEn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="mode-cards">
      <a class="mode-card" href="gamemodes/classic/index.html">
        <h2>♟ <span id="cardClassicTitle">Классика</span></h2>
        <p id="cardClassicDesc">Стандартные FIDE-шахматы. Ход за ходом, без ограничений по фигурам.</p>
        <div class="go" id="cardClassicGo">Открыть →</div>
      </a>
      <a class="mode-card" href="gamemodes/dice/index.html">
        <h2>🎲 <span id="cardDiceTitle">Кости</span></h2>
        <p id="cardDiceDesc">Каждый ход бросаются кости — ходите только выпавшими типами фигур. Можно 1–3 кости.</p>
        <div class="go" id="cardDiceGo">Открыть →</div>
      </a>
    </div>

    <footer class="footer">BoardHack</footer>
  </main>

  <script>
    (function () {
      "use strict";
      var LANG_KEY = "boardhack-lang";
      var MODE_KEY = "boardhack-mode";
      var I18N = {
        ru: {
          docTitle: "BoardHack — Взломай доску",
          heroTitleHtml: 'Взломай доску. <span class="accent">Захвати флаг.</span>',
          heroDesc: "Тёмная шахматная лаборатория. Выберите режим, сторону и сложность — затем переиграйте бота.",
          menuLabel: "Режим",
          menuClassic: "Классика",
          menuClassicDesc: "Стандартные шахматы",
          menuDice: "Кости",
          menuDiceDesc: "Ходы по броску костей",
          cardClassicTitle: "Классика",
          cardClassicDesc: "Стандартные FIDE-шахматы. Ход за ходом, без ограничений по фигурам.",
          cardClassicGo: "Открыть →",
          cardDiceTitle: "Кости",
          cardDiceDesc: "Каждый ход бросаются кости — ходите только выпавшими типами фигур. Можно 1–3 кости.",
          cardDiceGo: "Открыть →"
        },
        en: {
          docTitle: "BoardHack — Hack the Board",
          heroTitleHtml: 'Breach the board. <span class="accent">Capture the flag.</span>',
          heroDesc: "Dark-ops chess lab. Pick a mode, side, and difficulty — then outsmart the bot.",
          menuLabel: "Mode",
          menuClassic: "Classic",
          menuClassicDesc: "Standard chess",
          menuDice: "Dice Chess",
          menuDiceDesc: "Move by dice rolls",
          cardClassicTitle: "Classic",
          cardClassicDesc: "Standard FIDE chess. Move by move, no piece restrictions.",
          cardClassicGo: "Open →",
          cardDiceTitle: "Dice Chess",
          cardDiceDesc: "Each turn rolls dice — move only the rolled piece types. 1–3 dice.",
          cardDiceGo: "Open →"
        }
      };

      var lang = "ru";
      try {
        var saved = localStorage.getItem(LANG_KEY);
        if (saved === "en" || saved === "ru") lang = saved;
      } catch (e) {}

      function t(key) {
        var pack = I18N[lang] || I18N.ru;
        return pack[key] != null ? pack[key] : (I18N.en[key] || key);
      }

      function applyLang() {
        document.documentElement.lang = lang;
        document.title = t("docTitle");
        document.getElementById("modeMenuLabel").textContent = t("menuLabel");
        document.getElementById("menuClassic").textContent = t("menuClassic");
        document.getElementById("menuClassicDesc").textContent = t("menuClassicDesc");
        document.getElementById("menuDice").textContent = t("menuDice");
        document.getElementById("menuDiceDesc").textContent = t("menuDiceDesc");
        document.getElementById("cardClassicTitle").textContent = t("cardClassicTitle");
        document.getElementById("cardClassicDesc").textContent = t("cardClassicDesc");
        document.getElementById("cardClassicGo").textContent = t("cardClassicGo");
        document.getElementById("cardDiceTitle").textContent = t("cardDiceTitle");
        document.getElementById("cardDiceDesc").textContent = t("cardDiceDesc");
        document.getElementById("cardDiceGo").textContent = t("cardDiceGo");
        document.getElementById("langRu").classList.toggle("active", lang === "ru");
        document.getElementById("langEn").classList.toggle("active", lang === "en");
      }

      function setLang(next) {
        if (next !== "ru" && next !== "en") return;
        lang = next;
        try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
        applyLang();
      }

      var menu = document.getElementById("modeMenu");
      var btn = document.getElementById("modeMenuBtn");
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = !menu.classList.contains("open");
        menu.classList.toggle("open", open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      });
      document.addEventListener("click", function () {
        menu.classList.remove("open");
        btn.setAttribute("aria-expanded", "false");
      });
      menu.addEventListener("click", function (e) { e.stopPropagation(); });

      document.getElementById("langRu").addEventListener("click", function () { setLang("ru"); });
      document.getElementById("langEn").addEventListener("click", function () { setLang("en"); });

      // Remember last mode for convenience (optional deep-link hint only)
      try {
        var last = localStorage.getItem(MODE_KEY);
        if (last === "classic" || last === "dice") {
          /* no auto-redirect — shell stays as chooser */
        }
      } catch (e) {}

      applyLang();
    })();
  </script>
</body>
</html>
